<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejja Credit | Active Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #edf4ff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: #0d47a1; color: white; }
        .logo { padding: 25px; font-size: 24px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,.2); }
        .sidebar a { display: block; padding: 15px 25px; color: white; text-decoration: none; }
        .sidebar a:hover { background: #1565c0; }
        .main { margin-left: 260px; }
        .topbar { height: 70px; background: #1976d2; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .content { padding: 30px; }
        .table-card { background: white; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,.12); overflow: hidden; }
        .table-header { background: #1976d2; color: white; padding: 18px 25px; font-size: 20px; font-weight: bold; }
        .table th { background: #e3f2fd; color: #0d47a1; }
        .table td, .table th { padding: 12px; vertical-align: middle; text-align: center; }
        .btn-view { background: #1976d2; color: white; border-radius: 20px; font-size: 12px; }
        .btn-payment { background: #198754; color: white; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo"><i class="fa fa-building-columns"></i> Bejja Credit</div>
    <a href="admin-dashboard.html"><i class="fa fa-dashboard"></i> Dashboard</a>
    <a href="registered-clients.html"><i class="fa fa-users"></i> Registered Clients</a>
    <a href="active-loans.html"><i class="fa fa-money-bill-wave"></i> Active Loans</a>
    <a href="late-loans.html"><i class="fa fa-triangle-exclamation"></i> Late Loans</a>
    <a href="loan-applications.html"><i class="fa fa-file-circle-check"></i> Loan Applications</a>
    <a href="statistics.html"><i class="fa fa-chart-column"></i> Statistics</a>
    <a href="#" onclick="logout()"><i class="fa fa-right-from-bracket"></i> Logout</a>
</div>

<div class="main">
    <div class="topbar">
        <h3><i class="fa fa-money-bill-wave"></i> Active Loans</h3>
        <div>
            <a href="admin-dashboard.html" class="btn btn-sm btn-light me-2">Back</a>
            <span>Welcome, <strong id="adminName">Admin</strong></span>
        </div>
    </div>
    <div class="content">
        <div class="table-card">
            <div class="table-header">Active Loans</div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Client</th>
                            <th>Phone</th>
                            <th>Amount</th>
                            <th>Balance</th>
                            <th>Interest</th>
                            <th>Due Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="activeLoansTable">
                        <tr><td colspan="8" class="text-center p-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if (!AUTH.currentAdmin()) { window.location.href = "admin-login.html"; }
    
    let admin = AUTH.currentAdmin();
    if (admin) document.getElementById("adminName").innerHTML = admin.username;
    
    function money(v) { return "KES " + Number(v || 0).toLocaleString(); }
    
    async function loadActiveLoans() {
        let result = await api.getLoans();
        let table = document.getElementById("activeLoansTable");
        table.innerHTML = "";
        
        if (!result.success || !result.loans) {
            table.innerHTML = '<tr><td colspan="8" class="text-center p-4">No active loans.</td></tr>';
            return;
        }
        
        let today = new Date();
        today.setHours(0, 0, 0, 0);
        
        let active = result.loans.filter(l => {
            if (l.status !== "ACTIVE") return false;
            if (Number(l.remaining_principal || 0) <= 0) return false;
            if (!l.due_date) return true;
            let d = new Date(l.due_date);
            d.setHours(0, 0, 0, 0);
            return d >= today;
        });
        
        if (active.length === 0) {
            table.innerHTML = '<tr><td colspan="8" class="text-center p-4">No active loans.</td></tr>';
            return;
        }
        
        active.reverse().forEach((l, i) => {
            let bal = Number(l.remaining_principal || 0);
            let rate = Number(l.interest_rate || 20);
            let interest = (bal * rate) / 100;
            
            table.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td><b>${l.fullname || "Unknown"}</b></td>
                    <td>${l.phone || "-"}</td>
                    <td>${money(l.original_principal)}</td>
                    <td class="text-danger fw-bold">${money(bal)}</td>
                    <td>${money(interest)} (${rate}%)</td>
                    <td><span class="badge bg-success">${formatDate(l.due_date)}</span></td>
                    <td>
                        <button class="btn btn-view btn-sm" onclick="window.location.href='active-loans.html'">
                            <i class="fa fa-eye"></i> View
                        </button>
                    </td>
                </tr>
            `;
        });
    }
    
    function logout() { AUTH.adminLogout(); }
    loadActiveLoans();
</script>
</body>
</html>
