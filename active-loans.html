<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejja Credit | Active Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0d47a1; --primary-light: #1976d2; --success: #198754; --white: #ffffff; --bg-light: #edf4ff; --shadow: 0 8px 25px rgba(0,0,0,0.12); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-light); font-family: 'Segoe UI', Tahoma, sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: linear-gradient(180deg, #0a3d8f, #0d47a1, #1565c0); color: var(--white); z-index: 1000; overflow-y: auto; }
        .logo { padding: 22px 20px; font-size: 20px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; gap: 10px; }
        .logo i { color: #ffc107; font-size: 24px; }
        .sidebar a { display: flex; align-items: center; padding: 13px 20px; color: rgba(255,255,255,0.85); text-decoration: none; transition: all 0.3s; font-size: 14px; font-weight: 500; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); color: var(--white); border-left-color: #ffc107; padding-left: 25px; }
        .sidebar a i { width: 22px; margin-right: 10px; }
        .main { margin-left: 260px; min-height: 100vh; }
        .topbar { height: 65px; background: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 999; }
        .topbar h3 { font-weight: 700; color: var(--primary); margin: 0; }
        .topbar .btn-back { background: var(--bg-light); color: var(--primary); padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; }
        .topbar .btn-back:hover { background: var(--primary); color: var(--white); }
        .content { padding: 25px; }
        .table-card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
        .table-header { background: var(--primary-light); color: var(--white); padding: 16px 22px; font-size: 18px; font-weight: 700; }
        .table th { background: #e3f2fd; color: var(--primary); font-weight: 600; font-size: 13px; text-align: center; padding: 12px; }
        .table td { text-align: center; vertical-align: middle; font-size: 13px; padding: 12px; }
        .btn-payment { background: var(--success); color: var(--white); border-radius: 20px; font-size: 12px; padding: 6px 14px; }
        .btn-payment:hover { background: #157347; color: var(--white); }
        .btn-details { background: var(--primary-light); color: var(--white); border-radius: 20px; font-size: 12px; padding: 6px 14px; }
        .btn-details:hover { background: var(--primary); color: var(--white); }
        .btn-guarantors { background: #6f42c1; color: var(--white); border-radius: 20px; font-size: 12px; padding: 6px 14px; }
        .btn-guarantors:hover { background: #5a3399; color: var(--white); }
        .modal-header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: var(--white); }
        .modal-header .btn-close { filter: brightness(0) invert(1); }
        .detail-card { background: #f8faff; border-radius: 12px; padding: 18px; margin-bottom: 12px; border: 1px solid #dbeafe; }
        .section-title { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: var(--white); padding: 12px 18px; border-radius: 10px; margin: 15px 0; font-weight: 700; }
        .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .info-label { font-weight: 600; color: var(--primary); width: 160px; flex-shrink: 0; font-size: 13px; }
        .info-value { color: #444; font-size: 13px; }
        .document-img { width: 100%; height: 100px; object-fit: contain; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; margin-top: 4px; }
        .guarantor-photo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light); }
        .profile-img-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-light); }
        @media (max-width: 992px) { .sidebar { transform: translateX(-100%); } .sidebar.show { transform: translateX(0); } .main { margin-left: 0; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
        <a href="admin-dashboard.html"><i class="fa fa-dashboard"></i>Dashboard</a>
        <a href="registered-clients.html"><i class="fa fa-users"></i>Registered Clients</a>
        <a href="active-loans.html" class="active"><i class="fa fa-money-bill-wave"></i>Active Loans</a>
        <a href="late-loans.html"><i class="fa fa-triangle-exclamation"></i>Late Loans</a>
        <a href="total-loans.html"><i class="fa fa-file-invoice"></i>Total Loans</a>
        <a href="loan-applications.html"><i class="fa fa-file-circle-check"></i>Applications</a>
        <a href="statistics.html"><i class="fa fa-chart-column"></i>Statistics</a>
        <a href="#" onclick="logout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
    </div>

    <div class="main">
        <div class="topbar">
            <h3><i class="fa fa-money-bill-wave"></i> Active Loans</h3>
            <div class="d-flex align-items-center gap-3">
                <a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a>
                <span>Welcome, <strong id="adminName">Admin</strong></span>
            </div>
        </div>

        <div class="content">
            <div class="table-card">
                <div class="table-header"><i class="fa fa-list"></i> Active Loan List</div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr><th>#</th><th>Client</th><th>Phone</th><th>Amount</th><th>Balance</th><th>Interest/Mo</th><th>Due Date</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="activeLoansTable">
                            <tr><td colspan="8" class="text-center text-muted p-5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal fade" id="paymentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fa fa-money-bill"></i> Record Payment</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="paymentLoanId">
                    <div class="alert alert-info" id="loanInfo"></div>
                    <label class="form-label">Amount (KSh)</label>
                    <input type="number" id="paymentAmount" class="form-control mb-3" placeholder="Enter amount" min="100">
                    <label class="form-label">Payment Method</label>
                    <select id="paymentMethod" class="form-select mb-3">
                        <option value="Cash">Cash</option>
                        <option value="M-Pesa">M-Pesa</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="savePayment()"><i class="fa fa-check"></i> Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loan Details Modal -->
    <div class="modal fade" id="loanDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa fa-file-invoice-dollar"></i> Loan Details</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="loanDetailsContent" style="max-height:70vh;overflow-y:auto;">
                    <p class="text-center text-muted p-4">Loading...</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        if (!AUTH.currentAdmin()) { window.location.href = "admin-portal.html"; }
        let admin = AUTH.currentAdmin();
        if (admin) document.getElementById("adminName").innerHTML = admin.username;

        const DEFAULT_IMG = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

        function money(v) { return "KES " + Number(v || 0).toLocaleString("en-KE", { minimumFractionDigits: 2 }); }

        function showFullImage(src, title) {
            if (!src) { alert("No image available"); return; }
            let m = document.createElement("div");
            m.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:pointer;";
            m.innerHTML = `<div style="max-width:95%;max-height:95%;text-align:center;"><h5 style="color:white;margin-bottom:15px;">${title}</h5><img src="${src}" style="max-width:100%;max-height:85vh;border-radius:10px;"><br><small style="color:#ccc;margin-top:10px;display:inline-block;">Click anywhere to close</small></div>`;
            m.onclick = function() { document.body.removeChild(m); };
            document.body.appendChild(m);
        }

        async function loadActiveLoans() {
            let result = await api.getLoans();
            let table = document.getElementById("activeLoansTable");
            table.innerHTML = "";

            if (!result.success || !result.loans) {
                table.innerHTML = '<tr><td colspan="8" class="text-center p-4">No active loans.</td></tr>';
                return;
            }

            let today = new Date();
            today.setHours(0, 0, 0, 0);

            let active = result.loans.filter(l => {
                if (l.status !== "ACTIVE") return false;
                if (Number(l.remaining_principal || 0) <= 0) return false;
                if (!l.due_date) return true;
                let d = new Date(l.due_date);
                d.setHours(0, 0, 0, 0);
                return d >= today;
            });

            if (active.length === 0) {
                table.innerHTML = '<tr><td colspan="8" class="text-center text-muted p-4">No active loans.</td></tr>';
                return;
            }

            active.reverse().forEach((l, i) => {
                let bal = Number(l.remaining_principal || 0);
                let rate = Number(l.interest_rate || 20);
                let interest = (bal * rate) / 100;

                table.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td><b>${l.fullname || "Unknown"}</b></td>
                        <td>${l.phone || "-"}</td>
                        <td><strong>${money(l.original_principal)}</strong></td>
                        <td class="text-danger fw-bold">${money(bal)}</td>
                        <td>${money(interest)} (${rate}%)</td>
                        <td><span class="badge bg-success">${formatDate(l.due_date)}</span></td>
                        <td>
                            <button class="btn btn-details btn-sm" onclick="viewLoanDetails(${l.id})">
                                <i class="fa fa-eye"></i> Details
                            </button>
                            <button class="btn btn-payment btn-sm" onclick="openPayment(${l.id}, ${bal}, ${rate})">
                                <i class="fa fa-money-bill"></i> Pay
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function openPayment(loanId, balance, rate) {
            document.getElementById("paymentLoanId").value = loanId;
            document.getElementById("paymentAmount").value = "";
            document.getElementById("loanInfo").innerHTML = `
                <strong>Balance:</strong> ${money(balance)}<br>
                <strong>Rate:</strong> ${rate}%<br>
                <strong>Monthly Interest:</strong> ${money((balance * rate) / 100)}
            `;
            new bootstrap.Modal(document.getElementById("paymentModal")).show();
        }

        async function savePayment() {
            let loanId = document.getElementById("paymentLoanId").value;
            let amount = Number(document.getElementById("paymentAmount").value);
            let method = document.getElementById("paymentMethod").value;
            
            if (amount <= 0) { alert("Please enter a valid amount."); return; }

            let result = await api.addPayment({
                loanId, amount,
                paymentDate: new Date().toISOString().split("T")[0],
                method, note: "Payment"
            });

            if (result.success) {
                alert(result.message);
            } else {
                alert("❌ Payment failed: " + (result.message || "Unknown error"));
            }

            bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();
            loadActiveLoans();
        }

        // ==================== VIEW LOAN DETAILS ====================
        async function viewLoanDetails(loanId) {
            document.getElementById("loanDetailsContent").innerHTML = 
                '<p class="text-center text-muted p-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</p>';
            
            new bootstrap.Modal(document.getElementById("loanDetailsModal")).show();

            try {
                const [loansResult, appsResult] = await Promise.all([
                    api.getLoans(),
                    api.getApplications()
                ]);

                if (!loansResult.success) {
                    document.getElementById("loanDetailsContent").innerHTML = '<p class="text-danger">Failed to load loan data.</p>';
                    return;
                }

                const loan = loansResult.loans.find(l => l.id == loanId);
                if (!loan) {
                    document.getElementById("loanDetailsContent").innerHTML = '<p class="text-danger">Loan not found.</p>';
                    return;
                }

                const clientResult = await api.getClient(loan.client_id);
                const client = clientResult.success ? clientResult.client : {};

                const paymentsResult = await api.getLoanPayments(loanId);
                const payments = paymentsResult.success ? (paymentsResult.payments || []) : [];

                const applications = appsResult.success ? (appsResult.applications || []) : [];
                const application = applications.find(a => a.id == loan.application_id);

                const bal = Number(loan.remaining_principal || 0);
                const original = Number(loan.original_principal || 0);
                const rate = Number(loan.interest_rate || 20);
                const interest = (bal * rate) / 100;
                const paid = original - bal;
                const progressPct = original > 0 ? Math.round((paid / original) * 100) : 0;

                let html = `
                    <div class="section-title"><i class="fa fa-user"></i> Client Information</div>
                    <div class="detail-card">
                        <div class="row">
                            <div class="col-md-3 text-center">
                                <img src="${client.profile_photo || loan.profile_photo || DEFAULT_IMG}" class="profile-img-large mb-2" onerror="this.src='${DEFAULT_IMG}'">
                                <h6>${client.fullname || loan.fullname || "-"}</h6>
                                <span class="badge bg-${client.status === 'ACTIVE' ? 'success' : 'warning'}">${client.status || 'ACTIVE'}</span>
                            </div>
                            <div class="col-md-9">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="info-row"><div class="info-label">Phone</div><div class="info-value">${client.phone || loan.phone || "-"}</div></div>
                                        <div class="info-row"><div class="info-label">National ID</div><div class="info-value">${client.national_id || loan.national_id || "-"}</div></div>
                                        <div class="info-row"><div class="info-label">Email</div><div class="info-value">${client.email || "-"}</div></div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="info-row"><div class="info-label">Occupation</div><div class="info-value">${client.occupation || "-"}</div></div>
                                        <div class="info-row"><div class="info-label">Employer</div><div class="info-value">${client.employer || "-"}</div></div>
                                        <div class="info-row"><div class="info-label">Monthly Income</div><div class="info-value fw-bold">${money(client.monthly_income)}</div></div>
                                    </div>
                                </div>
                                <div class="info-row"><div class="info-label">County</div><div class="info-value">${client.county || "-"}</div></div>
                                <div class="info-row"><div class="info-label">Address</div><div class="info-value">${client.address || "-"}</div></div>
                            </div>
                        </div>
                    </div>

                    <div class="section-title"><i class="fa fa-money-bill"></i> Loan Information</div>
                    <div class="detail-card">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="info-row"><div class="info-label">Original Amount</div><div class="info-value fw-bold">${money(original)}</div></div>
                                <div class="info-row"><div class="info-label">Remaining Balance</div><div class="info-value text-danger fw-bold">${money(bal)}</div></div>
                                <div class="info-row"><div class="info-label">Amount Repaid</div><div class="info-value text-success fw-bold">${money(paid)}</div></div>
                                <div class="info-row"><div class="info-label">Interest Rate</div><div class="info-value">${rate}%</div></div>
                                <div class="info-row"><div class="info-label">Monthly Interest</div><div class="info-value">${money(interest)}</div></div>
                            </div>
                            <div class="col-md-6">
                                <div class="info-row"><div class="info-label">Loan Date</div><div class="info-value">${formatDate(loan.loan_date)}</div></div>
                                <div class="info-row"><div class="info-label">Due Date</div><div class="info-value fw-bold">${formatDate(loan.due_date)}</div></div>
                                <div class="info-row"><div class="info-label">Status</div><div class="info-value"><span class="badge bg-success">${loan.status}</span></div></div>
                                <div class="info-row"><div class="info-label">Total Paid</div><div class="info-value">${money(loan.total_paid || 0)}</div></div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="fw-bold">Repayment Progress: ${progressPct}%</label>
                            <div class="progress" style="height:20px;">
                                <div class="progress-bar bg-success" style="width:${progressPct}%">${progressPct}%</div>
                            </div>
                        </div>
                    </div>

                    <div class="section-title"><i class="fa fa-history"></i> Payment History (${payments.length} payments)</div>
                    <div class="detail-card">
                        ${payments.length === 0 ? '<p class="text-center text-muted">No payments recorded yet.</p>' : `
                            <div class="table-responsive">
                                <table class="table table-bordered table-striped">
                                    <thead class="table-light">
                                        <tr><th>#</th><th>Date</th><th>Amount</th><th>Balance</th><th>Method</th><th>Note</th></tr>
                                    </thead>
                                    <tbody>
                                        ${payments.map((p, i) => `
                                            <tr>
                                                <td>${i + 1}</td>
                                                <td>${formatDate(p.payment_date)}</td>
                                                <td class="fw-bold">${money(p.amount)}</td>
                                                <td>${money(p.balance)}</td>
                                                <td>${p.payment_method || p.method || "-"}</td>
                                                <td>${p.note || "-"}</td>
                                            </tr>
                                        `).join("")}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>

                    <div class="section-title"><i class="fa fa-users"></i> Guarantors</div>
                `;

                if (application && (application.guarantor1?.name || application.guarantor2?.name)) {
                    html += `
                        <div class="detail-card">
                            <div class="row">
                                <div class="col-md-6">
                                    ${renderGuarantorCard(application.guarantor1, "Guarantor 1")}
                                </div>
                                <div class="col-md-6">
                                    ${renderGuarantorCard(application.guarantor2, "Guarantor 2")}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `<div class="detail-card"><p class="text-center text-muted">No guarantor information available for this loan.</p></div>`;
                }

                document.getElementById("loanDetailsContent").innerHTML = html;

            } catch (error) {
                console.error("View details error:", error);
                document.getElementById("loanDetailsContent").innerHTML = '<p class="text-danger">Failed to load details.</p>';
            }
        }

        function renderGuarantorCard(g, title) {
            if (!g || !g.name) {
                return `<div class="text-center p-3"><i class="fa fa-user-slash" style="font-size:40px;color:#ccc;"></i><p class="text-muted mt-2">${title}: Not provided</p></div>`;
            }
            return `
                <div style="border:1px solid #e0e0e0;border-radius:12px;padding:15px;">
                    <div class="text-center mb-3">
                        <img src="${g.photo || DEFAULT_IMG}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary-light);" onerror="this.src='${DEFAULT_IMG}'">
                        <h6 class="mt-2">${g.name || "-"}</h6>
                        <span class="badge bg-info">${title}</span>
                    </div>
                    <div class="info-row"><div class="info-label">Phone</div><div class="info-value">${g.phone || "-"}</div></div>
                    <div class="info-row"><div class="info-label">National ID</div><div class="info-value">${g.id || "-"}</div></div>
                    <div class="info-row"><div class="info-label">Relationship</div><div class="info-value">${g.relationship || "-"}</div></div>
                    <div class="info-row"><div class="info-label">Address</div><div class="info-value">${g.address || "-"}</div></div>
                    <div class="row mt-2">
                        <div class="col-6 text-center">
                            <small class="fw-bold">ID Front</small>
                            ${g.idFront ? `<img src="${g.idFront}" class="document-img" onclick="showFullImage('${g.idFront}','${title} ID Front')">` : '<p class="text-muted small">N/A</p>'}
                        </div>
                        <div class="col-6 text-center">
                            <small class="fw-bold">ID Back</small>
                            ${g.idBack ? `<img src="${g.idBack}" class="document-img" onclick="showFullImage('${g.idBack}','${title} ID Back')">` : '<p class="text-muted small">N/A</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function logout() { if (confirm("Logout?")) AUTH.adminLogout(); }
        loadActiveLoans();
    </script>
</body>
</html>
