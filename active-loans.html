<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if (!AUTH.currentAdmin()) { window.location.href = "admin-login.html"; }
    
    let admin = AUTH.currentAdmin();
    if (admin) document.getElementById("adminName").innerHTML = admin.username;
    
    function money(v) { return "KES " + Number(v || 0).toLocaleString(); }
    const DEFAULT_IMG = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
    
    async function loadActiveLoans() {
        let result = await api.getLoans();
        let table = document.getElementById("activeLoansTable");
        table.innerHTML = "";
        
        if (!result.success || !result.loans) {
            table.innerHTML = '<tr><td colspan="8" class="text-center p-4">No active loans.</td></tr>';
            return;
        }
        
        let today = new Date();
        today.setHours(0, 0, 0, 0);
        
        let active = result.loans.filter(l => {
            if (l.status !== "ACTIVE") return false;
            if (Number(l.remaining_principal || 0) <= 0) return false;
            if (!l.due_date) return true;
            let d = new Date(l.due_date);
            d.setHours(0, 0, 0, 0);
            return d >= today;
        });
        
        if (active.length === 0) {
            table.innerHTML = '<tr><td colspan="8" class="text-center p-4">No active loans.</td></tr>';
            return;
        }
        
        active.reverse().forEach((l, i) => {
            let bal = Number(l.remaining_principal || 0);
            let rate = Number(l.interest_rate || 20);
            let interest = (bal * rate) / 100;
            
            table.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td><b>${l.fullname || "Unknown"}</b></td>
                    <td>${l.phone || "-"}</td>
                    <td>${money(l.original_principal)}</td>
                    <td class="text-danger fw-bold">${money(bal)}</td>
                    <td>${money(interest)} (${rate}%)</td>
                    <td><span class="badge bg-success">${formatDate(l.due_date)}</span></td>
                    <td>
                        <button class="btn btn-view btn-sm" onclick="viewLoan(${l.id})">
                            <i class="fa fa-eye"></i> View
                        </button>
                    </td>
                </tr>
            `;
        });
    }
    
    // VIEW LOAN DETAILS
    async function viewLoan(id) {
        // Get loan data
        let result = await api.getLoans();
        if (!result.success) return;
        
        let loan = result.loans.find(l => l.id == id);
        if (!loan) return;
        
        let balance = Number(loan.remaining_principal || 0);
        let original = Number(loan.original_principal || 0);
        let rate = Number(loan.interest_rate || 20);
        let interest = (balance * rate) / 100;
        let paid = original - balance;
        let progressPct = original > 0 ? Math.round((paid / original) * 100) : 0;
        
        // Get client details
        let clientResult = await api.getClient(loan.client_id);
        let client = clientResult.success ? clientResult.client : {};
        
        // Get payment history
        let pResult = await api.getLoanPayments(id);
        let payments = pResult.success ? (pResult.payments || []) : [];
        
        // Create modal HTML
        let modalHTML = `
            <div class="modal fade" id="loanDetailModal" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title"><i class="fa fa-file-invoice-dollar"></i> Loan Details</h5>
                            <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <h6 class="fw-bold text-primary">Client Information</h6>
                            <table class="table table-bordered">
                                <tr><td width="150"><b>Name</b></td><td>${client.fullname || loan.fullname || "-"}</td></tr>
                                <tr><td><b>Phone</b></td><td>${client.phone || loan.phone || "-"}</td></tr>
                                <tr><td><b>National ID</b></td><td>${client.national_id || "-"}</td></tr>
                                <tr><td><b>Email</b></td><td>${client.email || "-"}</td></tr>
                            </table>
                            
                            <h6 class="fw-bold text-primary mt-3">Loan Information</h6>
                            <table class="table table-bordered">
                                <tr><td width="150"><b>Original Amount</b></td><td class="fw-bold">${money(original)}</td></tr>
                                <tr><td><b>Remaining Balance</b></td><td class="text-danger fw-bold">${money(balance)}</td></tr>
                                <tr><td><b>Interest Rate</b></td><td>${rate}%</td></tr>
                                <tr><td><b>Monthly Interest</b></td><td>${money(interest)}</td></tr>
                                <tr><td><b>Amount Repaid</b></td><td class="text-success fw-bold">${money(paid)}</td></tr>
                                <tr><td><b>Loan Date</b></td><td>${formatDate(loan.loan_date)}</td></tr>
                                <tr><td><b>Due Date</b></td><td><span class="badge bg-success">${formatDate(loan.due_date)}</span></td></tr>
                                <tr><td><b>Status</b></td><td><span class="badge bg-success">${loan.status}</span></td></tr>
                            </table>
                            
                            <p><b>Repayment Progress:</b></p>
                            <div class="progress" style="height:20px;">
                                <div class="progress-bar bg-success" style="width:${progressPct}%">${progressPct}%</div>
                            </div>
                            
                            <h6 class="fw-bold text-primary mt-3">Payment History</h6>
                            <table class="table table-bordered table-striped">
                                <thead class="table-light">
                                    <tr><th>Date</th><th>Amount</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>
                                </thead>
                                <tbody>
                                    ${payments.length === 0 ? 
                                        '<tr><td colspan="5" class="text-center text-muted">No payments yet</td></tr>' :
                                        payments.map(p => `
                                            <tr>
                                                <td>${formatDate(p.payment_date)}</td>
                                                <td class="fw-bold">${money(p.amount)}</td>
                                                <td>${money(p.principal_paid)}</td>
                                                <td>${money(p.interest_paid)}</td>
                                                <td>${money(p.balance)}</td>
                                            </tr>
                                        `).join("")
                                    }
                                </tbody>
                            </table>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        // Remove old modal if exists
        let oldModal = document.getElementById("loanDetailModal");
        if (oldModal) oldModal.remove();
        
        // Add new modal to body
        document.body.insertAdjacentHTML("beforeend", modalHTML);
        
        // Show modal
        let modal = new bootstrap.Modal(document.getElementById("loanDetailModal"));
        modal.show();
        
        // Remove modal after close
        document.getElementById("loanDetailModal").addEventListener("hidden.bs.modal", function() {
            this.remove();
        });
    }
    
    function logout() { AUTH.adminLogout(); }
    loadActiveLoans();
</script>
