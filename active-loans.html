<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejja Credit | Active Loans</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0d47a1;color:white;}
.logo{padding:25px;font-size:26px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:10px;}
.sidebar a{display:block;padding:15px 25px;color:white;text-decoration:none;transition:.3s;}
.sidebar a:hover{background:#1565c0;padding-left:35px;}.sidebar i{width:25px;}
.main{margin-left:260px;}
.topbar{height:70px;background:#1976d2;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 30px;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.topbar h2{font-weight:700;}.topbar .topbar-right{display:flex;align-items:center;gap:15px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{padding:30px;}
.table-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.12);}
.table-header{background:#1976d2;color:white;padding:18px 25px;font-size:22px;font-weight:bold;}
.table th{background:#e3f2fd;color:#0d47a1;}.table td,.table th{padding:15px;vertical-align:middle;}
.btn-view{background:#1976d2;color:white;border-radius:20px;}
.btn-payment{background:#198754;color:white;border-radius:20px;}
.btn-guarantors{background:#6f42c1;color:white;border-radius:20px;}
.btn-guarantors:hover{background:#5a3399;color:white;}
.section-title{background:#0d47a1;color:white;padding:10px 15px;border-radius:10px;margin-top:15px;font-weight:bold;}
.detail-card{background:#f8fbff;border-radius:15px;padding:15px;margin-bottom:15px;border:1px solid #dbeafe;}
.document-img{width:100%;height:160px;object-fit:contain;border-radius:10px;border:1px solid #ddd;margin-top:5px;}
.guarantor-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #2563eb;}
.profile-img-large{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #1976d2;}
.payment-note{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:10px 15px;margin-top:10px;font-size:14px;color:#856404;}
.btn-doc{font-size:12px;padding:4px 10px;}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<a href="admin-dashboard.html"><i class="fa fa-dashboard"></i>Dashboard</a>
<a href="registered-clients.html"><i class="fa fa-users"></i>Registered Clients</a>
<a href="active-loans.html"><i class="fa fa-money-bill-wave"></i>Active Loans</a>
<a href="late-loans.html"><i class="fa fa-triangle-exclamation"></i>Late Loans</a>
<a href="loan-applications.html"><i class="fa fa-file-circle-check"></i>Loan Applications</a>
<a href="statistics.html"><i class="fa fa-chart-column"></i>Statistics</a>
<a href="#" onclick="logout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
</div>

<div class="main">
<div class="topbar"><h2><i class="fa fa-money-bill-wave"></i>Active Loans</h2><div class="topbar-right"><a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="adminName">Admin</strong></span></div></div>
<div class="content"><div class="table-card"><div class="table-header"><i class="fa fa-list"></i>Active Loan List</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Client</th><th>Phone</th><th>Amount</th><th>Balance</th><th>Interest</th><th>Due Date</th><th>Action</th></tr></thead><tbody id="activeLoansTable"><tr><td colspan="7" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div></div></div>
</div>

<div class="modal fade" id="loanModal"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title"><i class="fa fa-file-invoice-dollar"></i>Loan Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="loanDetails"></div></div></div></div>
<div class="modal fade" id="paymentModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title"><i class="fa fa-money-bill"></i>Record Payment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="paymentLoanId"><input type="hidden" id="paymentLoanDueDate"><div id="earlyPaymentNote" class="payment-note" style="display:none;"></div><label class="form-label mt-3">Amount Paid</label><input type="number" id="paymentAmount" class="form-control mb-3" placeholder="Enter payment amount" oninput="updatePaymentNote()"><label class="form-label">Payment Date</label><input type="date" id="paymentDate" class="form-control mb-3" onchange="updatePaymentNote()"><label class="form-label">Payment Method</label><select id="paymentMethod" class="form-select mb-3"><option>Cash</option><option>M-Pesa</option><option>Bank</option></select><label class="form-label">Comment</label><input type="text" id="paymentComment" class="form-control" placeholder="Auto-generated note" readonly></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" onclick="savePayment()">Save Payment</button></div></div></div></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if(!AUTH.currentAdmin()){window.location.href="admin-login.html";}
let admin=AUTH.currentAdmin();if(admin)document.getElementById("adminName").innerHTML=admin.username;
function money(v){return"KES "+Number(v||0).toLocaleString();}
const DEFAULT_IMG="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

function showFullImage(src,title){if(!src){alert("No image available");return;}let m=document.createElement("div");m.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:pointer;";m.innerHTML=`<div style="max-width:90%;max-height:90%;text-align:center;"><h5 style="color:white;margin-bottom:10px;">${title}</h5><img src="${src}" style="max-width:100%;max-height:80vh;border-radius:10px;"><br><small style="color:#ccc;">Click anywhere to close</small></div>`;m.onclick=function(){document.body.removeChild(m);};document.body.appendChild(m);}

async function loadActiveLoans(){
    let result=await api.getLoans();let table=document.getElementById("activeLoansTable");table.innerHTML="";
    if(!result.success||!result.loans){table.innerHTML='<tr><td colspan="7" class="text-center text-muted p-4">No active loans.</td></tr>';return;}
    let today=new Date();today.setHours(0,0,0,0);
    let active=result.loans.filter(l=>{if(l.status!=="ACTIVE")return false;if(Number(l.remaining_principal||0)<=0)return false;if(!l.due_date)return true;let d=new Date(l.due_date);d.setHours(0,0,0,0);return d>=today;});
    if(active.length===0){table.innerHTML='<tr><td colspan="7" class="text-center text-muted p-4">No active loans.</td></tr>';return;}
    for(let l of active.reverse()){
        let bal=Number(l.remaining_principal||0),rate=Number(l.interest_rate||20),interest=(bal*rate)/100;
        table.innerHTML+=`<tr><td><b>${l.fullname||"Unknown"}</b></td><td>${l.phone||"-"}</td><td>${money(l.original_principal)}</td><td class="text-danger fw-bold">${money(bal)}</td><td>${money(interest)} (${rate}%)</td><td><span class="badge bg-success">${formatDate(l.due_date)}</span></td><td><button class="btn btn-view btn-sm" onclick="viewLoan(${l.id})"><i class="fa fa-eye"></i> Details</button><button class="btn btn-payment btn-sm" onclick="openPayment(${l.id},'${l.due_date||""}')"><i class="fa fa-money-bill"></i></button></td></tr>`;
    }
}

async function viewLoan(id){
    let r=await api.getLoans();if(!r.success)return;let loan=r.loans.find(l=>l.id==id);if(!loan)return;
    let balance=Number(loan.remaining_principal||0),rate=Number(loan.interest_rate||20),currentInterest=(balance*rate)/100;
    let pResult=await api.getLoanPayments(id);let payments=pResult.success?pResult.payments:[];
    if(!Array.isArray(payments))payments=[];
    
    // Only count payments explicitly marked as "Early payment" in their note
    let earlyPaid=payments.filter(p=>{return p.note&&p.note.toLowerCase().includes("early");}).reduce((s,p)=>s+Number(p.amount||0),0);
    
    // Get client details
    let clientResult=await api.getClient(loan.client_id);
    let client=clientResult.success?clientResult.client:{};
    
    document.getElementById("loanDetails").innerHTML=`
        <h5 class="text-primary">Client Information</h5><hr>
        <div class="row"><div class="col-md-3 text-center"><img src="${client.profile_photo||DEFAULT_IMG}" class="profile-img-large mb-2"><h5>${client.fullname||loan.fullname||"-"}</h5></div><div class="col-md-9"><div class="row"><div class="col-md-6"><p><b>Phone:</b> ${client.phone||loan.phone||"-"}</p><p><b>National ID:</b> ${client.national_id||"-"}</p><p><b>Email:</b> ${client.email||"-"}</p></div><div class="col-md-6"><p><b>Occupation:</b> ${client.occupation||"-"}</p><p><b>Employer:</b> ${client.employer||"-"}</p><p><b>Monthly Income:</b> ${money(client.monthly_income)}</p></div></div><p><b>County:</b> ${client.county||"-"}</p><p><b>Address:</b> ${client.address||"-"}</p></div></div>
        
        <h5 class="text-primary mt-4">Loan Information</h5><hr>
        <div class="row"><div class="col-md-6"><p><b>Original:</b> ${money(loan.original_principal)}</p><p><b>Remaining:</b> ${money(balance)}</p><p><b>Current Interest:</b> ${money(currentInterest)}</p><p><b>Rate:</b> ${rate}%</p></div><div class="col-md-6"><p><b>Early Payments:</b> <span class="text-primary fw-bold">${money(earlyPaid)}</span></p><p><b>Loan Date:</b> ${formatDate(loan.loan_date)}</p><p><b>Due Date:</b> <span class="badge bg-success">${formatDate(loan.due_date)}</span></p><p><b>Status:</b> <span class="badge bg-success">${loan.status}</span></p></div></div>
        
        <div class="text-center mt-3 mb-3"><button class="btn btn-guarantors" onclick="toggleGuarantors(${loan.application_id||0})"><i class="fa fa-users"></i>View Guarantors</button></div>
        <div id="guarantorSection" style="display:none;"></div>
        
        <h5 class="text-primary mt-4">Payment History</h5>
        <table class="table table-bordered"><tr><th>Date</th><th>Amount</th><th>Principal</th><th>Interest</th><th>Balance</th><th>Type</th><th>Note</th></tr>${payments.length===0?'<tr><td colspan="7" class="text-center">No payments yet</td></tr>':payments.map(p=>{let typeBadge='<span class="badge bg-warning text-dark">Payment</span>';if(p.note&&p.note.toLowerCase().includes("early"))typeBadge='<span class="badge bg-primary">Early</span>';return`<tr><td>${formatDate(p.payment_date)}</td><td>${money(p.amount)}</td><td>${money(p.principal_paid)}</td><td>${money(p.interest_paid)}</td><td>${money(p.balance)}</td><td>${typeBadge}</td><td>${p.note||"-"}</td></tr>`;}).join("")}</table>`;
    new bootstrap.Modal(document.getElementById("loanModal")).show();
}

async function toggleGuarantors(appId){
    let section=document.getElementById("guarantorSection");
    if(section.style.display==="block"){section.style.display="none";return;}
    if(!appId||appId===0){section.innerHTML='<p class="text-muted">No guarantor details available.</p>';section.style.display="block";return;}
    section.innerHTML='<p class="text-center text-muted">Loading guarantor details...</p>';section.style.display="block";
    let result=await api.getApplications();if(!result.success)return;
    let app=result.applications.find(a=>a.id==appId);if(!app){section.innerHTML='<p class="text-muted">No guarantor details available.</p>';return;}
    section.innerHTML=`<hr><h5 class="text-primary"><i class="fa fa-users"></i>Guarantor Details</h5>${showGuarantor(app.guarantor1,"Guarantor 1")}${showGuarantor(app.guarantor2,"Guarantor 2")}`;
}

function showGuarantor(g,title){
    if(!g)return'<p class="text-muted">No '+title+' details.</p>';
    return`
    <div class="detail-card">
        <h5 class="text-primary">${title}</h5>
        <div class="row">
            <div class="col-md-4 text-center">
                <img src="${g.photo||DEFAULT_IMG}" class="guarantor-photo">
                <br><button class="btn btn-sm btn-outline-primary btn-doc mt-2" onclick="showFullImage('${g.photo||DEFAULT_IMG}','${title} Photo')"><i class="fa fa-search-plus"></i> View Full</button>
            </div>
            <div class="col-md-8">
                <p><b>Name:</b> ${g.name||"-"}</p>
                <p><b>National ID:</b> ${g.id||g.national_id||"-"}</p>
                <p><b>Phone:</b> ${g.phone||"-"}</p>
                <p><b>Relationship:</b> ${g.relationship||"-"}</p>
                <p><b>Address:</b> ${g.address||"-"}</p>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6 text-center"><p class="fw-bold mb-1">ID Front</p>${g.idFront||g.id_front?`<img src="${g.idFront||g.id_front}" class="document-img"><button class="btn btn-sm btn-outline-primary btn-doc mt-1" onclick="showFullImage('${g.idFront||g.id_front}','${title} ID Front')"><i class="fa fa-search-plus"></i> View Full</button>`:'<p class="text-muted">Not uploaded</p>'}</div>
            <div class="col-md-6 text-center"><p class="fw-bold mb-1">ID Back</p>${g.idBack||g.id_back?`<img src="${g.idBack||g.id_back}" class="document-img"><button class="btn btn-sm btn-outline-primary btn-doc mt-1" onclick="showFullImage('${g.idBack||g.id_back}','${title} ID Back')"><i class="fa fa-search-plus"></i> View Full</button>`:'<p class="text-muted">Not uploaded</p>'}</div>
        </div>
    </div>`;
}

function openPayment(id,dueDate){document.getElementById("paymentLoanId").value=id;document.getElementById("paymentLoanDueDate").value=dueDate;document.getElementById("paymentAmount").value="";document.getElementById("paymentDate").value=new Date().toISOString().split("T")[0];document.getElementById("paymentComment").value="";document.getElementById("earlyPaymentNote").style.display="none";updatePaymentNote();new bootstrap.Modal(document.getElementById("paymentModal")).show();}

function updatePaymentNote(){let ds=document.getElementById("paymentLoanDueDate").value,ps=document.getElementById("paymentDate").value,a=Number(document.getElementById("paymentAmount").value)||0;if(!ds||!ps){document.getElementById("earlyPaymentNote").style.display="none";document.getElementById("paymentComment").value="";return;}let dd=new Date(ds),pd=new Date(ps+"T00:00:00");if(pd<dd&&a>0){let days=Math.floor((dd-pd)/(1000*60*60*24));document.getElementById("earlyPaymentNote").style.display="block";document.getElementById("earlyPaymentNote").innerHTML=`<i class="fa fa-info-circle"></i> <b>Early Payment</b> — ${days} days before due date.`;document.getElementById("paymentComment").value=`Early payment (${days} days before due date)`;}else if(pd>=dd&&a>0){document.getElementById("earlyPaymentNote").style.display="block";document.getElementById("earlyPaymentNote").innerHTML='<i class="fa fa-exclamation-triangle"></i> <b>On-Time Payment</b>';document.getElementById("paymentComment").value="Payment on/after due date";}else{document.getElementById("earlyPaymentNote").style.display="none";document.getElementById("paymentComment").value="";}}

async function savePayment(){let loanId=Number(document.getElementById("paymentLoanId").value),amount=Number(document.getElementById("paymentAmount").value),date=document.getElementById("paymentDate").value,method=document.getElementById("paymentMethod").value,note=document.getElementById("paymentComment").value;if(amount<=0){alert("Enter amount");return;}await api.addPayment({loanId,amount,paymentDate:date,method,note});alert("Payment recorded!");bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();loadActiveLoans();}

function logout(){AUTH.adminLogout();}
loadActiveLoans();
</script>
</body>
</html>
