<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Loan | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
body{background:#edf4ff;font-family:'Segoe UI',sans-serif;}
.header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:white;padding:25px;border-radius:0 0 25px 25px;position:relative;}
.header .btn-back{position:absolute;top:20px;right:25px;background:rgba(255,255,255,0.2);color:white;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:600;font-size:15px;transition:.3s;}
.header .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.container{max-width:1100px;}
.card{border:none;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.12);}
.section-title{background:#0d47a1;color:white;padding:12px 18px;border-radius:12px;margin-top:20px;}
.form-control{height:50px;border-radius:12px;}
.interest-box{background:#198754;color:white;padding:20px;border-radius:15px;}
.btn-submit{height:55px;font-size:18px;font-weight:bold;border-radius:15px;}
.alert{display:none;}
.verify-box{background:#e8f5e9;border:2px solid #4caf50;border-radius:15px;padding:15px;margin-top:10px;display:none;}
.otp-input-small{width:42px;height:42px;text-align:center;font-size:18px;font-weight:bold;border-radius:8px;border:2px solid #2563EB;}
.status-ok{color:#4caf50;font-size:12px;}.status-error{color:#dc3545;font-size:12px;}
.verify-btn{height:50px;border-radius:12px;font-size:13px;white-space:nowrap;}
.guarantor-card{border:2px solid #e0e0e0;border-radius:15px;padding:20px;margin-bottom:20px;background:#fafbff;}
.upload-box{background:#f8f9fa;border-radius:12px;padding:15px;border:1px dashed #0F4C81;margin-bottom:10px;}
.upload-box label{font-weight:600;font-size:13px;}
.preview-img{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;border:1px solid #ddd;}
.info-row{display:flex;flex-wrap:wrap;gap:10px 0;}
.info-item{flex:0 0 50%;padding:5px 10px;}
.info-item label{font-weight:600;color:#0F4C81;display:block;font-size:13px;}
.info-item span{color:#333;font-size:14px;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="header text-center">
<a href="client-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a>
<h2><i class="fa-solid fa-building-columns"></i>BEJJA CREDIT</h2>
<p>Loan Application Form</p>
</div>

<div class="container py-4"><div class="card p-4">
<div id="errorBox" class="alert alert-danger"></div>

<h4 class="section-title"><i class="fa fa-user"></i>Client Information</h4>
<div class="row">
<div class="col-md-6"><div class="info-item"><label>Full Name</label><span id="fullname">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>National ID</label><span id="nationalID">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>Phone Number</label><span id="phone">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>Email</label><span id="email">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>Occupation</label><span id="occupation">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>Employer</label><span id="employer">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>Monthly Income</label><span id="income">-</span></div></div>
<div class="col-md-6"><div class="info-item"><label>County</label><span id="county">-</span></div></div>
<div class="col-12"><div class="info-item"><label>Address</label><span id="address">-</span></div></div>
</div>

<h4 class="section-title"><i class="fa fa-money-bill"></i>Loan Details</h4>
<div class="row">
<div class="col-md-6 mb-3"><label>Loan Amount (KES)</label><input type="number" id="loanAmount" class="form-control" placeholder="Enter amount" oninput="calculateInterest()"></div>
<div class="col-md-6 mb-3"><label>Loan Purpose</label><input id="purpose" class="form-control" placeholder="Business / Emergency"></div>
</div>
<div class="interest-box"><h5>Monthly Interest (20%)</h5><h2 id="monthlyInterest">KES 0</h2></div>

<h4 class="section-title mt-4"><i class="fa fa-users"></i>Guarantor 1</h4>
<div class="guarantor-card"><div class="row">
<div class="col-md-6 mb-3"><label>Full Name</label><input id="g1_name" class="form-control" placeholder="Guarantor full name"></div>
<div class="col-md-6 mb-3"><label>National ID</label><input id="g1_id" class="form-control" placeholder="ID number"></div>
<div class="col-md-6 mb-3"><label>Phone Number</label><div class="input-group"><input id="g1_phone" class="form-control" placeholder="07XXXXXXXX"><button class="btn btn-outline-success verify-btn" type="button" id="g1_sendOTPBtn" onclick="sendGuarantorOTP('g1')"><i class="fa fa-paper-plane"></i> Verify</button></div><div id="g1_phoneStatus" class="mt-1"></div></div>
<div class="col-md-6 mb-3"><div class="verify-box" id="g1_otpBox"><label class="fw-semibold">Enter Code</label><div class="d-flex gap-1 mt-1"><input type="text" id="g1_otp1" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g1_otp2')"><input type="text" id="g1_otp2" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g1_otp3')"><input type="text" id="g1_otp3" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g1_otp4')"><input type="text" id="g1_otp4" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g1_otp5')"><input type="text" id="g1_otp5" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g1_otp6')"><input type="text" id="g1_otp6" maxlength="1" class="otp-input-small"></div><button class="btn btn-success btn-sm w-100 mt-2" type="button" onclick="verifyGuarantorOTP('g1')"><i class="fa fa-check-circle"></i> Confirm</button><div id="g1_otpStatus" class="mt-1"></div></div></div>
<div class="col-md-6 mb-3"><label>Relationship</label><input id="g1_relationship" class="form-control" placeholder="Friend / Relative"></div>
<div class="col-md-12 mb-3"><label>Physical Address</label><textarea id="g1_address" class="form-control" rows="2" placeholder="Address"></textarea></div>
</div>
<h6 class="fw-bold mt-3"><i class="fa fa-file-image"></i> Documents</h6>
<div class="row">
<div class="col-md-4"><div class="upload-box"><label>Profile Photo</label><input type="file" id="g1_photo" class="form-control form-control-sm" accept="image/*" onchange="previewImg(this,'g1_photo_preview')"><img id="g1_photo_preview" class="preview-img"></div></div>
<div class="col-md-4"><div class="upload-box"><label>ID Front</label><input type="file" id="g1_idfront" class="form-control form-control-sm" accept="image/*" onchange="previewImg(this,'g1_idfront_preview')"><img id="g1_idfront_preview" class="preview-img"></div></div>
<div class="col-md-4"><div class="upload-box"><label>ID Back</label><input type="file" id="g1_idback" class="form-control form-control-sm" accept="image/*" onchange="previewImg(this,'g1_idback_preview')"><img id="g1_idback_preview" class="preview-img"></div></div>
</div></div>

<h4 class="section-title mt-4"><i class="fa fa-users"></i>Guarantor 2</h4>
<div class="guarantor-card"><div class="row">
<div class="col-md-6 mb-3"><label>Full Name</label><input id="g2_name" class="form-control" placeholder="Guarantor full name"></div>
<div class="col-md-6 mb-3"><label>National ID</label><input id="g2_id" class="form-control" placeholder="ID number"></div>
<div class="col-md-6 mb-3"><label>Phone Number</label><div class="input-group"><input id="g2_phone" class="form-control" placeholder="07XXXXXXXX"><button class="btn btn-outline-success verify-btn" type="button" id="g2_sendOTPBtn" onclick="sendGuarantorOTP('g2')"><i class="fa fa-paper-plane"></i> Verify</button></div><div id="g2_phoneStatus" class="mt-1"></div></div>
<div class="col-md-6 mb-3"><div class="verify-box" id="g2_otpBox"><label class="fw-semibold">Enter Code</label><div class="d-flex gap-1 mt-1"><input type="text" id="g2_otp1" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g2_otp2')"><input type="text" id="g2_otp2" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g2_otp3')"><input type="text" id="g2_otp3" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g2_otp4')"><input type="text" id="g2_otp4" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g2_otp5')"><input type="text" id="g2_otp5" maxlength="1" class="otp-input-small" oninput="otpNextG(this,'g2_otp6')"><input type="text" id="g2_otp6" maxlength="1" class="otp-input-small"></div><button class="btn btn-success btn-sm w-100 mt-2" type="button" onclick="verifyGuarantorOTP('g2')"><i class="fa fa-check-circle"></i> Confirm</button><div id="g2_otpStatus" class="mt-1"></div></div></div>
<div class="col-md-6 mb-3"><label>Relationship</label><input id="g2_relationship" class="form-control" placeholder="Friend / Relative"></div>
<div class="col-md-12 mb-3"><label>Physical Address</label><textarea id="g2_address" class="form-control" rows="2" placeholder="Address"></textarea></div>
</div>
<h6 class="fw-bold mt-3"><i class="fa fa-file-image"></i> Documents</h6>
<div class="row">
<div class="col-md-4"><div class="upload-box"><label>Profile Photo</label><input type="file" id="g2_photo" class="form-control form-control-sm" accept="image/*" onchange="previewImg(this,'g2_photo_preview')"><img id="g2_photo_preview" class="preview-img"></div></div>
<div class="col-md-4"><div class="upload-box"><label>ID Front</label><input type="file" id="g2_idfront" class="form-control form-control-sm" accept="image/*" onchange="previewImg(this,'g2_idfront_preview')"><img id="g2_idfront_preview" class="preview-img"></div></div>
<div class="col-md-4"><div class="upload-box"><label>ID Back</label><input type="file" id="g2_idback" class="form-control form-control-sm" accept="image/*" onchange="previewImg(this,'g2_idback_preview')"><img id="g2_idback_preview" class="preview-img"></div></div>
</div></div>

<div class="text-center mt-4"><button id="submitBtn" onclick="submitLoanApplication()" class="btn btn-primary btn-submit w-100"><i class="fa fa-paper-plane"></i>Submit Loan Application</button></div>
</div></div>

<script>
function money(v){return"KES "+Number(v||0).toLocaleString();}
document.addEventListener("DOMContentLoaded",()=>{
    let c=AUTH.currentClient();if(!c)return;
    document.getElementById("fullname").textContent=c.fullname||"-";
    document.getElementById("nationalID").textContent=c.nationalID||"-";
    document.getElementById("phone").textContent=c.phone||"-";
    document.getElementById("email").textContent=c.email||"-";
    document.getElementById("occupation").textContent=c.occupation||"-";
    document.getElementById("employer").textContent=c.employer||"-";
    document.getElementById("income").textContent=money(c.monthlyIncome);
    document.getElementById("county").textContent=c.county||"-";
    document.getElementById("address").textContent=c.address||"-";
});
function calculateInterest(){let a=Number(document.getElementById("loanAmount").value)||0;document.getElementById("monthlyInterest").innerHTML="KES "+(a*0.20).toLocaleString();}
function previewImg(i,t){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){let img=document.getElementById(t);img.src=e.target.result;img.style.display="block";};r.readAsDataURL(f);}
function compressImage(f){return new Promise(r=>{let reader=new FileReader();reader.onload=function(e){let img=new Image();img.onload=function(){let c=document.createElement("canvas");let w=img.width,h=img.height,max=800;if(w>max){h=h*max/w;w=max;}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);r(c.toDataURL("image/jpeg",0.7));};img.src=e.target.result;};reader.readAsDataURL(f);});}

const guarantorOTPs={};
function sendGuarantorOTP(p){
    let phone=document.getElementById(p+"_phone").value.trim();
    if(!/^07\d{8}$/.test(phone)){document.getElementById(p+"_phoneStatus").innerHTML='<span class="status-error">Enter valid 07XXXXXXXX</span>';return;}
    let otp=String(Math.floor(100000+Math.random()*900000));guarantorOTPs[p]=otp;
    console.log("OTP for "+p+":",otp);
    document.getElementById(p+"_phoneStatus").innerHTML='<span class="status-ok">Code sent! (Demo: <b>'+otp+'</b>)</span>';
    document.getElementById(p+"_otpBox").style.display="block";
    document.getElementById(p+"_sendOTPBtn").disabled=true;
    document.getElementById(p+"_sendOTPBtn").innerHTML='<i class="fa fa-clock"></i> Sent';
}
function otpNextG(c,n){if(c.value.length===1&&n)document.getElementById(n).focus();}
function verifyGuarantorOTP(p){
    let entered=document.getElementById(p+"_otp1").value+document.getElementById(p+"_otp2").value+document.getElementById(p+"_otp3").value+document.getElementById(p+"_otp4").value+document.getElementById(p+"_otp5").value+document.getElementById(p+"_otp6").value;
    if(entered.length<6){document.getElementById(p+"_otpStatus").innerHTML='<span class="status-error">Enter complete code</span>';return;}
    if(entered===guarantorOTPs[p]){document.getElementById(p+"_otpStatus").innerHTML='<span class="status-ok"><i class="fa fa-check-circle"></i> Verified!</span>';sessionStorage.setItem(p+"_phoneVerified","true");document.getElementById(p+"_otpBox").style.display="none";document.getElementById(p+"_sendOTPBtn").innerHTML='<i class="fa fa-check"></i> Done';}
    else{document.getElementById(p+"_otpStatus").innerHTML='<span class="status-error">Incorrect code</span>';}
}

async function submitLoanApplication(){
let errorBox=document.getElementById("errorBox"),btn=document.getElementById("submitBtn");errorBox.style.display="none";
let client=AUTH.currentClient();if(!client)return;
let amount=Number(document.getElementById("loanAmount").value),purpose=document.getElementById("purpose").value.trim();
if(amount<=0){errorBox.innerHTML="Enter a valid loan amount";errorBox.style.display="block";return;}
if(!purpose){errorBox.innerHTML="Enter loan purpose";errorBox.style.display="block";return;}
let g1name=document.getElementById("g1_name").value.trim(),g2name=document.getElementById("g2_name").value.trim();
if(!g1name||!g2name){errorBox.innerHTML="Complete both guarantor details";errorBox.style.display="block";return;}
if(!sessionStorage.getItem("g1_phoneVerified")){errorBox.innerHTML="Verify Guarantor 1 phone number";errorBox.style.display="block";return;}
if(!sessionStorage.getItem("g2_phoneVerified")){errorBox.innerHTML="Verify Guarantor 2 phone number";errorBox.style.display="block";return;}
btn.disabled=true;btn.innerHTML="Compressing...";
let g1photo="",g1front="",g1back="",g2photo="",g2front="",g2back="";
if(document.getElementById("g1_photo").files[0])g1photo=await compressImage(document.getElementById("g1_photo").files[0]);
if(document.getElementById("g1_idfront").files[0])g1front=await compressImage(document.getElementById("g1_idfront").files[0]);
if(document.getElementById("g1_idback").files[0])g1back=await compressImage(document.getElementById("g1_idback").files[0]);
if(document.getElementById("g2_photo").files[0])g2photo=await compressImage(document.getElementById("g2_photo").files[0]);
if(document.getElementById("g2_idfront").files[0])g2front=await compressImage(document.getElementById("g2_idfront").files[0]);
if(document.getElementById("g2_idback").files[0])g2back=await compressImage(document.getElementById("g2_idback").files[0]);
btn.innerHTML="Submitting...";
let result=await api.addApplication({amount:amount,purpose:purpose,
guarantor1:{name:g1name,id:document.getElementById("g1_id").value,phone:document.getElementById("g1_phone").value,relationship:document.getElementById("g1_relationship").value,address:document.getElementById("g1_address").value,photo:g1photo,idFront:g1front,idBack:g1back},
guarantor2:{name:g2name,id:document.getElementById("g2_id").value,phone:document.getElementById("g2_phone").value,relationship:document.getElementById("g2_relationship").value,address:document.getElementById("g2_address").value,photo:g2photo,idFront:g2front,idBack:g2back}});
if(result.success){sessionStorage.removeItem("g1_phoneVerified");sessionStorage.removeItem("g2_phoneVerified");
document.body.innerHTML=`<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;"><div style="background:white;border-radius:25px;padding:50px 40px;text-align:center;max-width:500px;"><i class="fa-solid fa-circle-check" style="font-size:80px;color:#198754;margin-bottom:20px;"></i><h2 style="color:#0F4C81;">Application Submitted!</h2><p style="color:#666;margin-bottom:25px;">Your loan application is under review.</p><a href="client-dashboard.html" style="background:#2563EB;color:white;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;display:block;">Go to Dashboard</a></div></div>`;}
else{errorBox.innerHTML=result.message;errorBox.style.display="block";btn.disabled=false;btn.innerHTML="Submit Loan Application";}
}
</script>
</body>
</html>
