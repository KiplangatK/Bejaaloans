<!DOCTYPE html>
<html>
<head><title>Debug</title></head>
<body>
    <h3>Loan Debugger</h3>
    <button onclick="showLoans()">Show All Loans</button>
    <button onclick="showPayments()">Show All Payments</button>
    <pre id="out"></pre>

    <script>
        const API = "http://localhost:5000/api";
        
        async function login() {
            const r = await fetch(API + "/auth/admin-login", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({username:"Kiplangat",password:"Admin@123"})
            });
            const d = await r.json();
            return d.token;
        }

        async function showLoans() {
            const token = await login();
            const r = await fetch(API + "/loans", {
                headers: {"Authorization":"Bearer "+token}
            });
            const d = await r.json();
            document.getElementById("out").textContent = JSON.stringify(d.loans, null, 2);
        }

        async function showPayments() {
            const token = await login();
            const r = await fetch(API + "/payments", {
                headers: {"Authorization":"Bearer "+token}
            });
            const d = await r.json();
            document.getElementById("out").textContent = JSON.stringify(d, null, 2);
        }
    </script>
</body>
</html>
