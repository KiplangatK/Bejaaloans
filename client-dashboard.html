<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0F4C81;color:white;}
.logo{padding:25px;font-size:25px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:10px;}
.sidebar a{display:block;padding:15px 25px;color:white;text-decoration:none;transition:.3s;}
.sidebar a:hover{background:#2563EB;padding-left:35px;}.sidebar i{width:25px;}
.main{margin-left:260px;}
.topbar{height:70px;background:#2563EB;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 30px;box-shadow:0 4px 15px rgba(0,0,0,.2);}
.topbar .topbar-right{display:flex;align-items:center;gap:20px;}
.topbar .btn-home{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;text-decoration:none;transition:.3s;}
.topbar .btn-home:hover{background:rgba(255,255,255,0.35);color:white;}
.topbar .btn-logout{color:#ffc107;font-weight:600;cursor:pointer;text-decoration:none;}.topbar .btn-logout:hover{color:#fff;}
.content{padding:30px;}
.profile-header{background:white;border-radius:20px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,.1);display:flex;align-items:center;gap:25px;}
.profile-header img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #2563EB;}
.client-name{font-size:26px;font-weight:bold;color:#0F4C81;}
.badge-active{background:#198754;color:white;padding:8px 20px;border-radius:20px;}
.summary-card{background:white;border-radius:20px;padding:25px;box-shadow:0 5px 15px rgba(0,0,0,.1);height:150px;}
.summary-card i{font-size:35px;color:#2563EB;}
.summary-title{color:#666;font-size:15px;}
.summary-value{font-size:22px;font-weight:bold;color:#0F4C81;}
.quick-btn{height:55px;border-radius:15px;font-weight:bold;font-size:17px;}
</style>
</head>
