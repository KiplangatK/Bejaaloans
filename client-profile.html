<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.header{background:linear-gradient(135deg,#0F4C81,#2563EB);color:white;padding:25px;border-radius:0 0 25px 25px;box-shadow:0 5px 20px rgba(0,0,0,.2);}
.container{max-width:1100px;}
.profile-card{background:white;border-radius:25px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.12);}
.profile-photo{width:160px;height:160px;border-radius:50%;object-fit:cover;border:5px solid #2563EB;}
.name{font-size:28px;font-weight:bold;color:#0F4C81;}
.status{padding:8px 20px;border-radius:20px;background:#198754;color:white;display:inline-block;}
.section-title{background:#0F4C81;color:white;padding:12px 18px;border-radius:12px;margin-top:25px;}
.detail-box{background:#f8fbff;padding:15px;border-radius:12px;border-left:4px solid #2563EB;margin-bottom:15px;}
.detail-box label{font-weight:bold;color:#0F4C81;display:block;}
.form-control{height:50px;border-radius:12px;}
.btn-save{background:#2563EB;color:white;height:50px;border-radius:12px;font-size:18px;font-weight:bold;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="header text-center"><h2><i class="fa-solid fa-building-columns"></i>BEJJA LOAN CREDIT</h2><p>My Profile</p></div>
<div class="container py-4">
<div class="mb-4"><a href="client-dashboard.html" class="btn btn-primary"><i class="fa fa-arrow-left"></i> Back</a><a href="#" onclick="AUTH.clientLogout()" class="btn btn-danger float-end"><i class="fa fa-right-from-bracket"></i> Logout</a></div>
<div class="profile-card">
<div class="text-center"><img id="profilePhoto" class="profile-photo" src=""><h3 class="name mt-3" id="clientName"></h3><span class="status">ACTIVE CLIENT</span></div>
<hr>
<h5 class="section-title"><i class="fa fa-user"></i>Personal Information</h5>
<div class="row">
<div class="col-md-6"><div class="detail-box"><label>Full Name</label><input id="fullname" class="form-control" readonly></div></div>
<div class="col-md-6"><div class="detail-box"><label>National ID</label><input id="nationalID" class="form-control" readonly></div></div>
<div class="col-md-6"><div class="detail-box"><label>Phone</label><input id="phone" class="form-control"></div></div>
<div class="col-md-6"><div class="detail-box"><label>Email</label><input id="email" class="form-control"></div></div>
</div>
<div class="text-center mt-4"><button onclick="saveProfile()" class="btn btn-save w-100"><i class="fa fa-save"></i>Save Profile Changes</button></div>
</div>
</div>

<script>
function money(v){return"KES "+Number(v||0).toLocaleString();}
document.addEventListener("DOMContentLoaded",()=>{let c=AUTH.currentClient();if(!c)return;document.getElementById("clientName").innerHTML=c.fullname;document.getElementById("profilePhoto").src=c.profilePhoto||"https://via.placeholder.com/160";document.getElementById("fullname").value=c.fullname||"";document.getElementById("nationalID").value=c.nationalID||"";document.getElementById("phone").value=c.phone||"";document.getElementById("email").value=c.email||"";});
async function saveProfile(){let c=AUTH.currentClient();if(!c)return;let data={fullname:document.getElementById("fullname").value,phone:document.getElementById("phone").value,email:document.getElementById("email").value};await api.updateClient(c.id,data);await AUTH.refreshClientSession();alert("Profile updated!");}
</script>
</body>
</html>
