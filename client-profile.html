<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0F4C81;color:white;}
.logo{padding:25px;font-size:25px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:10px;}
.sidebar a{display:block;padding:15px 25px;color:white;text-decoration:none;transition:.3s;}
.sidebar a:hover{background:#2563EB;padding-left:35px;}.sidebar i{width:25px;}
.main{margin-left:260px;}
.topbar{height:60px;background:#2563EB;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 25px;box-shadow:0 4px 15px rgba(0,0,0,.2);}
.topbar .topbar-right{display:flex;align-items:center;gap:15px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{padding:25px;}
.profile-card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 5px 15px rgba(0,0,0,.1);text-align:center;margin-bottom:20px;}
.profile-card img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:5px solid #2563EB;}
.profile-card h3{font-weight:bold;color:#0F4C81;margin-top:10px;}
.info-card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 5px 15px rgba(0,0,0,.1);}
.info-row{display:flex;border-bottom:1px solid #eee;padding:12px 0;}
.info-row:last-child{border-bottom:none;}
.info-label{font-weight:bold;color:#0F4C81;width:200px;flex-shrink:0;}
.info-value{color:#444;}
.section-title{font-size:20px;font-weight:bold;color:#0F4C81;margin-bottom:20px;border-bottom:2px solid #2563EB;padding-bottom:10px;}
.action-btn{height:45px;border-radius:10px;font-weight:bold;font-size:15px;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<a href="client-dashboard.html"><i class="fa fa-home"></i>Dashboard</a>
<a href="apply-loan.html"><i class="fa fa-hand-holding-dollar"></i>Apply Loan</a>
<a href="my-loans.html"><i class="fa fa-money-bill-wave"></i>My Loans</a>
<a href="client-profile.html"><i class="fa fa-user"></i>My Profile</a>
<a href="#" onclick="AUTH.clientLogout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
</div>

<div class="main">
<div class="topbar"><h3><i class="fa fa-user-circle"></i>My Profile</h3><div class="topbar-right"><a href="client-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="topClientName"></strong></span></div></div>
<div class="content">

<div class="profile-card">
<img id="profilePhoto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
<h3 id="clientName"></h3>
<p id="clientPhone" class="text-muted"></p>
<span class="badge bg-success">ACTIVE CLIENT</span>
</div>

<div class="info-card">
<h4 class="section-title"><i class="fa fa-address-card"></i>Personal Information</h4>
<div class="info-row"><div class="info-label">Full Name</div><div class="info-value" id="vFullname">-</div></div>
<div class="info-row"><div class="info-label">National ID</div><div class="info-value" id="vNationalID">-</div></div>
<div class="info-row"><div class="info-label">Phone Number</div><div class="info-value" id="vPhone">-</div></div>
<div class="info-row"><div class="info-label">Email Address</div><div class="info-value" id="vEmail">-</div></div>
<div class="info-row"><div class="info-label">Occupation</div><div class="info-value" id="vOccupation">-</div></div>
<div class="info-row"><div class="info-label">Employer / Business</div><div class="info-value" id="vEmployer">-</div></div>
<div class="info-row"><div class="info-label">Monthly Income</div><div class="info-value" id="vIncome">-</div></div>
<div class="info-row"><div class="info-label">County</div><div class="info-value" id="vCounty">-</div></div>
<div class="info-row"><div class="info-label">Physical Address</div><div class="info-value" id="vAddress">-</div></div>
<div class="info-row"><div class="info-label">Account Created</div><div class="info-value" id="vCreated">-</div></div>
</div>

<div class="text-center mt-4"><a href="client-dashboard.html" class="btn btn-success action-btn px-4"><i class="fa fa-home"></i> Dashboard</a></div>

</div></div>

<script>
function money(v){return"KES "+Number(v||0).toLocaleString();}
document.addEventListener("DOMContentLoaded",()=>{
    let c=AUTH.currentClient();if(!c)return;
    document.getElementById("topClientName").textContent=c.fullname||"-";
    document.getElementById("profilePhoto").src=c.profilePhoto||"https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
    document.getElementById("clientName").textContent=c.fullname||"-";
    document.getElementById("clientPhone").textContent=c.phone||"-";
    document.getElementById("vFullname").textContent=c.fullname||"-";
    document.getElementById("vNationalID").textContent=c.nationalID||"-";
    document.getElementById("vPhone").textContent=c.phone||"-";
    document.getElementById("vEmail").textContent=c.email||"Not Provided";
    document.getElementById("vOccupation").textContent=c.occupation||"-";
    document.getElementById("vEmployer").textContent=c.employer||"Not Provided";
    document.getElementById("vIncome").textContent=money(c.monthlyIncome);
    document.getElementById("vCounty").textContent=c.county||"-";
    document.getElementById("vAddress").textContent=c.address||"-";
    document.getElementById("vCreated").textContent=formatDate(c.createdAt);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
