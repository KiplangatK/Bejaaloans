<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0F4C81;color:white;}
.logo{padding:20px;font-size:22px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:8px;}
.sidebar a{display:block;padding:12px 20px;color:white;text-decoration:none;transition:.3s;font-size:14px;}
.sidebar a:hover{background:#2563EB;padding-left:28px;}.sidebar i{width:22px;}
.main{margin-left:260px;height:100vh;display:flex;flex-direction:column;}
.topbar{height:50px;background:#2563EB;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-shrink:0;}
.topbar h3{font-size:18px;}.topbar .topbar-right{display:flex;align-items:center;gap:12px;font-size:13px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:5px 12px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{flex:1;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:hidden;min-height:0;}
.profile-header{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:10px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex-shrink:0;}
.profile-header img{width:45px;height:45px;border-radius:50%;object-fit:cover;border:2px solid #2563EB;}
.profile-header h3{font-size:16px;color:#0F4C81;margin:0;}
.profile-header p{color:#777;font-size:12px;margin:0;}
.info-card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex:1;overflow-y:auto;min-height:0;}
.section-title{font-size:15px;font-weight:bold;color:#0F4C81;margin-bottom:12px;border-bottom:2px solid #2563EB;padding-bottom:6px;}
.info-list{display:flex;flex-direction:column;gap:2px;}
.info-row{display:flex;padding:8px 0;border-bottom:1px solid #f0f0f0;}
.info-row:last-child{border-bottom:none;}
.info-label{font-weight:bold;color:#0F4C81;width:160px;flex-shrink:0;font-size:13px;}
.info-value{color:#444;font-size:13px;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<a href="client-dashboard.html"><i class="fa fa-home"></i>Dashboard</a>
<a href="apply-loan.html"><i class="fa fa-hand-holding-dollar"></i>Apply Loan</a>
<a href="my-loans.html"><i class="fa fa-money-bill-wave"></i>My Loans</a>
<a href="client-profile.html"><i class="fa fa-user"></i>My Profile</a>
<a href="#" onclick="AUTH.clientLogout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
</div>

<div class="main">
<div class="topbar"><h3><i class="fa fa-user-circle"></i> My Profile</h3><div class="topbar-right"><a href="client-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="topClientName"></strong></span></div></div>
<div class="content">

<div class="profile-header">
<img id="profilePhoto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
<div><h3 id="clientName"></h3><p id="clientPhone"></p></div>
<span class="badge bg-success ms-auto">ACTIVE</span>
<a href="client-dashboard.html" class="btn btn-success btn-sm ms-2" style="border-radius:8px;font-size:12px;"><i class="fa fa-home"></i> Dashboard</a>
</div>

<div class="info-card">
<h4 class="section-title"><i class="fa fa-address-card"></i> Personal Information</h4>
<div class="info-list">
<div class="info-row"><div class="info-label">Full Name</div><div class="info-value" id="vFullname">-</div></div>
<div class="info-row"><div class="info-label">National ID</div><div class="info-value" id="vNationalID">-</div></div>
<div class="info-row"><div class="info-label">Phone Number</div><div class="info-value" id="vPhone">-</div></div>
<div class="info-row"><div class="info-label">Email Address</div><div class="info-value" id="vEmail">-</div></div>
<div class="info-row"><div class="info-label">Occupation</div><div class="info-value" id="vOccupation">-</div></div>
<div class="info-row"><div class="info-label">Employer</div><div class="info-value" id="vEmployer">-</div></div>
<div class="info-row"><div class="info-label">Monthly Income</div><div class="info-value" id="vIncome">-</div></div>
<div class="info-row"><div class="info-label">County</div><div class="info-value" id="vCounty">-</div></div>
<div class="info-row"><div class="info-label">Address</div><div class="info-value" id="vAddress">-</div></div>
<div class="info-row"><div class="info-label">Registered</div><div class="info-value" id="vCreated">-</div></div>
</div>
</div>

</div></div>

<script>
function money(v){return"KES "+Number(v||0).toLocaleString();}
document.addEventListener("DOMContentLoaded",()=>{
    let c=AUTH.currentClient();if(!c)return;
    document.getElementById("topClientName").textContent=c.fullname||"-";
    document.getElementById("profilePhoto").src=c.profilePhoto||"https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
    document.getElementById("clientName").textContent=c.fullname||"-";
    document.getElementById("clientPhone").textContent=c.phone||"-";
    document.getElementById("vFullname").textContent=c.fullname||"-";
    document.getElementById("vNationalID").textContent=c.nationalID||"-";
    document.getElementById("vPhone").textContent=c.phone||"-";
    document.getElementById("vEmail").textContent=c.email||"Not Provided";
    document.getElementById("vOccupation").textContent=c.occupation||"-";
    document.getElementById("vEmployer").textContent=c.employer||"Not Provided";
    document.getElementById("vIncome").textContent=money(c.monthlyIncome);
    document.getElementById("vCounty").textContent=c.county||"-";
    document.getElementById("vAddress").textContent=c.address||"-";
    document.getElementById("vCreated").textContent=formatDate(c.createdAt);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
