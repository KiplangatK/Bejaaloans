<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Clients | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;height:100vh;overflow:hidden;}
.wrapper{display:flex;height:100vh;}
.sidebar{width:260px;min-height:100vh;background:#0d47a1;color:white;position:fixed;left:0;top:0;bottom:0;}
.logo{padding:20px;font-size:22px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:8px;}
.sidebar ul{list-style:none;padding:10px 0;}
.sidebar ul li a{display:block;padding:14px 22px;color:white;text-decoration:none;transition:.3s;font-size:15px;}
.sidebar ul li a:hover{background:#1565c0;padding-left:30px;}.sidebar ul li i{width:24px;}
.main{margin-left:260px;flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{height:60px;background:#1976d2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 25px;box-shadow:0 2px 10px rgba(0,0,0,.12);flex-shrink:0;}
.topbar h2{font-size:24px;}.topbar .topbar-right{display:flex;align-items:center;gap:15px;font-size:15px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:7px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{flex:1;display:flex;flex-direction:column;padding:15px;overflow:hidden;min-height:0;}
.search-box{margin-bottom:12px;flex-shrink:0;}
.search-box input{height:48px;border-radius:10px;font-size:15px;padding:0 16px;border:2px solid #ddd;width:100%;max-width:450px;}
.table-card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);flex:1;display:flex;flex-direction:column;min-height:0;}
.table-header{background:#1976d2;color:white;padding:14px 20px;font-size:18px;font-weight:bold;flex-shrink:0;}
.table-responsive{flex:1;overflow-y:auto;}
.table th{background:#e3f2fd;color:#0d47a1;font-size:14px;padding:12px 10px;position:sticky;top:0;z-index:1;}
.table td{padding:12px 10px;font-size:14px;vertical-align:middle;}
.status-active{background:#198754;color:white;padding:6px 12px;border-radius:15px;font-size:12px;font-weight:600;}
.status-suspended{background:#dc3545;color:white;padding:6px 12px;border-radius:15px;font-size:12px;font-weight:600;}
.btn-view{background:#1976d2;color:white;border-radius:15px;font-size:13px;padding:7px 14px;font-weight:600;}
.btn-view:hover{background:#0d47a1;color:white;}
.profile-img-large{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #1976d2;margin-bottom:10px;}
.info-list{display:flex;flex-direction:column;}
.info-row{display:flex;padding:11px 0;border-bottom:1px solid #e8e8e8;font-size:16px;}
.info-row:last-child{border-bottom:none;}
.info-label{font-weight:bold;color:#0F4C81;width:170px;flex-shrink:0;font-size:16px;}
.info-value{color:#444;font-size:16px;}
.document-img{width:100%;height:200px;object-fit:contain;border-radius:10px;border:2px solid #ddd;margin-top:8px;}
.btn-doc{font-size:14px;padding:7px 14px;font-weight:600;}
.btn-danger-disabled{background:#ccc;color:#888;border-radius:18px;font-size:14px;padding:8px 16px;border:none;cursor:not-allowed;font-weight:600;}
</style>
</head>
<body>

<div class="wrapper">

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<ul>
<li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i>Dashboard</a></li>
<li><a href="registered-clients.html"><i class="fa-solid fa-users"></i>Registered Clients</a></li>
<li><a href="active-loans.html"><i class="fa-solid fa-money-bill-wave"></i>Active Loans</a></li>
<li><a href="late-loans.html"><i class="fa-solid fa-triangle-exclamation"></i>Late Loans</a></li>
<li><a href="loan-applications.html"><i class="fa-solid fa-file-circle-check"></i>Loan Applications</a></li>
<li><a href="statistics.html"><i class="fa-solid fa-chart-column"></i>Statistics</a></li>
<li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></li>
</ul>
</div>

<div class="main">
<div class="topbar"><h2>Registered Clients</h2><div class="topbar-right"><a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="adminName">Admin</strong></span></div></div>
<div class="content">

<div class="search-box"><input type="text" id="searchInput" class="form-control" placeholder="🔍 Search by name, phone, or ID..." oninput="filterClients()"></div>

<div class="table-card">
<div class="table-header"><i class="fa-solid fa-users"></i> Registered Clients</div>
<div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>ID Number</th><th>County</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="clientsTable"><tr><td colspan="8" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div>
</div>

</div></div></div>

<div class="modal fade" id="clientModal"><div class="modal-dialog modal-xl" style="max-width:95vw;height:90vh;"><div class="modal-content" style="height:90vh;"><div class="modal-header bg-primary text-white"><h5 class="modal-title" style="font-size:20px;"><i class="fa fa-user"></i> Client Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="clientDetails" style="padding:25px;overflow-y:auto;"></div><div class="modal-footer"><button class="btn btn-info" id="btnViewDocs" onclick="viewDocuments()" style="font-size:15px;padding:10px 20px;"><i class="fa fa-file-image"></i> View Documents</button><button class="btn btn-warning" id="btnResetPass" onclick="resetPassword()" style="font-size:15px;padding:10px 20px;"><i class="fa fa-key"></i> Reset Password</button><button class="btn btn-danger" id="btnDelete" onclick="deleteClient()" style="font-size:15px;padding:10px 20px;"><i class="fa fa-trash"></i> Delete</button><button class="btn btn-secondary" data-bs-dismiss="modal" style="font-size:15px;padding:10px 20px;">Close</button></div></div></div></div>

<div class="modal fade" id="docsModal"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header bg-info text-white"><h5 class="modal-title" style="font-size:20px;"><i class="fa fa-file-image"></i> Client Documents</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="docsContent" style="padding:25px;"></div></div></div></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if(!AUTH.currentAdmin()){window.location.href="admin-login.html";}
let admin=AUTH.currentAdmin();if(admin)document.getElementById("adminName").innerHTML=admin.username;
let allClients=[],selectedClientId=null,selectedClientData=null,selectedClientHasLoans=false;
function money(v){return"KES "+Number(v||0).toLocaleString();}
const DEFAULT_IMG="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

function showFullImage(src,title){if(!src){alert("No image available");return;}let m=document.createElement("div");m.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:pointer;";m.innerHTML=`<div style="max-width:95%;max-height:95%;text-align:center;"><h5 style="color:white;margin-bottom:10px;font-size:20px;">${title}</h5><img src="${src}" style="max-width:100%;max-height:85vh;border-radius:10px;"><br><small style="color:#ccc;font-size:14px;">Click anywhere to close</small></div>`;m.onclick=function(){document.body.removeChild(m);};document.body.appendChild(m);}

async function loadClients(){
    let result=await api.getClients();
    if(!result.success||!result.clients){document.getElementById("clientsTable").innerHTML='<tr><td colspan="8" class="text-center text-muted p-4">No clients found.</td></tr>';return;}
    allClients=result.clients;
    renderClients(allClients);
}

function renderClients(clients){
    let table=document.getElementById("clientsTable");table.innerHTML="";
    if(clients.length===0){table.innerHTML='<tr><td colspan="8" class="text-center text-muted p-4">No clients found.</td></tr>';return;}
    clients.forEach((c,i)=>{
        let badge=c.status==="ACTIVE"?'<span class="status-active">ACTIVE</span>':'<span class="status-suspended">SUSPENDED</span>';
        table.innerHTML+=`<tr><td>${i+1}</td><td><b>${c.fullname||"-"}</b></td><td>${c.phone||"-"}</td><td>${c.national_id||"-"}</td><td>${c.county||"-"}</td><td>${formatDate(c.created_at)}</td><td>${badge}</td><td><button class="btn btn-view btn-sm" onclick="viewClient(${c.id})"><i class="fa fa-eye"></i> View</button></td></tr>`;
    });
}

function filterClients(){
    let q=document.getElementById("searchInput").value.toLowerCase();
    if(!q){renderClients(allClients);return;}
    let filtered=allClients.filter(c=>(c.fullname||"").toLowerCase().includes(q)||(c.phone||"").includes(q)||(c.national_id||"").includes(q));
    renderClients(filtered);
}

async function viewClient(id){
    let result=await api.getClient(id);
    if(!result.success)return;
    let c=result.client;selectedClientId=id;selectedClientData=c;
    
    let loansResult=await api.getLoans();
    let activeLoans=loansResult.success?(loansResult.loans||[]).filter(l=>l.client_id==id&&l.status==="ACTIVE"&&Number(l.remaining_principal||0)>0):[];
    selectedClientHasLoans=activeLoans.length>0;
    let totalOutstanding=activeLoans.reduce((s,l)=>s+Number(l.remaining_principal||0),0);
    
    document.getElementById("clientDetails").innerHTML=`
        <div style="text-align:center;margin-bottom:20px;"><img src="${c.profile_photo||DEFAULT_IMG}" class="profile-img-large"><h4 style="margin-top:8px;">${c.fullname||"-"}</h4><span class="badge ${c.status==='ACTIVE'?'bg-success':'bg-danger'} mt-2" style="font-size:15px;padding:8px 18px;">${c.status||'ACTIVE'}</span></div>
        <hr>
        <div class="info-list">
            <div class="info-row"><div class="info-label">Phone</div><div class="info-value">${c.phone||"-"}</div></div>
            <div class="info-row"><div class="info-label">National ID</div><div class="info-value">${c.national_id||"-"}</div></div>
            <div class="info-row"><div class="info-label">Email</div><div class="info-value">${c.email||"Not Provided"}</div></div>
            <div class="info-row"><div class="info-label">Occupation</div><div class="info-value">${c.occupation||"-"}</div></div>
            <div class="info-row"><div class="info-label">Employer</div><div class="info-value">${c.employer||"Not Provided"}</div></div>
            <div class="info-row"><div class="info-label">Monthly Income</div><div class="info-value">${money(c.monthly_income)}</div></div>
            <div class="info-row"><div class="info-label">County</div><div class="info-value">${c.county||"-"}</div></div>
            <div class="info-row"><div class="info-label">Address</div><div class="info-value">${c.address||"-"}</div></div>
            <div class="info-row"><div class="info-label">Registered</div><div class="info-value">${formatDate(c.created_at)}</div></div>
        </div>`;
    
    let btnDelete=document.getElementById("btnDelete");
    if(selectedClientHasLoans){
        btnDelete.className="btn btn-danger-disabled";btnDelete.disabled=true;
        btnDelete.innerHTML='<i class="fa fa-lock"></i> Cannot Delete (Active Loan: '+money(totalOutstanding)+')';
    }else{
        btnDelete.className="btn btn-danger";btnDelete.disabled=false;
        btnDelete.innerHTML='<i class="fa fa-trash"></i> Delete';
    }
    
    new bootstrap.Modal(document.getElementById("clientModal")).show();
}

function viewDocuments(){
    if(!selectedClientData)return;
    let c=selectedClientData;
    document.getElementById("docsContent").innerHTML=`
        <div class="row"><div class="col-md-4 text-center"><h5 class="fw-bold mb-3">Profile Photo</h5>${c.profile_photo?`<img src="${c.profile_photo}" class="document-img"><button class="btn btn-outline-primary btn-doc mt-3 w-100" onclick="showFullImage('${c.profile_photo}','Profile Photo')"><i class="fa fa-search-plus"></i> View Full Size</button>`:'<p class="text-muted">Not uploaded</p>'}</div>
        <div class="col-md-4 text-center"><h5 class="fw-bold mb-3">ID Front</h5>${c.id_front?`<img src="${c.id_front}" class="document-img"><button class="btn btn-outline-primary btn-doc mt-3 w-100" onclick="showFullImage('${c.id_front}','ID Front')"><i class="fa fa-search-plus"></i> View Full Size</button>`:'<p class="text-muted">Not uploaded</p>'}</div>
        <div class="col-md-4 text-center"><h5 class="fw-bold mb-3">ID Back</h5>${c.id_back?`<img src="${c.id_back}" class="document-img"><button class="btn btn-outline-primary btn-doc mt-3 w-100" onclick="showFullImage('${c.id_back}','ID Back')"><i class="fa fa-search-plus"></i> View Full Size</button>`:'<p class="text-muted">Not uploaded</p>'}</div></div>`;
    new bootstrap.Modal(document.getElementById("docsModal")).show();
}

async function resetPassword(){
    if(!selectedClientId)return;
    let newPass=prompt("Enter new password for this client (min 4 characters):");
    if(!newPass||newPass.length<4){alert("Password must be at least 4 characters.");return;}
    alert("Password reset to: "+newPass+"\n\nNote: Password reset requires a dedicated backend endpoint.");
}

async function deleteClient(){
    if(!selectedClientId)return;
    if(selectedClientHasLoans){alert("Cannot delete this client. They have an active loan.");return;}
    if(!confirm("WARNING: Delete this client permanently?"))return;
    let result=await api.deleteClient(selectedClientId);
    if(result.success){alert("Client deleted.");bootstrap.Modal.getInstance(document.getElementById("clientModal")).hide();loadClients();}
    else{alert("Error: "+result.message);}
}

function logout(){AUTH.adminLogout();}
loadClients();
</script>
</body>
</html>
