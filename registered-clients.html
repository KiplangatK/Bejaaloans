<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Clients | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;}
.sidebar{width:260px;min-height:100vh;background:#0d47a1;color:white;position:fixed;left:0;top:0;}
.logo{padding:25px;font-size:28px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:10px;}
.sidebar ul{list-style:none;padding:15px 0;}
.sidebar ul li a{display:block;padding:15px 25px;color:white;text-decoration:none;transition:.3s;}
.sidebar ul li a:hover{background:#1565c0;padding-left:35px;}.sidebar ul li i{width:25px;}
.main{margin-left:260px;width:calc(100% - 260px);}
.topbar{height:70px;background:#1976d2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 30px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.topbar h2{font-size:28px;}.topbar .topbar-right{display:flex;align-items:center;gap:15px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{padding:30px;}
.table-card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.1);}
.table-header{background:#1976d2;color:white;padding:18px 25px;font-size:22px;font-weight:bold;}
table{width:100%;}.table th{background:#e3f2fd;color:#0d47a1;}.table td,.table th{padding:15px;vertical-align:middle;}
.status-active{background:#198754;color:white;padding:6px 12px;border-radius:20px;}
.status-suspended{background:#dc3545;color:white;padding:6px 12px;border-radius:20px;}
.btn-view{background:#1976d2;color:white;border-radius:20px;}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<ul>
<li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i>Dashboard</a></li>
<li><a href="registered-clients.html"><i class="fa-solid fa-users"></i>Registered Clients</a></li>
<li><a href="active-loans.html"><i class="fa-solid fa-money-bill-wave"></i>Active Loans</a></li>
<li><a href="loan-applications.html"><i class="fa-solid fa-file-circle-check"></i>Loan Applications</a></li>
<li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></li>
</ul>
</div>

<div class="main">
<div class="topbar"><h2>Registered Clients</h2><div class="topbar-right"><a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="adminName">Admin</strong></span></div></div>
<div class="content"><div class="table-card"><div class="table-header"><i class="fa-solid fa-users"></i>Registered Clients List</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>#</th><th>Full Name</th><th>Phone</th><th>ID Number</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="clientsTable"><tr><td colspan="7" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div></div></div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if(!AUTH.currentAdmin()){window.location.href="admin-login.html";}
let admin=AUTH.currentAdmin();if(admin)document.getElementById("adminName").innerHTML=admin.username;

async function loadClients(){
    let result=await api.getClients();let table=document.getElementById("clientsTable");table.innerHTML="";
    if(!result.success||!result.clients||result.clients.length===0){table.innerHTML='<tr><td colspan="7" class="text-center text-muted p-4">No clients found.</td></tr>';return;}
    result.clients.forEach((c,i)=>{
        let badge=c.status==="ACTIVE"?'<span class="status-active">ACTIVE</span>':'<span class="status-suspended">SUSPENDED</span>';
        table.innerHTML+=`<tr><td>${i+1}</td><td>${c.fullname||"-"}</td><td>${c.phone||"-"}</td><td>${c.national_id||"-"}</td><td>${formatDate(c.created_at)}</td><td>${badge}</td><td><button class="btn btn-view btn-sm" onclick="window.location.href='client-profile.html?id='+${c.id}"><i class="fa fa-eye"></i> View</button></td></tr>`;
    });
}

function logout(){AUTH.adminLogout();}
loadClients();
</script>
</body>
</html>
