<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Applications | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0d47a1;color:white;}
.logo{padding:25px;font-size:25px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:10px;}
.sidebar a{display:block;padding:15px 25px;color:white;text-decoration:none;}
.sidebar a:hover{background:#1565c0;}.sidebar i{width:25px;}
.main{margin-left:260px;}
.topbar{height:70px;background:#1976d2;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 30px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.topbar h3{font-weight:700;}.topbar .topbar-right{display:flex;align-items:center;gap:15px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{padding:30px;}
.card-box{background:white;padding:25px;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.12);}
.table thead th{background:#e3f2fd;color:#0d47a1;}.table td,.table th{padding:15px;vertical-align:middle;}
.btn-view{background:#1976d2;color:white;border-radius:20px;}
.btn-guarantors{background:#6f42c1;color:white;border-radius:20px;}
.btn-guarantors:hover{background:#5a3399;color:white;}
.section-title{background:#0d47a1;color:white;padding:10px 15px;border-radius:10px;margin-top:15px;}
.detail-card{background:#f8fbff;border-radius:15px;padding:15px;margin-bottom:15px;border:1px solid #dbeafe;}
.document-img{width:100%;height:160px;object-fit:contain;border-radius:10px;border:1px solid #ddd;margin-top:5px;}
.guarantor-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #2563eb;}
.form-control{height:50px;border-radius:12px;}
.btn-doc{font-size:12px;padding:4px 10px;}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<a href="admin-dashboard.html"><i class="fa fa-dashboard"></i>Dashboard</a>
<a href="registered-clients.html"><i class="fa fa-users"></i>Registered Clients</a>
<a href="active-loans.html"><i class="fa fa-money-bill-wave"></i>Active Loans</a>
<a href="loan-applications.html"><i class="fa fa-file-circle-check"></i>Loan Applications</a>
<a href="#" onclick="logout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
</div>

<div class="main">
<div class="topbar"><h3><i class="fa fa-file-circle-check"></i>Loan Applications</h3><div class="topbar-right"><a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="adminName">Admin</strong></span></div></div>
<div class="content"><div class="card-box"><h4 class="text-primary mb-4"><i class="fa fa-list"></i>Loan Application Requests</h4><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Client</th><th>Phone</th><th>Amount</th><th>Purpose</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="applicationsTable"><tr><td colspan="7" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div></div></div>
</div>

<div class="modal fade" id="applicationModal"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title"><i class="fa fa-file-circle-check"></i>Application Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="applicationDetails"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if(!AUTH.currentAdmin()){window.location.href="admin-login.html";}
let admin=AUTH.currentAdmin();if(admin)document.getElementById("adminName").innerHTML=admin.username;
function money(v){return"KES "+Number(v||0).toLocaleString();}
const DEFAULT_IMG="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

function showFullImage(src,title){if(!src){alert("No image available");return;}let m=document.createElement("div");m.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:pointer;";m.innerHTML=`<div style="max-width:90%;max-height:90%;text-align:center;"><h5 style="color:white;margin-bottom:10px;">${title}</h5><img src="${src}" style="max-width:100%;max-height:80vh;border-radius:10px;"><br><small style="color:#ccc;">Click anywhere to close</small></div>`;m.onclick=function(){document.body.removeChild(m);};document.body.appendChild(m);}

async function loadApplications(){
    let result=await api.getApplications();let table=document.getElementById("applicationsTable");table.innerHTML="";
    if(!result.success||!result.applications||result.applications.length===0){table.innerHTML='<tr><td colspan="7" class="text-center text-muted p-4">No applications found.</td></tr>';return;}
    let pending=result.applications.filter(a=>a.status==="PENDING");
    if(pending.length===0){table.innerHTML='<tr><td colspan="7" class="text-center text-muted p-4">No pending applications.</td></tr>';return;}
    pending.reverse().forEach(a=>{let c=a.client||{};table.innerHTML+=`<tr><td>${c.fullname||"-"}</td><td>${c.phone||""}</td><td>${money(a.amount)}<br><small class="text-success">Interest: ${money(a.amount*0.20)}</small></td><td>${a.purpose||"-"}</td><td>${formatDate(a.application_date)}</td><td><span class="badge bg-warning">${a.status}</span></td><td><button class="btn btn-view btn-sm" onclick="viewApplication(${a.id})"><i class="fa fa-eye"></i>View</button></td></tr>`;});
}

async function viewApplication(id){
    let result=await api.getApplications();if(!result.success)return;
    let app=result.applications.find(a=>a.id==id);if(!app)return;
    let c=app.client||{};
    document.getElementById("applicationDetails").innerHTML=`
        <div class="section-title"><i class="fa fa-user"></i>Client Information</div>
        <div class="detail-card"><div class="row"><div class="col-md-4 text-center"><img src="${c.profile_photo||DEFAULT_IMG}" class="guarantor-photo"><h5 class="mt-3">${c.fullname||"-"}</h5></div><div class="col-md-8"><p><b>National ID:</b> ${c.national_id||"-"}</p><p><b>Phone:</b> ${c.phone||"-"}</p></div></div></div>
        <div class="section-title"><i class="fa fa-money-bill"></i>Loan Information</div>
        <div class="detail-card"><p><b>Amount:</b> ${money(app.amount)}</p><p><b>Purpose:</b> ${app.purpose||"-"}</p><p><b>Date:</b> ${formatDate(app.application_date)}</p></div>
        
        <div class="text-center mt-3 mb-3"><button class="btn btn-guarantors" onclick="toggleGuarantors('${app.id}')"><i class="fa fa-users"></i>View Guarantors</button></div>
        <div id="guarantorSection" style="display:none;"></div>
        
        <div class="section-title mt-4"><i class="fa fa-calendar-check"></i>Approval Details</div>
        <div class="detail-card"><div class="row"><div class="col-md-6 mb-3"><label class="fw-bold">Loan Date</label><input type="date" id="approvalDate_${app.id}" class="form-control"></div><div class="col-md-6 mb-3"><label class="fw-bold">Due Date</label><input type="date" id="dueDate_${app.id}" class="form-control"></div></div></div>
        <div class="text-center mt-4"><button class="btn btn-success me-2" onclick="approveApplication(${app.id})"><i class="fa fa-check"></i>Approve</button><button class="btn btn-danger" onclick="rejectApplication(${app.id})"><i class="fa fa-times"></i>Reject</button></div>`;
    new bootstrap.Modal(document.getElementById("applicationModal")).show();
    setTimeout(()=>{document.getElementById("approvalDate_"+app.id).value=new Date().toISOString().split("T")[0];document.getElementById("dueDate_"+app.id).value=new Date(Date.now()+30*24*60*60*1000).toISOString().split("T")[0];},300);
}

async function toggleGuarantors(appId){
    let section=document.getElementById("guarantorSection");
    if(section.style.display==="block"){section.style.display="none";return;}
    section.innerHTML='<p class="text-center text-muted">Loading guarantor details...</p>';section.style.display="block";
    let result=await api.getApplications();if(!result.success)return;
    let app=result.applications.find(a=>a.id==appId);if(!app)return;
    section.innerHTML=`<hr><h5 class="text-primary"><i class="fa fa-users"></i>Guarantor Details</h5>${showGuarantor(app.guarantor1,"Guarantor 1")}${showGuarantor(app.guarantor2,"Guarantor 2")}`;
}

function showGuarantor(g,title){
    if(!g)return'<p class="text-muted">No '+title+' details.</p>';
    return`
    <div class="detail-card">
        <h5 class="text-primary">${title}</h5>
        <div class="row">
            <div class="col-md-4 text-center">
                <img src="${g.photo||DEFAULT_IMG}" class="guarantor-photo">
                <br><button class="btn btn-sm btn-outline-primary btn-doc mt-2" onclick="showFullImage('${g.photo||DEFAULT_IMG}','${title} Photo')"><i class="fa fa-search-plus"></i> View Full</button>
            </div>
            <div class="col-md-8">
                <p><b>Name:</b> ${g.name||"-"}</p>
                <p><b>National ID:</b> ${g.id||g.national_id||"-"}</p>
                <p><b>Phone:</b> ${g.phone||"-"}</p>
                <p><b>Relationship:</b> ${g.relationship||"-"}</p>
                <p><b>Address:</b> ${g.address||"-"}</p>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6 text-center">
                <p class="fw-bold mb-1">ID Front</p>
                ${g.idFront||g.id_front?`<img src="${g.idFront||g.id_front}" class="document-img"><button class="btn btn-sm btn-outline-primary btn-doc mt-1" onclick="showFullImage('${g.idFront||g.id_front}','${title} ID Front')"><i class="fa fa-search-plus"></i> View Full</button>`:'<p class="text-muted">Not uploaded</p>'}
            </div>
            <div class="col-md-6 text-center">
                <p class="fw-bold mb-1">ID Back</p>
                ${g.idBack||g.id_back?`<img src="${g.idBack||g.id_back}" class="document-img"><button class="btn btn-sm btn-outline-primary btn-doc mt-1" onclick="showFullImage('${g.idBack||g.id_back}','${title} ID Back')"><i class="fa fa-search-plus"></i> View Full</button>`:'<p class="text-muted">Not uploaded</p>'}
            </div>
        </div>
    </div>`;
}

async function approveApplication(id){
    if(!confirm("Approve this loan?"))return;
    let loanDate=document.getElementById("approvalDate_"+id).value,dueDate=document.getElementById("dueDate_"+id).value;
    let result=await api.approveApplication(id,{loanDate,dueDate});
    alert(result.success?"Loan approved!":"Error: "+result.message);
    bootstrap.Modal.getInstance(document.getElementById("applicationModal")).hide();loadApplications();
}

async function rejectApplication(id){
    if(!confirm("Reject this application?"))return;
    let result=await api.rejectApplication(id);
    alert(result.success?"Application rejected.":"Error: "+result.message);
    bootstrap.Modal.getInstance(document.getElementById("applicationModal")).hide();loadApplications();
}

function logout(){AUTH.adminLogout();}
loadApplications();
</script>
</body>
</html>
