<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Loans | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0F4C81;color:white;}
.logo{padding:20px;font-size:22px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:8px;}
.sidebar a{display:block;padding:12px 20px;color:white;text-decoration:none;transition:.3s;font-size:15px;}
.sidebar a:hover{background:#2563EB;padding-left:28px;}.sidebar i{width:22px;}
.main{margin-left:260px;height:100vh;display:flex;flex-direction:column;}
.topbar{height:50px;background:#2563EB;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-shrink:0;}
.topbar h3{font-size:19px;}.topbar .topbar-right{display:flex;align-items:center;gap:12px;font-size:14px;}
.topbar .btn-home{background:rgba(255,255,255,0.2);color:white;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600;transition:.3s;}
.topbar .btn-home:hover{background:rgba(255,255,255,0.35);color:white;}
.topbar .btn-logout{color:#ffc107;font-weight:600;cursor:pointer;text-decoration:none;font-size:13px;}.topbar .btn-logout:hover{color:#fff;}
.content{flex:1;padding:15px;overflow-y:auto;}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px;}
.summary-card{border-radius:12px;padding:16px;color:white;height:105px;display:flex;flex-direction:column;justify-content:center;}
.summary-card h2{font-size:26px;font-weight:bold;margin:0;}.summary-card h5{font-size:13px;margin:0 0 4px 0;opacity:0.9;}
.total{background:#1565c0;}.active{background:#198754;}.borrowed{background:#6f42c1;}.balance{background:#dc3545;}
.table-card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.table-header{background:#0F4C81;color:white;padding:13px 18px;font-size:17px;font-weight:bold;}
.table th{background:#e3f2fd;color:#0F4C81;font-size:13px;padding:10px 8px;}.table td{padding:10px 8px;font-size:14px;vertical-align:middle;}
.badge{font-size:12px;padding:6px 10px;}
.btn-payment{background:#198754;color:white;border-radius:15px;font-size:12px;padding:5px 10px;}
.btn-payment:hover{background:#146c43;color:white;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<a href="client-dashboard.html"><i class="fa fa-home"></i>Dashboard</a>
<a href="apply-loan.html"><i class="fa fa-hand-holding-dollar"></i>Apply Loan</a>
<a href="my-loans.html"><i class="fa fa-money-bill-wave"></i>My Loans</a>
<a href="client-profile.html"><i class="fa fa-user"></i>My Profile</a>
<a href="#" onclick="AUTH.clientLogout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
</div>

<div class="main">
<div class="topbar"><h3><i class="fa fa-money-bill-wave"></i> My Loans</h3><div class="topbar-right"><a href="index.html" class="btn-home"><i class="fa fa-home"></i> Home</a><span>Welcome, <strong id="clientNameTop"></strong></span><a href="#" class="btn-logout" onclick="AUTH.clientLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></div></div>
<div class="content">

<div class="summary-cards">
<div class="summary-card total"><h5>Total</h5><h2 id="totalLoans">0</h2></div>
<div class="summary-card active"><h5>Active</h5><h2 id="activeLoans">0</h2></div>
<div class="summary-card borrowed"><h5>Borrowed</h5><h2 id="totalBorrowed">KES 0</h2></div>
<div class="summary-card balance"><h5>Outstanding</h5><h2 id="outstanding">KES 0</h2></div>
</div>

<div class="table-card"><div class="table-header"><i class="fa fa-list"></i> My Loans & Applications</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance</th><th>Due Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="myLoansTable"><tr><td colspan="7" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div></div>

</div></div>

<div class="modal fade" id="paymentModal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">Payment History</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><h5 id="paymentLoanTitle" class="mb-3"></h5><table class="table table-bordered"><thead class="table-success"><tr><th>Date</th><th>Amount</th><th>Principal</th><th>Interest</th><th>Balance</th><th>Note</th></tr></thead><tbody id="paymentTable"></tbody></table></div></div></div></div>

<script>
function money(v){return"KES "+Number(v||0).toLocaleString();}
document.addEventListener("DOMContentLoaded",()=>{let c=AUTH.currentClient();if(c)document.getElementById("clientNameTop").textContent=c.fullname||"-";});

async function loadMyLoans(){
    let loansResult=await api.getMyLoans();
    let appsResult=await api.getMyApplications();
    let loans=loansResult.success?loansResult.loans:[];
    let applications=appsResult.success?(appsResult.applications||[]):[];
    let table=document.getElementById("myLoansTable");table.innerHTML="";
    let allItems=[],totalBorrowed=0,outstanding=0,activeCount=0,today=new Date();
    
    if(Array.isArray(loans)){loans.forEach(l=>{let amount=Number(l.original_principal||0),balance=Number(l.remaining_principal||0);totalBorrowed+=amount;outstanding+=balance;let realStatus=l.status;if(l.status==="COMPLETED"||balance<=0)realStatus="COMPLETED";else if(l.due_date&&new Date(l.due_date)<today)realStatus="LATE";if(realStatus==="ACTIVE")activeCount++;allItems.push({date:l.loan_date||l.created_at,type:"Loan",amount:amount,balance:balance,dueDate:l.due_date,status:realStatus,id:l.id,isLoan:true});});}
    if(Array.isArray(applications)){applications.forEach(a=>{if(a.status==="APPROVED")return;allItems.push({date:a.application_date,type:"Application",amount:Number(a.amount||0),balance:0,dueDate:"-",status:a.status,id:a.id,isLoan:false});});}
    
    if(allItems.length===0){table.innerHTML='<tr><td colspan="7" class="text-center text-muted p-4">No loans or applications found.</td></tr>';updateSummary(0,0,0,0);return;}
    allItems.sort((a,b)=>b.date.localeCompare(a.date));
    
    allItems.forEach(item=>{let sc="bg-secondary";if(item.status==="ACTIVE")sc="bg-success";if(item.status==="COMPLETED")sc="bg-info";if(item.status==="LATE")sc="bg-danger";if(item.status==="PENDING")sc="bg-warning text-dark";if(item.status==="REJECTED")sc="bg-danger";let action=item.isLoan?`<button class="btn btn-payment btn-sm" onclick="viewPayments(${item.id},'${money(item.amount)}')"><i class="fa fa-list"></i> Payments</button>`:'<span class="text-muted small">Awaiting review</span>';table.innerHTML+=`<tr><td>${formatDate(item.date)}</td><td>${item.type}</td><td>${money(item.amount)}</td><td>${item.isLoan?money(item.balance):"-"}</td><td>${item.isLoan?formatDate(item.dueDate):"-"}</td><td><span class="badge ${sc}">${item.status}</span></td><td>${action}</td></tr>`;});
    updateSummary(allItems.length,activeCount,totalBorrowed,outstanding);
}

function updateSummary(t,a,b,o){document.getElementById("totalLoans").innerHTML=t;document.getElementById("activeLoans").innerHTML=a;document.getElementById("totalBorrowed").innerHTML=money(b);document.getElementById("outstanding").innerHTML=money(o);}

async function viewPayments(loanId,loanAmount){
    document.getElementById("paymentLoanTitle").innerHTML="<i class='fa fa-money-bill'></i> Payments for: "+loanAmount;
    let result=await api.getLoanPayments(loanId);let table=document.getElementById("paymentTable");table.innerHTML="";
    if(!result.success||!result.payments||result.payments.length===0){table.innerHTML='<tr><td colspan="6" class="text-center text-muted">No payments yet</td></tr>';}
    else{result.payments.forEach(p=>{table.innerHTML+=`<tr><td>${formatDate(p.payment_date)}</td><td>${money(p.amount)}</td><td>${money(p.principal_paid)}</td><td>${money(p.interest_paid)}</td><td>${money(p.balance)}</td><td>${p.note||"-"}</td></tr>`;});}
    new bootstrap.Modal(document.getElementById("paymentModal")).show();
}

loadMyLoans();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
