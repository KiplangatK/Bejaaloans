<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Loans | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.header{background:linear-gradient(135deg,#0F4C81,#2563EB);color:white;padding:25px;border-radius:0 0 25px 25px;box-shadow:0 5px 15px rgba(0,0,0,.2);position:relative;}
.header h2{font-weight:700;}
.header .btn-back{position:absolute;top:20px;right:25px;background:rgba(255,255,255,0.2);color:white;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:600;font-size:15px;transition:.3s;}
.header .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.container{max-width:1200px;}
.summary-card{border-radius:18px;padding:25px;color:white;height:140px;}
.summary-card h2{font-size:32px;font-weight:bold;}
.total{background:#1565c0;}.active{background:#198754;}.borrowed{background:#6f42c1;}.balance{background:#dc3545;}
.table-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.12);}
.table-header{background:#0F4C81;color:white;padding:18px;font-size:22px;font-weight:bold;}
.table th{background:#e3f2fd;color:#0F4C81;}.table td,.table th{padding:15px;vertical-align:middle;}
.badge{font-size:14px;padding:8px 15px;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="header text-center"><a href="client-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><h2><i class="fa-solid fa-building-columns"></i>BEJJA LOAN CREDIT</h2><p>My Loans</p></div>

<div class="container py-4">
<div class="row g-4 mb-4">
<div class="col-md-3"><div class="summary-card total"><h5>Total Loans</h5><h2 id="totalLoans">0</h2></div></div>
<div class="col-md-3"><div class="summary-card active"><h5>Active Loans</h5><h2 id="activeLoans">0</h2></div></div>
<div class="col-md-3"><div class="summary-card borrowed"><h5>Total Borrowed</h5><h2 id="totalBorrowed">KES 0</h2></div></div>
<div class="col-md-3"><div class="summary-card balance"><h5>Outstanding</h5><h2 id="outstanding">KES 0</h2></div></div>
</div>
<div class="table-card"><div class="table-header"><i class="fa fa-money-bill-wave"></i>My Loan History</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Date</th><th>Amount</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead><tbody id="myLoansTable"><tr><td colspan="5" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div></div>
</div>

<script>
function money(v){return"KES "+Number(v||0).toLocaleString();}
async function loadMyLoans(){
    let result=await api.getMyLoans();let table=document.getElementById("myLoansTable");table.innerHTML="";
    if(!result.success||!result.loans||result.loans.length===0){table.innerHTML='<tr><td colspan="5" class="text-center text-muted p-4">No loans found.</td></tr>';return;}
    let totalBorrowed=0,outstanding=0,activeCount=0,today=new Date();
    result.loans.reverse().forEach(l=>{
        let amount=Number(l.original_principal||0),balance=Number(l.remaining_principal||0);
        totalBorrowed+=amount;outstanding+=balance;
        let realStatus=l.status;if(l.status==="COMPLETED"||balance<=0)realStatus="COMPLETED";else if(l.due_date&&new Date(l.due_date)<today)realStatus="LATE";
        if(realStatus==="ACTIVE")activeCount++;
        let sc="bg-secondary";if(realStatus==="ACTIVE")sc="bg-success";if(realStatus==="COMPLETED")sc="bg-info";if(realStatus==="LATE")sc="bg-danger";
        table.innerHTML+=`<tr><td>${formatDate(l.loan_date)}</td><td>${money(amount)}</td><td>${money(balance)}</td><td>${formatDate(l.due_date)}</td><td><span class="badge ${sc}">${realStatus}</span></td></tr>`;
    });
    document.getElementById("totalLoans").innerHTML=result.loans.length;
    document.getElementById("activeLoans").innerHTML=activeCount;
    document.getElementById("totalBorrowed").innerHTML=money(totalBorrowed);
    document.getElementById("outstanding").innerHTML=money(outstanding);
}
loadMyLoans();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
