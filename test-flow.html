<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Test | Bejja Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background: #f5f7fa; font-family: 'Segoe UI', sans-serif; }
        .step-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .step-number { width: 40px; height: 40px; border-radius: 50%; background: #0d47a1; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .btn { border-radius: 10px; font-weight: 600; }
        .log-box { background: #1a1a2e; color: #e0e0e0; padding: 15px; border-radius: 10px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .log-success { color: #4caf50; }
        .log-error { color: #f44336; }
        .log-info { color: #2196f3; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width:900px;">
        <h2 class="mb-1 text-primary"><i class="fa fa-shield-halved"></i> Admin Test Panel</h2>
        <p class="text-muted mb-4">Test the complete flow: Login → Register Client → Apply Loan → Approve → View</p>

        <!-- Step 1: Admin Login -->
        <div class="step-card">
            <div class="d-flex align-items-center mb-3">
                <div class="step-number me-3">1</div>
                <h5 class="mb-0">Admin Login</h5>
            </div>
            <div class="row">
                <div class="col-md-4 mb-2">
                    <input id="adminUser" class="form-control" value="Kiplangat" placeholder="Username">
                </div>
                <div class="col-md-4 mb-2">
                    <input id="adminPass" class="form-control" value="Admin@123" type="password" placeholder="Password">
                </div>
                <div class="col-md-4 mb-2">
                    <button class="btn btn-primary w-100" onclick="adminLogin()">
                        <i class="fa fa-right-to-bracket"></i> Login as Admin
                    </button>
                </div>
            </div>
            <div id="step1Result" class="mt-2"></div>
        </div>

        <!-- Step 2: Register Test Client -->
        <div class="step-card">
            <div class="d-flex align-items-center mb-3">
                <div class="step-number me-3">2</div>
                <h5 class="mb-0">Register Test Client</h5>
            </div>
            <button class="btn btn-success" onclick="registerClient()">
                <i class="fa fa-user-plus"></i> Auto-Register Test Client
            </button>
            <small class="text-muted ms-2">Creates: John Doe / 0712345678 / Test@123</small>
            <div id="step2Result" class="mt-2"></div>
        </div>

        <!-- Step 3: Apply for Loan -->
        <div class="step-card">
            <div class="d-flex align-items-center mb-3">
                <div class="step-number me-3">3</div>
                <h5 class="mb-0">Apply for Loan (as Client)</h5>
            </div>
            <div class="row">
                <div class="col-md-4 mb-2">
                    <input id="loanAmount" class="form-control" value="10000" type="number" placeholder="Amount">
                </div>
                <div class="col-md-4 mb-2">
                    <input id="loanPurpose" class="form-control" value="Business Expansion" placeholder="Purpose">
                </div>
                <div class="col-md-4 mb-2">
                    <button class="btn btn-warning w-100" onclick="applyLoan()">
                        <i class="fa fa-paper-plane"></i> Submit Application
                    </button>
                </div>
            </div>
            <div id="step3Result" class="mt-2"></div>
        </div>

        <!-- Step 4: Approve Application -->
        <div class="step-card">
            <div class="d-flex align-items-center mb-3">
                <div class="step-number me-3">4</div>
                <h5 class="mb-0">Approve Pending Application</h5>
            </div>
            <button class="btn btn-info text-white" onclick="approveLatest()">
                <i class="fa fa-check-circle"></i> Approve Latest Pending Application
            </button>
            <div id="step4Result" class="mt-2"></div>
        </div>

        <!-- Step 5: View Results -->
        <div class="step-card">
            <div class="d-flex align-items-center mb-3">
                <div class="step-number me-3">5</div>
                <h5 class="mb-0">View All Data</h5>
            </div>
            <button class="btn btn-secondary me-2" onclick="viewStats()">
                <i class="fa fa-chart-bar"></i> View Statistics
            </button>
            <button class="btn btn-secondary me-2" onclick="viewClients()">
                <i class="fa fa-users"></i> View Clients
            </button>
            <button class="btn btn-secondary me-2" onclick="viewLoans()">
                <i class="fa fa-list"></i> View All Loans
            </button>
            <button class="btn btn-secondary" onclick="viewApplications()">
                <i class="fa fa-file-alt"></i> View Applications
            </button>
            <div id="step5Result" class="mt-3"></div>
        </div>

        <!-- Full Reset -->
        <div class="step-card text-center">
            <button class="btn btn-outline-danger" onclick="resetAll()">
                <i class="fa fa-refresh"></i> Reset & Run Full Test
            </button>
        </div>

        <!-- Activity Log -->
        <div class="step-card">
            <h6 class="fw-bold mb-2"><i class="fa fa-terminal"></i> Activity Log</h6>
            <div class="log-box" id="log">Waiting for actions...</div>
        </div>
    </div>

    <script>
        const API = "http://localhost:5000";
        let adminToken = "";
        let clientToken = "";
        let testPhone = "0712345678";
        let testPassword = "Test@123";

        function log(msg, type = "info") {
            const logEl = document.getElementById("log");
            const time = new Date().toLocaleTimeString();
            const color = type === "success" ? "log-success" : type === "error" ? "log-error" : "log-info";
            logEl.innerHTML += `\n<span class="${color}">[${time}] ${msg}</span>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function showResult(id, success, message) {
            const el = document.getElementById(id);
            el.innerHTML = success 
                ? `<div class="alert alert-success py-1">✅ ${message}</div>`
                : `<div class="alert alert-warning py-1">⚠️ ${message}</div>`;
        }

        // ==================== STEP 1: ADMIN LOGIN ====================
        async function adminLogin() {
            const username = document.getElementById("adminUser").value;
            const password = document.getElementById("adminPass").value;

            log("🔵 Logging in as admin: " + username);

            try {
                const res = await fetch(API + "/api/auth/admin-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    adminToken = data.token;
                    showResult("step1Result", true, "Admin logged in! Role: " + data.admin.role);
                    log("✅ Admin login SUCCESS", "success");
                } else {
                    showResult("step1Result", false, data.message || "Login failed");
                    log("❌ Admin login FAILED: " + data.message, "error");
                }
            } catch (e) {
                showResult("step1Result", false, e.message);
                log("❌ Error: " + e.message, "error");
            }
        }

        // ==================== STEP 2: REGISTER CLIENT ====================
        async function registerClient() {
            const data = {
                fullname: "John Doe",
                nationalID: "12345678",
                phone: testPhone,
                email: "john@test.com",
                password: testPassword,
                occupation: "Business Owner",
                employer: "Self Employed",
                monthlyIncome: "50000",
                county: "Nairobi",
                address: "123 Test Street, Nairobi"
            };

            log("🔵 Registering client: " + testPhone);

            try {
                const res = await fetch(API + "/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    showResult("step2Result", true, "Client registered: John Doe / " + testPhone);
                    log("✅ Client registered SUCCESS", "success");
                    
                    // Auto-login as client
                    await clientLogin();
                } else {
                    showResult("step2Result", false, result.message);
                    log("⚠️ " + result.message, "error");
                    
                    // If already exists, just login
                    if (result.message.includes("already registered")) {
                        log("ℹ️ Client exists, logging in...", "info");
                        await clientLogin();
                    }
                }
            } catch (e) {
                showResult("step2Result", false, e.message);
                log("❌ Error: " + e.message, "error");
            }
        }

        async function clientLogin() {
            log("🔵 Logging in as client: " + testPhone);

            try {
                const res = await fetch(API + "/api/auth/client-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: testPhone, password: testPassword })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    clientToken = data.token;
                    log("✅ Client login SUCCESS", "success");
                } else {
                    log("❌ Client login FAILED: " + data.message, "error");
                }
            } catch (e) {
                log("❌ Error: " + e.message, "error");
            }
        }

        // ==================== STEP 3: APPLY LOAN ====================
        async function applyLoan() {
            if (!clientToken) {
                // Try to login first
                await clientLogin();
                if (!clientToken) {
                    showResult("step3Result", false, "Please register/login client first (Step 2)");
                    return;
                }
            }

            const amount = document.getElementById("loanAmount").value;
            const purpose = document.getElementById("loanPurpose").value;

            const data = {
                amount: Number(amount),
                purpose: purpose,
                guarantor1: { name: "Jane Smith", id: "87654321", phone: "0722222222", relationship: "Sister", address: "456 Nairobi" },
                guarantor2: { name: "Bob Jones", id: "11223344", phone: "0733333333", relationship: "Friend", address: "789 Nairobi" }
            };

            log(`🔵 Applying for loan: KSh ${amount} - ${purpose}`);

            try {
                const res = await fetch(API + "/api/applications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + clientToken
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    showResult("step3Result", true, `Application submitted! ID: ${result.applicationId}`);
                    log(`✅ Application SUCCESS. ID: ${result.applicationId}`, "success");
                } else {
                    showResult("step3Result", false, result.message);
                    log("❌ Application FAILED: " + result.message, "error");
                }
            } catch (e) {
                showResult("step3Result", false, e.message);
                log("❌ Error: " + e.message, "error");
            }
        }

        // ==================== STEP 4: APPROVE APPLICATION ====================
        async function approveLatest() {
            if (!adminToken) {
                await adminLogin();
                if (!adminToken) {
                    showResult("step4Result", false, "Please login as admin first (Step 1)");
                    return;
                }
            }

            log("🔵 Fetching pending applications...");

            try {
                const res = await fetch(API + "/api/applications", {
                    headers: { "Authorization": "Bearer " + adminToken }
                });
                const result = await res.json();

                if (!result.success || !result.applications) {
                    showResult("step4Result", false, "No applications found");
                    return;
                }

                const pending = result.applications.filter(a => a.status === "PENDING");

                if (pending.length === 0) {
                    showResult("step4Result", false, "No pending applications. Submit one first (Step 3)");
                    log("⚠️ No pending applications", "error");
                    return;
                }

                const app = pending[pending.length - 1];
                log(`🔵 Approving application #${app.id} for KSh ${app.amount}`);

                const approveRes = await fetch(API + "/api/applications/" + app.id + "/approve", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + adminToken
                    },
                    body: JSON.stringify({
                        loanDate: new Date().toISOString().split("T")[0],
                        dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
                        interestRate: 20
                    })
                });
                const approveResult = await approveRes.json();

                if (approveResult.success) {
                    showResult("step4Result", true, 
                        `Loan APPROVED! Amount: KSh ${app.amount} | Loan ID: ${approveResult.loanId || 'N/A'}`);
                    log(`✅ Loan APPROVED! Amount: KSh ${app.amount}`, "success");
                } else {
                    showResult("step4Result", false, approveResult.message);
                    log("❌ Approval FAILED: " + approveResult.message, "error");
                }
            } catch (e) {
                showResult("step4Result", false, e.message);
                log("❌ Error: " + e.message, "error");
            }
        }

        // ==================== STEP 5: VIEW DATA ====================
        async function viewStats() {
            if (!adminToken) { await adminLogin(); }
            log("🔵 Fetching statistics...");
            try {
                const res = await fetch(API + "/api/stats", {
                    headers: { "Authorization": "Bearer " + adminToken }
                });
                const data = await res.json();
                displayResult("step5Result", data);
                log("✅ Stats loaded", "success");
            } catch (e) {
                log("❌ Error: " + e.message, "error");
            }
        }

        async function viewClients() {
            if (!adminToken) { await adminLogin(); }
            log("🔵 Fetching clients...");
            try {
                const res = await fetch(API + "/api/clients", {
                    headers: { "Authorization": "Bearer " + adminToken }
                });
                const data = await res.json();
                displayResult("step5Result", data);
                log("✅ Clients loaded: " + (data.clients?.length || 0), "success");
            } catch (e) {
                log("❌ Error: " + e.message, "error");
            }
        }

        async function viewLoans() {
            if (!adminToken) { await adminLogin(); }
            log("🔵 Fetching loans...");
            try {
                const res = await fetch(API + "/api/loans", {
                    headers: { "Authorization": "Bearer " + adminToken }
                });
                const data = await res.json();
                displayResult("step5Result", data);
                log("✅ Loans loaded: " + (data.loans?.length || 0), "success");
            } catch (e) {
                log("❌ Error: " + e.message, "error");
            }
        }

        async function viewApplications() {
            if (!adminToken) { await adminLogin(); }
            log("🔵 Fetching applications...");
            try {
                const res = await fetch(API + "/api/applications", {
                    headers: { "Authorization": "Bearer " + adminToken }
                });
                const data = await res.json();
                displayResult("step5Result", data);
                log("✅ Applications loaded: " + (data.applications?.length || 0), "success");
            } catch (e) {
                log("❌ Error: " + e.message, "error");
            }
        }

        function displayResult(id, data) {
            document.getElementById(id).innerHTML = 
                `<div class="card"><div class="card-body p-2"><pre style="max-height:250px;overflow-y:auto;font-size:12px;margin:0;">${JSON.stringify(data, null, 2)}</pre></div></div>`;
        }

        // ==================== FULL RESET ====================
        async function resetAll() {
            document.getElementById("log").innerHTML = "Starting full test...";
            document.getElementById("step1Result").innerHTML = "";
            document.getElementById("step2Result").innerHTML = "";
            document.getElementById("step3Result").innerHTML = "";
            document.getElementById("step4Result").innerHTML = "";
            document.getElementById("step5Result").innerHTML = "";

            await adminLogin();
            await new Promise(r => setTimeout(r, 500));
            await registerClient();
            await new Promise(r => setTimeout(r, 500));
            await applyLoan();
            await new Promise(r => setTimeout(r, 500));
            await approveLatest();
            await new Promise(r => setTimeout(r, 500));
            await viewLoans();

            log("🎉 FULL TEST COMPLETE!", "success");
        }
    </script>
</body>
</html>
