<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test | Bejja Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 600px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .btn-run { padding: 20px; font-size: 18px; font-weight: 700; border-radius: 15px; background: linear-gradient(135deg, #0d47a1, #1976d2); border: none; color: white; width: 100%; }
        .step { padding: 12px 15px; margin: 5px 0; border-radius: 10px; }
        .step.waiting { background: #f8f9fa; color: #888; }
        .step.running { background: #fff3cd; color: #856404; }
        .step.success { background: #d4edda; color: #155724; }
        .step.error { background: #f8d7da; color: #721c24; }
        pre { background: #1a1a2e; color: #e0e0e0; padding: 15px; border-radius: 10px; max-height: 300px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4 mb-3 text-center">
            <h3 class="text-primary mb-3"><i class="fa fa-bolt"></i> Quick Test</h3>
            <p class="text-muted">Register client → Apply loan automatically</p>
            <button class="btn-run" onclick="runTest()" id="runBtn">
                <i class="fa fa-play"></i> Register & Apply Loan
            </button>
        </div>

        <div class="card p-4 mb-3">
            <h5 class="fw-bold mb-3">Progress</h5>
            <div id="steps"></div>
        </div>

        <div class="card p-4">
            <h6 class="fw-bold"><i class="fa fa-terminal"></i> Log</h6>
            <pre id="log">Click the button to start...</pre>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const API = "http://localhost:5000";
        const phone = "07" + Math.floor(10000000 + Math.random() * 90000000);
        const password = "Test@123";
        const amount = Math.floor(Math.random() * 5 + 1) * 5000;
        let clientToken = "";

        const steps = [
            "Register Client",
            "Client Login",
            "Apply for Loan"
        ];

        function log(msg) {
            const el = document.getElementById("log");
            el.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        function renderSteps() {
            document.getElementById("steps").innerHTML = steps.map((s, i) => 
                `<div id="step${i}" class="step waiting">⏳ ${s}</div>`
            ).join("");
        }

        function updateStep(i, status) {
            const el = document.getElementById("step" + i);
            if (!el) return;
            const icons = { waiting: "⏳", running: "🔄", success: "✅", error: "❌" };
            el.className = "step " + status;
            el.innerHTML = `${icons[status]} ${steps[i]}`;
        }

        async function runTest() {
            const btn = document.getElementById("runBtn");
            btn.disabled = true;
            btn.innerHTML = "Running...";
            document.getElementById("log").textContent = "🚀 STARTING TEST\n";
            log(`📱 Phone: ${phone}`);
            log(`💰 Amount: KSh ${amount.toLocaleString()}`);
            log("─".repeat(30));
            renderSteps();

            try {
                // Step 1: Register
                updateStep(0, "running");
                log("🔵 Registering client...");
                const regRes = await fetch(API + "/api/auth/register", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fullname: "Auto Test", nationalID: String(Math.floor(10000000 + Math.random() * 90000000)),
                        phone: phone, password: password,
                        occupation: "Tester", monthlyIncome: "50000",
                        county: "Nairobi", address: "Test Address"
                    })
                });
                const regData = await regRes.json();
                if (!regData.success && !regData.message.includes("already")) throw new Error(regData.message);
                updateStep(0, "success");
                log("✅ Client registered");
                await sleep(300);

                // Step 2: Login
                updateStep(1, "running");
                log("🔵 Logging in...");
                const loginRes = await fetch(API + "/api/auth/client-login", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: phone, password: password })
                });
                const loginData = await loginRes.json();
                if (!loginData.success) throw new Error(loginData.message);
                clientToken = loginData.token;
                updateStep(1, "success");
                log("✅ Logged in");
                await sleep(300);

                // Step 3: Apply Loan
                updateStep(2, "running");
                log(`🔵 Applying for KSh ${amount.toLocaleString()}...`);
                const applyRes = await fetch(API + "/api/applications", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + clientToken },
                    body: JSON.stringify({
                        amount: amount, purpose: "Business",
                        guarantor1: { name: "G1", id: "11111111", phone: "0711111111", relationship: "Friend", address: "Test" },
                        guarantor2: { name: "G2", id: "22222222", phone: "0722222222", relationship: "Friend", address: "Test" }
                    })
                });
                const applyData = await applyRes.json();
                if (!applyData.success) throw new Error(applyData.message);
                updateStep(2, "success");
                log("✅ Loan applied!");
                log("─".repeat(30));
                log("🎉 SUCCESS!");
                log(`   Phone: ${phone}`);
                log(`   Password: ${password}`);
                log(`   Loan: KSh ${amount.toLocaleString()}`);
                log(`   App ID: ${applyData.applicationId}`);
                log("");
                log("👨‍💼 Now login as admin to approve:");
                log("   http://127.0.0.1:5500/admin-portal.html");
                log("   Kiplangat / Admin@123");

            } catch (error) {
                log("❌ " + error.message);
                for (let i = 0; i < 3; i++) {
                    if (document.getElementById("step" + i)?.classList.contains("running")) {
                        updateStep(i, "error");
                        break;
                    }
                }
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-redo"></i> Run Again';
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        renderSteps();
    </script>
</body>
</html>
