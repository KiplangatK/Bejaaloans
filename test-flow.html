<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tool | Bejja Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 700px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .btn { padding: 12px 20px; font-size: 16px; font-weight: 600; border-radius: 12px; }
        .btn-danger { background: #dc3545; border: none; color: white; }
        .btn-primary { background: linear-gradient(135deg, #0d47a1, #1976d2); border: none; color: white; }
        .btn-success { background: #198754; border: none; color: white; }
        .step { padding: 10px 15px; margin: 3px 0; border-radius: 10px; font-size: 14px; }
        .step.waiting { background: #f8f9fa; color: #888; }
        .step.running { background: #fff3cd; color: #856404; }
        .step.success { background: #d4edda; color: #155724; }
        .step.error { background: #f8d7da; color: #721c24; }
        pre { background: #1a1a2e; color: #e0e0e0; padding: 15px; border-radius: 10px; max-height: 400px; overflow-y: auto; font-size: 12px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4 mb-3 text-center">
            <h3 class="text-primary mb-2"><i class="fa fa-tools"></i> Test Tool</h3>
            <p class="text-muted mb-3">One-click operations</p>
            <div class="d-grid gap-2">
                <button class="btn btn-danger" onclick="deleteAll()" id="deleteBtn">
                    <i class="fa fa-trash"></i> Delete All Data
                </button>
                <button class="btn btn-primary" onclick="registerAndApply()" id="registerBtn">
                    <i class="fa fa-play"></i> Register & Apply Loan
                </button>
                <button class="btn btn-success" onclick="runAll()" id="runAllBtn">
                    <i class="fa fa-forward"></i> Full Reset & Test
                </button>
            </div>
        </div>

        <div class="card p-4 mb-3">
            <h6 class="fw-bold mb-2">Progress</h6>
            <div id="steps"></div>
        </div>

        <div class="card p-4">
            <h6 class="fw-bold"><i class="fa fa-terminal"></i> Log</h6>
            <pre id="log">Ready.</pre>
        </div>
    </div>

    <script>
        const API = "http://localhost:5000/api";
        let clientToken = "";

        function log(msg) {
            const el = document.getElementById("log");
            el.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            el.scrollTop = el.scrollHeight;
        }

        function showSteps(list) {
            document.getElementById("steps").innerHTML = list.map((s, i) => 
                `<div id="step${i}" class="step waiting">⏳ ${s}</div>`
            ).join("");
        }

        function updateStep(i, status) {
            const el = document.getElementById("step" + i);
            if (!el) return;
            const icons = { waiting: "⏳", running: "🔄", success: "✅", error: "❌" };
            el.className = "step " + status;
            el.innerHTML = `${icons[status]} ${el.textContent.replace(/[⏳🔄✅❌] /, "")}`;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        function disable() { document.querySelectorAll("button").forEach(b => b.disabled = true); }
        function enable() { document.querySelectorAll("button").forEach(b => b.disabled = false); }

        async function deleteAll() {
            document.getElementById("log").textContent = "🗑️ DELETE ALL\n";
            log("─".repeat(30));
            showSteps(["Deleting all data..."]);
            disable();

            try {
                updateStep(0, "running");
                const loginRes = await fetch(API + "/auth/admin-login", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: "Kiplangat", password: "Admin@123" })
                });
                const loginData = await loginRes.json();
                if (!loginData.success) throw new Error(loginData.message);
                
                const deleteRes = await fetch(API + "/clients/all/clear", {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + loginData.token }
                });
                const deleteData = await deleteRes.json();
                if (!deleteData.success) throw new Error(deleteData.message);
                
                updateStep(0, "success");
                log("✅ " + deleteData.message);
                log("─".repeat(30));
                log("🎉 DONE!");

            } catch (error) {
                log("❌ " + error.message);
                updateStep(0, "error");
            }
            enable();
        }

        async function registerAndApply() {
            const phone = "07" + Math.floor(10000000 + Math.random() * 90000000);
            const password = "Test@123";
            const amount = Math.floor(Math.random() * 5 + 1) * 5000;

            document.getElementById("log").textContent = "🚀 REGISTER & APPLY\n";
            log(`📱 ${phone} | 💰 KSh ${amount.toLocaleString()}`);
            log("─".repeat(30));
            showSteps(["Register", "Login", "Apply Loan"]);
            disable();

            try {
                updateStep(0, "running");
                const regRes = await fetch(API + "/auth/register", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fullname: "Auto Test", nationalID: String(Math.floor(10000000 + Math.random() * 90000000)),
                        phone, password, occupation: "Tester", monthlyIncome: "50000", county: "Nairobi", address: "Test"
                    })
                });
                const regData = await regRes.json();
                if (!regData.success && !regData.message.includes("already")) throw new Error(regData.message);
                updateStep(0, "success");
                await sleep(300);

                updateStep(1, "running");
                const loginRes = await fetch(API + "/auth/client-login", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, password })
                });
                const loginData = await loginRes.json();
                if (!loginData.success) throw new Error(loginData.message);
                clientToken = loginData.token;
                updateStep(1, "success");
                await sleep(300);

                updateStep(2, "running");
                const applyRes = await fetch(API + "/applications", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + clientToken },
                    body: JSON.stringify({
                        amount, purpose: "Business",
                        guarantor1: { name: "G1", id: "11111111", phone: "0711111111", relationship: "Friend", address: "Test" },
                        guarantor2: { name: "G2", id: "22222222", phone: "0722222222", relationship: "Friend", address: "Test" }
                    })
                });
                const applyData = await applyRes.json();
                if (!applyData.success) throw new Error(applyData.message);
                updateStep(2, "success");
                log("─".repeat(30));
                log(`✅ Phone: ${phone} | Pass: ${password}`);
                log(`✅ Loan: KSh ${amount.toLocaleString()} | ID: ${applyData.applicationId}`);

            } catch (error) {
                log("❌ " + error.message);
            }
            enable();
        }

        async function runAll() {
            await deleteAll();
            await sleep(500);
            await registerAndApply();
        }
    </script>
</body>
</html>
