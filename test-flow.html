<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Client Flow | Bejja Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width:800px;">
        <h2 class="mb-4 text-primary">
            <i class="fa fa-flask"></i> Bejja Credit - Test Client Flow
        </h2>

        <!-- Step 1: Register -->
        <div class="card mb-3">
            <div class="card-header bg-primary text-white fw-bold">Step 1: Register New Client</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label>Full Name</label>
                        <input id="fullname" class="form-control" value="John Doe" placeholder="Full name">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>National ID</label>
                        <input id="nationalID" class="form-control" value="12345678" placeholder="ID number">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Phone</label>
                        <input id="phone" class="form-control" value="0712345678" placeholder="07XXXXXXXX">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Password</label>
                        <input id="password" class="form-control" value="Test@123" type="password">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>County</label>
                        <input id="county" class="form-control" value="Nairobi">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Monthly Income (KSh)</label>
                        <input id="income" class="form-control" value="50000" type="number">
                    </div>
                </div>
                <button class="btn btn-primary mt-2" onclick="registerClient()">
                    <i class="fa fa-user-plus"></i> Register Client
                </button>
                <div id="registerResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Step 2: Login -->
        <div class="card mb-3">
            <div class="card-header bg-success text-white fw-bold">Step 2: Client Login</div>
            <div class="card-body">
                <button class="btn btn-success" onclick="clientLogin()">
                    <i class="fa fa-right-to-bracket"></i> Login as Client
                </button>
                <div id="loginResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Step 3: Apply for Loan -->
        <div class="card mb-3">
            <div class="card-header bg-warning text-dark fw-bold">Step 3: Apply for Loan</div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label>Loan Amount (KSh)</label>
                        <input id="loanAmount" class="form-control" value="10000" type="number">
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Purpose</label>
                        <input id="purpose" class="form-control" value="Business Expansion">
                    </div>
                </div>
                <button class="btn btn-warning mt-2" onclick="applyLoan()">
                    <i class="fa fa-paper-plane"></i> Submit Loan Application
                </button>
                <div id="applyResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Step 4: Admin Approve -->
        <div class="card mb-3">
            <div class="card-header bg-info text-white fw-bold">Step 4: Admin Login & Approve</div>
            <div class="card-body">
                <button class="btn btn-info me-2" onclick="adminLogin()">
                    <i class="fa fa-lock"></i> Admin Login
                </button>
                <button class="btn btn-success" onclick="approveApplication()">
                    <i class="fa fa-check"></i> Approve Latest Application
                </button>
                <div id="adminResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Step 5: View Results -->
        <div class="card">
            <div class="card-header bg-dark text-white fw-bold">Step 5: View My Loans</div>
            <div class="card-body">
                <button class="btn btn-dark" onclick="viewMyLoans()">
                    <i class="fa fa-list"></i> View My Loans
                </button>
                <div id="loansResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Full Log -->
        <div class="card mt-3">
            <div class="card-header fw-bold">📋 Activity Log</div>
            <div class="card-body">
                <pre id="log" style="background:#1a1a2e;color:#e0e0e0;padding:15px;border-radius:8px;max-height:300px;overflow-y:auto;font-size:13px;">Waiting for actions...</pre>
            </div>
        </div>
    </div>

    <script>
        const API = "http://localhost:5000";
        let clientToken = "";
        let adminToken = "";
        let clientPhone = "";
        let latestApplicationId = null;

        function log(message, data) {
            const logEl = document.getElementById("log");
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `\n[${time}] ${message}`;
            if (data) logEl.textContent += "\n" + JSON.stringify(data, null, 2);
            logEl.textContent += "\n" + "─".repeat(50);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ==================== STEP 1: REGISTER ====================
        async function registerClient() {
            const phone = document.getElementById("phone").value;
            clientPhone = phone;
            
            const data = {
                fullname: document.getElementById("fullname").value,
                nationalID: document.getElementById("nationalID").value,
                phone: phone,
                password: document.getElementById("password").value,
                county: document.getElementById("county").value,
                monthlyIncome: document.getElementById("income").value,
                email: phone + "@test.com",
                occupation: "Business",
                employer: "Self Employed",
                address: "Test Address, Nairobi"
            };

            log("🔵 Registering client: " + phone, data);

            try {
                const res = await fetch(API + "/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    document.getElementById("registerResult").innerHTML = 
                        '<div class="alert alert-success">✅ Registration successful!</div>';
                    log("✅ Registration SUCCESS", result);
                } else {
                    document.getElementById("registerResult").innerHTML = 
                        '<div class="alert alert-warning">⚠️ ' + result.message + '</div>';
                    log("⚠️ Registration: " + result.message, result);
                }
            } catch (e) {
                document.getElementById("registerResult").innerHTML = 
                    '<div class="alert alert-danger">❌ Error: ' + e.message + '</div>';
                log("❌ Registration ERROR: " + e.message);
            }
        }

        // ==================== STEP 2: LOGIN ====================
        async function clientLogin() {
            const phone = document.getElementById("phone").value;
            const password = document.getElementById("password").value;

            log("🔵 Logging in client: " + phone);

            try {
                const res = await fetch(API + "/api/auth/client-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, password })
                });
                const result = await res.json();
                
                if (result.success && result.token) {
                    clientToken = result.token;
                    document.getElementById("loginResult").innerHTML = 
                        '<div class="alert alert-success">✅ Login successful! Client: ' + 
                        result.client.fullname + '</div>';
                    log("✅ Login SUCCESS. Token: " + result.token.substring(0, 30) + "...");
                } else {
                    document.getElementById("loginResult").innerHTML = 
                        '<div class="alert alert-warning">⚠️ ' + result.message + '</div>';
                    log("⚠️ Login failed: " + result.message);
                }
            } catch (e) {
                document.getElementById("loginResult").innerHTML = 
                    '<div class="alert alert-danger">❌ Error: ' + e.message + '</div>';
                log("❌ Login ERROR: " + e.message);
            }
        }

        // ==================== STEP 3: APPLY LOAN ====================
        async function applyLoan() {
            if (!clientToken) {
                alert("Please login first (Step 2)!");
                return;
            }

            const amount = document.getElementById("loanAmount").value;
            const purpose = document.getElementById("purpose").value;

            const data = {
                amount: Number(amount),
                purpose: purpose,
                guarantor1: {
                    name: "Jane Guarantor",
                    id: "87654321",
                    phone: "0722222222",
                    relationship: "Sister",
                    address: "456 Test Ave"
                },
                guarantor2: {
                    name: "Bob Guarantor",
                    id: "11223344",
                    phone: "0733333333",
                    relationship: "Friend",
                    address: "789 Test Rd"
                }
            };

            log("🔵 Applying for loan: KSh " + amount, data);

            try {
                const res = await fetch(API + "/api/applications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + clientToken
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    latestApplicationId = result.applicationId;
                    document.getElementById("applyResult").innerHTML = 
                        '<div class="alert alert-success">✅ Loan application submitted! Application ID: ' + 
                        result.applicationId + '</div>';
                    log("✅ Application SUCCESS. ID: " + result.applicationId, result);
                } else {
                    document.getElementById("applyResult").innerHTML = 
                        '<div class="alert alert-warning">⚠️ ' + (result.message || 'Failed') + '</div>';
                    log("⚠️ Application failed: " + result.message);
                }
            } catch (e) {
                document.getElementById("applyResult").innerHTML = 
                    '<div class="alert alert-danger">❌ Error: ' + e.message + '</div>';
                log("❌ Application ERROR: " + e.message);
            }
        }

        // ==================== STEP 4: ADMIN APPROVE ====================
        async function adminLogin() {
            log("🔵 Admin login");

            try {
                const res = await fetch(API + "/api/auth/admin-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: "Kiplangat", password: "Admin@123" })
                });
                const result = await res.json();
                
                if (result.success && result.token) {
                    adminToken = result.token;
                    document.getElementById("adminResult").innerHTML = 
                        '<div class="alert alert-success">✅ Admin login successful!</div>';
                    log("✅ Admin login SUCCESS");
                } else {
                    document.getElementById("adminResult").innerHTML = 
                        '<div class="alert alert-warning">⚠️ Admin login failed</div>';
                    log("⚠️ Admin login failed: " + result.message);
                }
            } catch (e) {
                document.getElementById("adminResult").innerHTML = 
                    '<div class="alert alert-danger">❌ Error: ' + e.message + '</div>';
                log("❌ Admin login ERROR: " + e.message);
            }
        }

        async function approveApplication() {
            if (!adminToken) {
                alert("Please login as admin first!");
                return;
            }

            // First get all applications to find the latest pending one
            log("🔵 Fetching applications...");
            
            try {
                const res = await fetch(API + "/api/applications", {
                    headers: { "Authorization": "Bearer " + adminToken }
                });
                const result = await res.json();
                
                if (result.success && result.applications) {
                    const pending = result.applications.filter(a => a.status === "PENDING");
                    
                    if (pending.length === 0) {
                        document.getElementById("adminResult").innerHTML += 
                            '<div class="alert alert-warning mt-2">No pending applications found.</div>';
                        log("⚠️ No pending applications");
                        return;
                    }

                    // Get the latest pending application
                    const latest = pending[pending.length - 1];
                    const appId = latest.id;
                    latestApplicationId = appId;

                    log("🔵 Approving application ID: " + appId, { amount: latest.amount });

                    // Approve it
                    const approveRes = await fetch(API + "/api/applications/" + appId + "/approve", {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + adminToken
                        },
                        body: JSON.stringify({
                            loanDate: new Date().toISOString().split("T")[0],
                            dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
                            interestRate: 20
                        })
                    });
                    const approveResult = await approveRes.json();
                    
                    if (approveResult.success) {
                        document.getElementById("adminResult").innerHTML += 
                            '<div class="alert alert-success mt-2">✅ Loan APPROVED! Amount: KSh ' + 
                            latest.amount + ' | Loan ID: ' + (approveResult.loanId || 'N/A') + '</div>';
                        log("✅ Loan APPROVED successfully!", approveResult);
                    } else {
                        document.getElementById("adminResult").innerHTML += 
                            '<div class="alert alert-warning mt-2">⚠️ ' + approveResult.message + '</div>';
                        log("⚠️ Approval failed: " + approveResult.message);
                    }
                }
            } catch (e) {
                document.getElementById("adminResult").innerHTML += 
                    '<div class="alert alert-danger mt-2">❌ Error: ' + e.message + '</div>';
                log("❌ Approval ERROR: " + e.message);
            }
        }

        // ==================== STEP 5: VIEW LOANS ====================
        async function viewMyLoans() {
            if (!clientToken) {
                alert("Please login as client first (Step 2)!");
                return;
            }

            log("🔵 Fetching my loans...");

            try {
                const res = await fetch(API + "/api/loans/my-loans", {
                    headers: { "Authorization": "Bearer " + clientToken }
                });
                const result = await res.json();
                
                if (result.success && result.loans) {
                    document.getElementById("loansResult").innerHTML = 
                        '<div class="alert alert-success">✅ Found ' + result.loans.length + ' loan(s)</div>';
                    
                    result.loans.forEach((loan, i) => {
                        document.getElementById("loansResult").innerHTML += `
                            <div class="card mb-2">
                                <div class="card-body p-2">
                                    <strong>Loan #${loan.id}</strong> | 
                                    Amount: KSh ${Number(loan.original_principal).toLocaleString()} | 
                                    Balance: KSh ${Number(loan.remaining_principal).toLocaleString()} | 
                                    Status: <span class="badge bg-${loan.status === 'ACTIVE' ? 'success' : 'info'}">${loan.status}</span>
                                </div>
                            </div>`;
                    });
                    
                    log("✅ Loans fetched: " + result.loans.length);
                } else {
                    document.getElementById("loansResult").innerHTML = 
                        '<div class="alert alert-warning">No loans found.</div>';
                }
            } catch (e) {
                document.getElementById("loansResult").innerHTML = 
                    '<div class="alert alert-danger">❌ Error: ' + e.message + '</div>';
                log("❌ Fetch loans ERROR: " + e.message);
            }
        }
    </script>
</body>
</html>
