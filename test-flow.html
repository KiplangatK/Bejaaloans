<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Apply | Bejja Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin-top: 30px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .btn-action { 
            padding: 15px 30px; font-size: 18px; font-weight: 600;
            border-radius: 50px; border: none; color: white; transition: all 0.3s; width: 100%;
        }
        .btn-register { background: linear-gradient(135deg, #0d47a1, #1976d2); }
        .btn-apply { background: linear-gradient(135deg, #e67e00, #f39c12); }
        .btn-action:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .result { 
            padding: 12px 15px; border-radius: 10px; margin-top: 10px;
            font-weight: 500; font-size: 14px;
        }
        .result.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .result.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .result.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .spinner { width: 20px; height: 20px; border: 3px solid #ccc; border-top-color: #0d47a1; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        pre { background: #1a1a2e; color: #e0e0e0; padding: 15px; border-radius: 10px; font-size: 12px; margin: 0; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="card p-4 mb-3">
            <h3 class="text-primary mb-3"><i class="fa fa-user-plus"></i> Register Client & Apply Loan</h3>
            <p class="text-muted">Step 1: Register → Step 2: Apply Loan → Then you approve manually in admin</p>
            
            <button class="btn-action btn-register mt-2" onclick="registerAndApply()" id="mainBtn">
                <i class="fa fa-play"></i> Register Client & Apply for Loan
            </button>
            
            <div id="result" class="mt-3"></div>
        </div>

        <div class="card p-4">
            <h6 class="fw-bold"><i class="fa fa-terminal"></i> Log</h6>
            <pre id="log">Click the button to start...</pre>
        </div>
    </div>

    <script>
        const API = "http://localhost:5000";
        let clientToken = "";
        
        // Generate random phone to avoid duplicates
        const randomPhone = "07" + Math.floor(10000000 + Math.random() * 90000000);
        const testPassword = "Test@123";
        const loanAmount = Math.floor(Math.random() * 5 + 1) * 5000; // Random 5000-25000

        function log(msg) {
            const logEl = document.getElementById("log");
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `\n[${time}] ${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function showResult(type, message) {
            document.getElementById("result").innerHTML = `<div class="result ${type}">${message}</div>`;
        }

        async function registerAndApply() {
            const btn = document.getElementById("mainBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner me-2"></span>Processing...';
            document.getElementById("result").innerHTML = "";
            document.getElementById("log").textContent = "🚀 STARTING...\n";
            log(`📱 Phone: ${randomPhone}`);
            log(`💰 Loan Amount: KSh ${loanAmount.toLocaleString()}`);
            log("─".repeat(40));

            try {
                // STEP 1: Register Client
                log("🔵 Step 1: Registering client...");
                
                const regRes = await fetch(API + "/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fullname: "Test Client " + randomPhone.slice(-4),
                        nationalID: String(Math.floor(10000000 + Math.random() * 90000000)),
                        phone: randomPhone,
                        email: randomPhone + "@test.com",
                        password: testPassword,
                        occupation: "Business Owner",
                        employer: "Self Employed",
                        monthlyIncome: "50000",
                        county: "Nairobi",
                        address: "Test Address, Nairobi"
                    })
                });
                
                const regData = await regRes.json();
                
                if (regData.success) {
                    log("✅ Registration SUCCESS!");
                } else {
                    log("⚠️ " + regData.message);
                    if (!regData.message.includes("already registered")) {
                        throw new Error(regData.message);
                    }
                    log("ℹ️ Client already exists, continuing...");
                }

                // STEP 2: Login as Client
                log("🔵 Step 2: Logging in as client...");
                
                const loginRes = await fetch(API + "/api/auth/client-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: randomPhone, password: testPassword })
                });
                
                const loginData = await loginRes.json();
                
                if (!loginData.success) {
                    throw new Error("Login failed: " + loginData.message);
                }
                
                clientToken = loginData.token;
                log("✅ Client login SUCCESS!");

                // STEP 3: Apply for Loan
                log(`🔵 Step 3: Applying for KSh ${loanAmount.toLocaleString()}...`);
                
                const applyRes = await fetch(API + "/api/applications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + clientToken
                    },
                    body: JSON.stringify({
                        amount: loanAmount,
                        purpose: "Business Expansion",
                        guarantor1: { 
                            name: "Jane Guarantor", 
                            id: "11111111", 
                            phone: "0711111111", 
                            relationship: "Sister", 
                            address: "456 Nairobi" 
                        },
                        guarantor2: { 
                            name: "Bob Guarantor", 
                            id: "22222222", 
                            phone: "0722222222", 
                            relationship: "Friend", 
                            address: "789 Nairobi" 
                        }
                    })
                });
                
                const applyData = await applyRes.json();
                
                if (!applyData.success) {
                    throw new Error("Application failed: " + applyData.message);
                }
                
                const appId = applyData.applicationId;
                log("✅ Loan application SUBMITTED!");
                log("─".repeat(40));
                log("🎉 ALL DONE!");
                log("");
                log("📋 SUMMARY:");
                log(`   📱 Phone: ${randomPhone}`);
                log(`   🔑 Password: ${testPassword}`);
                log(`   💰 Loan Amount: KSh ${loanAmount.toLocaleString()}`);
                log(`   📝 Application ID: ${appId}`);
                log("");
                log("👨‍💼 NEXT STEP (You do this manually):");
                log("   1. Go to admin-portal.html");
                log("   2. Login as: Kiplangat / Admin@123");
                log("   3. Go to Loan Applications");
                log("   4. Find the pending application and APPROVE it");

                showResult("success", 
                    `✅ SUCCESS!<br><br>
                    <b>Phone:</b> ${randomPhone}<br>
                    <b>Password:</b> ${testPassword}<br>
                    <b>Loan:</b> KSh ${loanAmount.toLocaleString()}<br>
                    <b>App ID:</b> ${appId}<br><br>
                    <small>Now login to <a href="admin-portal.html" target="_blank">Admin Panel</a> to approve the loan.</small>`
                );

            } catch (error) {
                log("❌ ERROR: " + error.message);
                showResult("error", "❌ " + error.message);
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-redo"></i> Register Another Client & Apply';
        }
    </script>
</body>
</html>
