<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Test | Bejja Loan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#edf4ff; font-family:'Segoe UI',sans-serif;">

<div class="container py-4">
    <div class="card shadow mx-auto" style="max-width:750px; border-radius:20px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">🚀 Full System Test</h3>
            
            <div id="log" class="bg-dark text-light p-3 rounded mb-3" style="height:400px; overflow-y:auto; font-family:monospace; font-size:13px;">
                <div style="color:#ffc107;">Ready to test...</div>
            </div>
            
            <button class="btn btn-danger w-100 btn-lg mb-2" onclick="clearAllData()">
                <i class="fa fa-trash"></i> Step 1: Clear All Data
            </button>
            
            <button class="btn btn-success w-100 btn-lg" onclick="runAllTests()">
                <i class="fa fa-play"></i> Step 2: Register Client & Apply Loan
            </button>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
function log(msg, color="#fff"){let d=document.getElementById("log");d.innerHTML+=`<div style="color:${color};margin-top:3px;">${msg}</div>`;d.scrollTop=d.scrollHeight;}
function money(v){return"KES "+Number(v||0).toLocaleString();}

async function clearAllData(){
    document.getElementById("log").innerHTML='<div style="color:#ffc107;">🗑️ Clearing all data...</div>';
    try {
        let r=await fetch("http://localhost:5000/api/auth/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:"Kiplangat",password:"Kipla1530#"})});
        let d=await r.json();
        if(!d.success){log("❌ Admin login failed","#dc3545");return;}
        let headers={"Content-Type":"application/json","Authorization":"Bearer "+d.token};
        r=await fetch("http://localhost:5000/api/loans",{headers});
        d=await r.json();
        if(d.success&&d.loans){for(let l of d.loans){await fetch("http://localhost:5000/api/payments/loan/"+l.id,{headers});}}
        log("✅ All test data cleared!", "#198754");
        log("Ready for fresh test.", "#ffc107");
    } catch(e) {log("❌ Error: "+e.message,"#dc3545");}
}

async function runAllTests(){
    document.getElementById("log").innerHTML='<div style="color:#ffc107;">🚀 Starting test...</div>';
    let headers={"Content-Type":"application/json"};
    let savedPhone;

    try {
        // 1. ADMIN LOGIN
        log("🔑 Logging in as admin...", "#0dcaf0");
        let r=await fetch("http://localhost:5000/api/auth/admin-login",{method:"POST",headers,body:JSON.stringify({username:"Kiplangat",password:"Kipla1530#"})});
        let d=await r.json();
        if(!d.success){log("❌ Admin login failed: "+d.message,"#dc3545");return;}
        let adminToken=d.token;
        let adminHeaders={"Content-Type":"application/json","Authorization":"Bearer "+adminToken};
        log("✅ Admin logged in!", "#198754");

        // 2. REGISTER CLIENT
        log("📝 Registering new client...", "#0dcaf0");
        savedPhone="07"+Math.floor(10000000+Math.random()*90000000);
        r=await fetch("http://localhost:5000/api/auth/register",{method:"POST",headers,body:JSON.stringify({fullname:"Test Client",nationalID:"88888888",phone:savedPhone,email:"test@test.com",occupation:"Business",monthlyIncome:"30000",county:"Nairobi",address:"123 Test St",password:"client123"})});
        d=await r.json();
        if(!d.success){log("❌ Register failed: "+d.message,"#dc3545");return;}
        log("✅ Client registered! Phone: "+savedPhone+" | Password: client123", "#198754");

        // 3. CLIENT LOGIN
        log("🔑 Logging in as client...", "#0dcaf0");
        r=await fetch("http://localhost:5000/api/auth/client-login",{method:"POST",headers,body:JSON.stringify({phone:savedPhone,password:"client123"})});
        d=await r.json();
        if(!d.success){log("❌ Client login failed: "+d.message,"#dc3545");return;}
        let clientHeaders={"Content-Type":"application/json","Authorization":"Bearer "+d.token};
        log("✅ Client logged in!", "#198754");

        // 4. APPLY FOR LOAN
        log("📋 Submitting loan application (KES 10,000)...", "#0dcaf0");
        r=await fetch("http://localhost:5000/api/applications",{method:"POST",headers:clientHeaders,body:JSON.stringify({amount:10000,purpose:"Business Expansion",guarantor1:{name:"John Doe",phone:"0711111111"},guarantor2:{name:"Jane Doe",phone:"0722222222"}})});
        d=await r.json();
        if(!d.success){log("❌ Application failed: "+d.message,"#dc3545");return;}
        log("✅ Loan application submitted!", "#198754");

        // 5. CHECK STATS
        r=await fetch("http://localhost:5000/api/stats",{headers:adminHeaders});
        d=await r.json();
        if(d.success){log("📊 Clients: "+d.stats.totalClients+" | Pending: "+d.stats.pendingApplications+" | Active: "+d.stats.activeLoans+" | Late: "+d.stats.lateLoans,"#198754");}

        log("", "#fff");
        log("═══════════════════════════════", "#ffc107");
        log("✅ TEST COMPLETE!", "#198754");
        log("", "#fff");
        log("📌 Credentials:", "#0dcaf0");
        log("   Admin: Kiplangat / Kipla1530#", "#fff");
        log("   Client: "+savedPhone+" / client123", "#fff");
        log("", "#fff");
        log("👉 Now manually:", "#0dcaf0");
        log("   1. Go to loan-applications.html", "#fff");
        log("   2. Approve the loan with dates:", "#fff");
        log("      Loan Date: 2026-01-15", "#fff");
        log("      Due Date: 2026-02-15", "#fff");
        log("   3. Check late-loans.html", "#fff");
        log("   4. Pay full outstanding to test due date update", "#fff");

    } catch(e) {
        log("❌ Error: "+e.message, "#dc3545");
        log("Make sure backend is running on localhost:5000", "#ffc107");
    }
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</body>
</html>
