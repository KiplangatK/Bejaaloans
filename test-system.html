<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Test | Bejja Loan System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#edf4ff; font-family:'Segoe UI',sans-serif;">

<div class="container py-4">
    <div class="card shadow mx-auto" style="max-width:750px; border-radius:20px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">🚀 Full System Test</h3>
            
            <div id="log" class="bg-dark text-light p-3 rounded mb-3" style="height:400px; overflow-y:auto; font-family:monospace; font-size:13px;">
                <div style="color:#ffc107;">Ready to test...</div>
            </div>
            
            <button class="btn btn-success w-100 btn-lg" onclick="runAllTests()">
                <i class="fa fa-play"></i> Run Full Test (Register + Apply + Approve)
            </button>
        </div>
    </div>
</div>

<script>
const API_BASE = "http://localhost:5000/api";
let savedClientId, savedPhone, savedToken, savedAppId;

function log(msg, color="#fff"){let d=document.getElementById("log");d.innerHTML+=`<div style="color:${color};margin-top:3px;">${msg}</div>`;d.scrollTop=d.scrollHeight;}

async function runAllTests(){
    document.getElementById("log").innerHTML='<div style="color:#ffc107;">🚀 Starting full test...</div>';
    let headers={"Content-Type":"application/json"};

    try {
        // ========== 1. ADMIN LOGIN ==========
        log("🔑 Logging in as admin...", "#0dcaf0");
        let r = await fetch(API_BASE+"/auth/admin-login", {method:"POST",headers,body:JSON.stringify({username:"Kiplangat",password:"Kipla1530#"})});
        let d = await r.json();
        if(!d.success){log("❌ Admin login failed: "+d.message,"#dc3545");return;}
        savedToken = d.token;
        let adminHeaders = {...headers, "Authorization":"Bearer "+savedToken};
        log("✅ Admin logged in!", "#198754");

        // ========== 2. REGISTER CLIENT ==========
        log("📝 Registering new client...", "#0dcaf0");
        savedPhone = "07" + Math.floor(10000000 + Math.random() * 90000000);
        r = await fetch(API_BASE+"/auth/register", {method:"POST",headers,body:JSON.stringify({
            fullname:"Test Client",nationalID:"99999999",phone:savedPhone,email:"client@test.com",
            occupation:"Business",monthlyIncome:"50000",county:"Nairobi",address:"456 Test Ave",password:"client123"
        })});
        d = await r.json();
        if(!d.success){log("❌ Register failed: "+d.message,"#dc3545");return;}
        log("✅ Client registered! Phone: "+savedPhone+" | Password: client123", "#198754");

        // ========== 3. CLIENT LOGIN ==========
        log("🔑 Logging in as client...", "#0dcaf0");
        r = await fetch(API_BASE+"/auth/client-login", {method:"POST",headers,body:JSON.stringify({phone:savedPhone,password:"client123"})});
        d = await r.json();
        if(!d.success){log("❌ Client login failed: "+d.message,"#dc3545");return;}
        savedClientId = d.client.id;
        let clientHeaders = {...headers, "Authorization":"Bearer "+d.token};
        log("✅ Client logged in! ID: "+savedClientId, "#198754");

        // ========== 4. APPLY FOR LOAN ==========
        log("📋 Submitting loan application (KES 20,000)...", "#0dcaf0");
        r = await fetch(API_BASE+"/applications", {method:"POST",headers:clientHeaders,body:JSON.stringify({
            amount:20000,purpose:"Business Expansion",
            guarantor1:{name:"John Doe",phone:"0711111111"},
            guarantor2:{name:"Jane Doe",phone:"0722222222"}
        })});
        d = await r.json();
        if(!d.success){log("❌ Application failed: "+d.message,"#dc3545");return;}
        log("✅ Loan application submitted!", "#198754");

        // ========== 5. GET APPLICATIONS ==========
        log("📋 Fetching applications...", "#0dcaf0");
        r = await fetch(API_BASE+"/applications", {headers:adminHeaders});
        d = await r.json();
        if(!d.success){log("❌ Failed: "+d.message,"#dc3545");return;}
        let pending = d.applications.filter(a=>a.status==="PENDING");
        if(pending.length===0){log("❌ No pending applications found","#dc3545");return;}
        savedAppId = pending[pending.length-1].id;
        log("✅ Found pending application ID: "+savedAppId, "#198754");

        // ========== 6. APPROVE LOAN ==========
        log("✅ Approving loan...", "#0dcaf0");
        let today = new Date().toISOString().split("T")[0];
        let nextMonth = new Date();nextMonth.setMonth(nextMonth.getMonth()+1);
        let dueDate = nextMonth.toISOString().split("T")[0];
        r = await fetch(API_BASE+"/applications/"+savedAppId+"/approve", {method:"PUT",headers:adminHeaders,body:JSON.stringify({loanDate:today,dueDate:dueDate})});
        d = await r.json();
        if(!d.success){log("❌ Approve failed: "+d.message,"#dc3545");return;}
        log("✅ Loan approved! Due date: "+dueDate, "#198754");

        // ========== 7. GET LOANS ==========
        log("📊 Fetching loans...", "#0dcaf0");
        r = await fetch(API_BASE+"/loans", {headers:adminHeaders});
        d = await r.json();
        log("✅ Total loans in system: "+(d.loans?d.loans.length:0), "#198754");

        // ========== 8. GET STATS ==========
        r = await fetch(API_BASE+"/stats", {headers:adminHeaders});
        d = await r.json();
        if(d.success){
            log("📊 Stats: Clients="+d.stats.totalClients+" | Active="+d.stats.activeLoans+" | Late="+d.stats.lateLoans+" | Pending="+d.stats.pendingApplications, "#198754");
        }

        // ========== SUMMARY ==========
        log("", "#fff");
        log("═══════════════════════════════", "#ffc107");
        log("✅ ALL TESTS PASSED!", "#198754");
        log("", "#fff");
        log("📌 Test Credentials:", "#0dcaf0");
        log("   Admin: Kiplangat / Kipla1530#", "#fff");
        log("   Client Phone: "+savedPhone+" / Password: client123", "#fff");
        log("", "#fff");
        log("👉 Now check:", "#0dcaf0");
        log("   • admin-dashboard.html → should show 1 active loan", "#fff");
        log("   • active-loans.html → should show the loan", "#fff");
        log("   • client-portal.html → login with client credentials", "#fff");

    } catch(e) {
        log("❌ Error: "+e.message, "#dc3545");
        log("Make sure backend is running on "+API_BASE, "#ffc107");
    }
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</body>
</html>
