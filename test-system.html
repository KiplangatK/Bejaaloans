<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Test | Bejja Loan System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#edf4ff; font-family:'Segoe UI',sans-serif;">

<div class="container py-4">
    <div class="card shadow mx-auto" style="max-width:750px; border-radius:20px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">🚀 System Test</h3>
            
            <div class="mb-3">
                <label class="fw-bold">API Server:</label>
                <input type="text" id="apiUrl" class="form-control" value="http://localhost:5000/api" placeholder="http://localhost:5000/api">
            </div>
            
            <div class="mb-3">
                <label class="fw-bold">Admin Username:</label>
                <input type="text" id="adminUser" class="form-control" value="Kiplangat">
            </div>
            
            <div class="mb-3">
                <label class="fw-bold">Admin Password:</label>
                <input type="password" id="adminPass" class="form-control" value="Kipla1530#">
            </div>
            
            <div id="log" class="bg-dark text-light p-3 rounded mb-3" style="height:350px; overflow-y:auto; font-family:monospace; font-size:13px;">
                <div style="color:#ffc107;">Ready to test...</div>
            </div>
            
            <button class="btn btn-success w-100 btn-lg" onclick="runAllTests()">
                <i class="fa fa-play"></i> Run Full Test
            </button>
            
            <div class="row mt-2">
                <div class="col-6"><button class="btn btn-outline-primary w-100" onclick="testConnection()">Test Connection</button></div>
                <div class="col-6"><button class="btn btn-outline-warning w-100" onclick="testAdminLogin()">Test Admin Login</button></div>
            </div>
        </div>
    </div>
</div>

<script>
const API = () => document.getElementById("apiUrl").value;
function log(msg, color="#fff"){let d=document.getElementById("log");d.innerHTML+=`<div style="color:${color};margin-top:3px;">${msg}</div>`;d.scrollTop=d.scrollHeight;}

async function testConnection(){
    log("🔌 Testing connection...","#0dcaf0");
    try{
        let r=await fetch(API().replace("/api",""));
        let d=await r.json();
        log("✅ Server: "+d.message+" v"+d.version,"#198754");
    }catch(e){log("❌ Cannot reach server. Is backend running?","#dc3545");}
}

async function testAdminLogin(){
    log("🔑 Testing admin login...","#0dcaf0");
    try{
        let r=await fetch(API()+"/auth/admin-login",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username:document.getElementById("adminUser").value,password:document.getElementById("adminPass").value})
        });
        let d=await r.json();
        if(d.success){log("✅ Admin login OK! Token: "+d.token.substring(0,20)+"...","#198754");localStorage.setItem("test_token",d.token);}
        else{log("❌ Login failed: "+d.message,"#dc3545");}
    }catch(e){log("❌ Error: "+e.message,"#dc3545");}
}

async function runAllTests(){
    document.getElementById("log").innerHTML='<div style="color:#ffc107;">🚀 Running all tests...</div>';
    
    // 1. Connection
    await testConnection();
    
    // 2. Admin login
    await testAdminLogin();
    
    let token=localStorage.getItem("test_token");
    if(!token){log("❌ Cannot continue without login","#dc3545");return;}
    
    let headers={"Content-Type":"application/json","Authorization":"Bearer "+token};
    
    // 3. Get stats
    try{
        let r=await fetch(API()+"/stats",{headers});
        let d=await r.json();
        if(d.success){log("📊 Stats: Clients="+d.stats.totalClients+" Loans="+d.stats.activeLoans+" Late="+d.stats.lateLoans+" Pending="+d.stats.pendingApplications,"#198754");}
    }catch(e){log("❌ Stats failed","#dc3545");}
    
    // 4. Get clients
    try{
        let r=await fetch(API()+"/clients",{headers});
        let d=await r.json();
        log("👥 Total registered clients: "+(d.clients?d.clients.length:0),"#198754");
    }catch(e){log("❌ Clients failed","#dc3545");}
    
    // 5. Register test client
    log("📝 Registering test client...","#0dcaf0");
    let phone="07"+Math.floor(10000000+Math.random()*90000000);
    try{
        let r=await fetch(API()+"/auth/register",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({fullname:"Test User",nationalID:"88888888",phone:phone,email:"test@test.com",occupation:"Tester",monthlyIncome:"20000",county:"Nairobi",address:"123 Test St",password:"test123"})
        });
        let d=await r.json();
        if(d.success){log("✅ Client registered! Phone: "+phone,"#198754");}
        else{log("⚠️ "+d.message,"#ffc107");}
    }catch(e){log("❌ Register failed","#dc3545");}
    
    log("","#fff");
    log("✅ ALL TESTS COMPLETE!","#198754");
    log("📌 If all green, your system is working!","#fff");
}

</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
</body>
</html>
