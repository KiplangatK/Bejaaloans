<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Test | Bejja Loan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#edf4ff; font-family:'Segoe UI',sans-serif;">

<div class="container py-4">
    <div class="card shadow mx-auto" style="max-width:750px; border-radius:20px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">🚀 Full System Test</h3>
            
            <div id="log" class="bg-dark text-light p-3 rounded mb-3" style="height:400px; overflow-y:auto; font-family:monospace; font-size:13px;">
                <div style="color:#ffc107;">Ready to test...</div>
            </div>
            
            <button class="btn btn-danger w-100 btn-lg mb-2" onclick="clearAllData()">
                <i class="fa fa-trash"></i> Step 1: Clear All Data
            </button>
            
            <button class="btn btn-success w-100 btn-lg" onclick="runAllTests()">
                <i class="fa fa-play"></i> Step 2: Full Test (Register + Apply)
            </button>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
function log(msg, color="#fff"){let d=document.getElementById("log");d.innerHTML+=`<div style="color:${color};margin-top:3px;">${msg}</div>`;d.scrollTop=d.scrollHeight;}
function money(v){return"KES "+Number(v||0).toLocaleString();}

// Generate a simple placeholder image as base64
function placeholderImg(color){
    let canvas=document.createElement("canvas");canvas.width=200;canvas.height=200;
    let ctx=canvas.getContext("2d");ctx.fillStyle=color;ctx.fillRect(0,0,200,200);
    ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="center";ctx.fillText("Photo",100,100);
    return canvas.toDataURL("image/jpeg",0.5);
}

async function clearAllData(){
    document.getElementById("log").innerHTML='<div style="color:#ffc107;">🗑️ Clearing all data...</div>';
    try {
        let r=await fetch("http://localhost:5000/api/auth/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:"Kiplangat",password:"Kipla1530#"})});
        let d=await r.json();
        if(!d.success){log("❌ Admin login failed","#dc3545");return;}
        let headers={"Content-Type":"application/json","Authorization":"Bearer "+d.token};
        // Delete all via API
        await fetch("http://localhost:5000/api/clients",{headers}).then(r=>r.json()).then(async d=>{if(d.clients)for(let c of d.clients)await fetch("http://localhost:5000/api/clients/"+c.id,{method:"DELETE",headers});});
        log("✅ All data cleared!","#198754");
    } catch(e) {log("❌ Error: "+e.message,"#dc3545");}
}

async function runAllTests(){
    document.getElementById("log").innerHTML='<div style="color:#ffc107;">🚀 Starting full test...</div>';
    let headers={"Content-Type":"application/json"};
    let savedPhone, clientToken;

    // Generate dummy images
    let profilePic=placeholderImg("#4caf50");
    let idFront=placeholderImg("#2196f3");
    let idBack=placeholderImg("#ff9800");
    let g1photo=placeholderImg("#9c27b0");
    let g1idfront=placeholderImg("#00bcd4");
    let g1idback=placeholderImg("#795548");
    let g2photo=placeholderImg("#e91e63");
    let g2idfront=placeholderImg("#607d8b");
    let g2idback=placeholderImg("#3f51b5");

    try {
        // ========== 1. REGISTER CLIENT WITH FULL DETAILS ==========
        log("📝 Registering client with photos...", "#0dcaf0");
        savedPhone="07"+Math.floor(10000000+Math.random()*90000000);
        let r=await fetch("http://localhost:5000/api/auth/register",{method:"POST",headers,body:JSON.stringify({
            fullname:"John Doe Test",nationalID:"12345678",phone:savedPhone,email:"john@test.com",
            occupation:"Business Owner",employer:"Self Employed",monthlyIncome:"50000",
            county:"Nairobi",address:"456 Kimathi Street, Nairobi",
            profilePhoto:profilePic,idFront:idFront,idBack:idBack,
            password:"client123"
        })});
        let d=await r.json();
        if(!d.success){log("❌ Register failed: "+d.message,"#dc3545");return;}
        log("✅ Client registered with full details!", "#198754");
        log("   Name: John Doe Test", "#aaa");
        log("   Phone: "+savedPhone, "#aaa");
        log("   Password: client123", "#aaa");

        // ========== 2. CLIENT LOGIN ==========
        log("🔑 Logging in as client...", "#0dcaf0");
        r=await fetch("http://localhost:5000/api/auth/client-login",{method:"POST",headers,body:JSON.stringify({phone:savedPhone,password:"client123"})});
        d=await r.json();
        if(!d.success){log("❌ Login failed: "+d.message,"#dc3545");return;}
        clientToken=d.token;
        let clientHeaders={"Content-Type":"application/json","Authorization":"Bearer "+clientToken};
        log("✅ Client logged in!", "#198754");

        // ========== 3. APPLY FOR LOAN WITH GUARANTOR PHOTOS ==========
        log("📋 Submitting loan with guarantor details...", "#0dcaf0");
        r=await fetch("http://localhost:5000/api/applications",{method:"POST",headers:clientHeaders,body:JSON.stringify({
            amount:10000,purpose:"Business Expansion",
            guarantor1:{name:"Mary Wanjiku",id:"22222222",phone:"0711222333",relationship:"Sister",address:"123 Moi Ave, Nairobi",photo:g1photo,idFront:g1idfront,idBack:g1idback},
            guarantor2:{name:"Peter Kamau",id:"33333333",phone:"0722333444",relationship:"Friend",address:"789 Kenyatta Rd, Nairobi",photo:g2photo,idFront:g2idfront,idBack:g2idback}
        })});
        d=await r.json();
        if(!d.success){log("❌ Application failed: "+d.message,"#dc3545");return;}
        log("✅ Loan application submitted!", "#198754");
        log("   Amount: KES 10,000", "#aaa");
        log("   Guarantor 1: Mary Wanjiku", "#aaa");
        log("   Guarantor 2: Peter Kamau", "#aaa");

        // ========== 4. CHECK STATS ==========
        log("📊 Checking stats...", "#0dcaf0");
        r=await fetch("http://localhost:5000/api/auth/admin-login",{method:"POST",headers,body:JSON.stringify({username:"Kiplangat",password:"Kipla1530#"})});
        d=await r.json();
        let adminHeaders={"Content-Type":"application/json","Authorization":"Bearer "+d.token};
        r=await fetch("http://localhost:5000/api/stats",{headers:adminHeaders});
        d=await r.json();
        if(d.success){log("📊 Clients: "+d.stats.totalClients+" | Pending: "+d.stats.pendingApplications,"#198754");}

        log("", "#fff");
        log("═══════════════════════════════", "#ffc107");
        log("✅ TEST COMPLETE!", "#198754");
        log("", "#fff");
        log("📌 Credentials:", "#0dcaf0");
        log("   Admin: Kiplangat / Kipla1530#", "#fff");
        log("   Client: "+savedPhone+" / client123", "#fff");
        log("", "#fff");
        log("👉 Now test manually:", "#0dcaf0");
        log("   1. registered-clients.html → John Doe with photo", "#fff");
        log("   2. loan-applications.html → View application", "#fff");
        log("   3. Click 'View Guarantors' → see photos & IDs", "#fff");
        log("   4. Approve with Loan: 2026-01-15, Due: 2026-02-15", "#fff");
        log("   5. Check late-loans.html", "#fff");

    } catch(e) {
        log("❌ Error: "+e.message, "#dc3545");
        log("Make sure backend is running on localhost:5000", "#ffc107");
    }
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</body>
</html>
