<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejja Credit | Active Loans</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:#0d47a1;color:white;}
.logo{padding:25px;font-size:26px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.2);}
.logo i{margin-right:10px;}
.sidebar a{display:block;padding:15px 25px;color:white;text-decoration:none;transition:.3s;}
.sidebar a:hover{background:#1565c0;padding-left:35px;}.sidebar i{width:25px;}
.main{margin-left:260px;}
.topbar{height:70px;background:#1976d2;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 30px;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.topbar h2{font-weight:700;}
.topbar .topbar-right{display:flex;align-items:center;gap:15px;}
.topbar .btn-back{background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;transition:.3s;}
.topbar .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.content{padding:30px;}
.table-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.12);}
.table-header{background:#1976d2;color:white;padding:18px 25px;font-size:22px;font-weight:bold;}
.table th{background:#e3f2fd;color:#0d47a1;}.table td,.table th{padding:15px;vertical-align:middle;}
.profile-img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid #1976d2;}
.btn-view{background:#1976d2;color:white;border-radius:20px;}
.btn-payment{background:#198754;color:white;border-radius:20px;}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<a href="admin-dashboard.html"><i class="fa fa-dashboard"></i>Dashboard</a>
<a href="registered-clients.html"><i class="fa fa-users"></i>Registered Clients</a>
<a href="active-loans.html"><i class="fa fa-money-bill-wave"></i>Active Loans</a>
<a href="late-loans.html"><i class="fa fa-triangle-exclamation"></i>Late Loans</a>
<a href="loan-applications.html"><i class="fa fa-file-circle-check"></i>Loan Applications</a>
<a href="statistics.html"><i class="fa fa-chart-column"></i>Statistics</a>
<a href="#" onclick="logout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
</div>

<div class="main">
<div class="topbar"><h2><i class="fa fa-money-bill-wave"></i>Active Loans</h2><div class="topbar-right"><a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a><span>Welcome, <strong id="adminName">Admin</strong></span></div></div>
<div class="content"><div class="table-card"><div class="table-header"><i class="fa fa-list"></i>Active Loan List</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Client</th><th>Phone</th><th>Amount</th><th>Balance</th><th>Due Date</th><th>Action</th></tr></thead><tbody id="activeLoansTable"><tr><td colspan="6" class="text-center text-muted p-4">Loading...</td></tr></tbody></table></div></div></div>
</div>

<div class="modal fade" id="paymentModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">Record Payment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="paymentLoanId"><label class="form-label">Amount</label><input type="number" id="paymentAmount" class="form-control mb-3"><label class="form-label">Date</label><input type="date" id="paymentDate" class="form-control mb-3"><label class="form-label">Method</label><select id="paymentMethod" class="form-select"><option>Cash</option><option>M-Pesa</option><option>Bank</option></select></div><div class="modal-footer"><button class="btn btn-success" onclick="savePayment()">Save</button></div></div></div></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if(!AUTH.currentAdmin()){window.location.href="admin-login.html";}
let admin=AUTH.currentAdmin();if(admin)document.getElementById("adminName").innerHTML=admin.username;
function money(v){return"KES "+Number(v||0).toLocaleString();}

async function loadActiveLoans(){
    let result=await api.getLoans();
    let table=document.getElementById("activeLoansTable");table.innerHTML="";
    if(!result.success||!result.loans){table.innerHTML='<tr><td colspan="6" class="text-center text-muted p-4">No active loans.</td></tr>';return;}
    let today=new Date();today.setHours(0,0,0,0);
    let active=result.loans.filter(l=>{if(l.status!=="ACTIVE")return false;if(Number(l.remaining_principal||0)<=0)return false;if(!l.due_date)return true;let d=new Date(l.due_date);d.setHours(0,0,0,0);return d>=today;});
    if(active.length===0){table.innerHTML='<tr><td colspan="6" class="text-center text-muted p-4">No active loans.</td></tr>';return;}
    for(let l of active.reverse()){
        table.innerHTML+=`<tr><td><b>${l.fullname||"Unknown"}</b></td><td>${l.phone||"-"}</td><td>${money(l.original_principal)}</td><td class="text-danger fw-bold">${money(l.remaining_principal)}</td><td><span class="badge bg-success">${l.due_date||"-"}</span></td><td><button class="btn btn-view btn-sm" onclick="window.location.href='active-loans.html'"><i class="fa fa-eye"></i></button><button class="btn btn-payment btn-sm" onclick="openPayment(${l.id})"><i class="fa fa-money-bill"></i></button></td></tr>`;
    }
}

function openPayment(id){document.getElementById("paymentLoanId").value=id;document.getElementById("paymentAmount").value="";document.getElementById("paymentDate").value=new Date().toISOString().split("T")[0];new bootstrap.Modal(document.getElementById("paymentModal")).show();}

async function savePayment(){
    let loanId=document.getElementById("paymentLoanId").value;
    let amount=Number(document.getElementById("paymentAmount").value);
    let date=document.getElementById("paymentDate").value;
    let method=document.getElementById("paymentMethod").value;
    if(amount<=0){alert("Enter amount");return;}
    await api.addPayment({loanId,amount,paymentDate:date,method});
    alert("Payment recorded!");
    bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();
    loadActiveLoans();
}

function logout(){AUTH.adminLogout();}
loadActiveLoans();
</script>
</body>
</html>
