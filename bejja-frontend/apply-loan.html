<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Loan | Bejja Credit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
body{background:#edf4ff;font-family:'Segoe UI',sans-serif;}
.header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:white;padding:25px;border-radius:0 0 25px 25px;position:relative;}
.header .btn-back{position:absolute;top:20px;right:25px;background:rgba(255,255,255,0.2);color:white;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:600;font-size:15px;transition:.3s;}
.header .btn-back:hover{background:rgba(255,255,255,0.35);color:white;}
.container{max-width:1100px;}
.card{border:none;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.12);}
.section-title{background:#0d47a1;color:white;padding:12px 18px;border-radius:12px;margin-top:20px;}
.form-control{height:50px;border-radius:12px;}
.interest-box{background:#198754;color:white;padding:20px;border-radius:15px;}
.btn-submit{height:55px;font-size:18px;font-weight:bold;border-radius:15px;}
.alert{display:none;}
</style>
</head>
<body>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>if(!AUTH.currentClient()){window.location.href="client-portal.html";}</script>

<div class="header text-center">
<a href="client-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a>
<h2><i class="fa-solid fa-building-columns"></i>BEJJA CREDIT</h2>
<p>Loan Application Form</p>
</div>

<div class="container py-4"><div class="card p-4">
<div id="errorBox" class="alert alert-danger"></div>

<h4 class="section-title"><i class="fa fa-user"></i>Client Information</h4>
<div class="row">
<div class="col-md-6 mb-3"><label>Full Name</label><input id="fullname" class="form-control" readonly></div>
<div class="col-md-6 mb-3"><label>National ID</label><input id="nationalID" class="form-control" readonly></div>
<div class="col-md-6 mb-3"><label>Phone Number</label><input id="phone" class="form-control" readonly></div>
</div>

<h4 class="section-title"><i class="fa fa-money-bill"></i>Loan Details</h4>
<div class="row">
<div class="col-md-6 mb-3"><label>Loan Amount (KES)</label><input type="number" id="loanAmount" class="form-control" placeholder="Enter amount" oninput="calculateInterest()"></div>
<div class="col-md-6 mb-3"><label>Loan Purpose</label><input id="purpose" class="form-control" placeholder="Business / Emergency"></div>
</div>
<div class="interest-box"><h5>Monthly Interest (20%)</h5><h2 id="monthlyInterest">KES 0</h2></div>

<h4 class="section-title mt-4"><i class="fa fa-users"></i>Guarantor Information</h4>
<div class="row">
<div class="col-md-6 mb-3"><label>Guarantor 1 Full Name</label><input id="g1_name" class="form-control"></div>
<div class="col-md-6 mb-3"><label>Guarantor 1 Phone</label><input id="g1_phone" class="form-control"></div>
<div class="col-md-6 mb-3"><label>Guarantor 2 Full Name</label><input id="g2_name" class="form-control"></div>
<div class="col-md-6 mb-3"><label>Guarantor 2 Phone</label><input id="g2_phone" class="form-control"></div>
</div>

<div class="text-center mt-4"><button id="submitBtn" onclick="submitLoanApplication()" class="btn btn-primary btn-submit w-100"><i class="fa fa-paper-plane"></i>Submit Loan Application</button></div>
</div></div>

<script>
document.addEventListener("DOMContentLoaded",()=>{let c=AUTH.currentClient();if(!c)return;document.getElementById("fullname").value=c.fullname||"";document.getElementById("nationalID").value=c.nationalID||"";document.getElementById("phone").value=c.phone||"";});
function calculateInterest(){let a=Number(document.getElementById("loanAmount").value)||0;document.getElementById("monthlyInterest").innerHTML="KES "+(a*0.20).toLocaleString();}
function money(v){return"KES "+Number(v||0).toLocaleString();}

async function submitLoanApplication(){
let errorBox=document.getElementById("errorBox"),btn=document.getElementById("submitBtn");
errorBox.style.display="none";
let client=AUTH.currentClient();if(!client)return;
let amount=Number(document.getElementById("loanAmount").value),purpose=document.getElementById("purpose").value.trim();
if(amount<=0){errorBox.innerHTML="Enter a valid loan amount";errorBox.style.display="block";return;}
if(!purpose){errorBox.innerHTML="Enter loan purpose";errorBox.style.display="block";return;}
btn.disabled=true;btn.innerHTML="Submitting...";

let result=await api.addApplication({
amount:amount,purpose:purpose,
guarantor1:{name:document.getElementById("g1_name").value,phone:document.getElementById("g1_phone").value},
guarantor2:{name:document.getElementById("g2_name").value,phone:document.getElementById("g2_phone").value}
});

if(result.success){
document.body.innerHTML=`<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;"><div style="background:white;border-radius:25px;padding:50px 40px;text-align:center;max-width:500px;"><i class="fa-solid fa-circle-check" style="font-size:80px;color:#198754;margin-bottom:20px;"></i><h2 style="color:#0F4C81;">Application Submitted!</h2><p style="color:#666;margin-bottom:25px;">Your loan application is under review.</p><a href="client-dashboard.html" style="background:#2563EB;color:white;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;display:block;">Go to Dashboard</a></div></div>`;
}else{errorBox.innerHTML=result.message;errorBox.style.display="block";btn.disabled=false;btn.innerHTML="Submit Loan Application";}
}
</script>
</body>
</html>
