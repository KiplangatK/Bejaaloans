<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejja Credit | Late Loans</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#edf4ff;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;}
.wrapper{display:flex;}
.sidebar{width:260px;min-height:100vh;background:#0d47a1;color:white;position:fixed;}
.logo{padding:25px;font-size:28px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,.15);}
.logo i{margin-right:10px;}
.sidebar ul{list-style:none;padding:15px 0;}
.sidebar ul li a{display:block;color:white;padding:15px 25px;text-decoration:none;transition:.3s;}
.sidebar ul li a:hover{background:#1565c0;padding-left:35px;}.sidebar ul li i{width:25px;}
.main{margin-left:260px;width:calc(100% - 260px);}
.topbar{height:60px;background:#1976d2;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 25px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.topbar h2{font-size:24px;}.topbar a{color:white;text-decoration:none;}
.content{padding:20px;}
.table-card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);}
.table-header{background:#1976d2;color:white;padding:14px 20px;font-size:18px;font-weight:bold;}
.table-responsive{overflow-x:auto;}
.table{margin-bottom:0;}
.table thead th{background:#e3f2fd;color:#0d47a1;text-align:center;font-size:13px;padding:10px 8px;white-space:nowrap;}
.table tbody td{text-align:center;vertical-align:middle;font-size:13px;padding:10px 8px;}
.btn-view{background:#1976d2;color:white;border-radius:20px;font-size:12px;padding:5px 10px;}
.btn-payment{background:#198754;color:white;border-radius:20px;font-size:12px;padding:5px 10px;}
</style>
</head>
<body>
<div class="wrapper">

<div class="sidebar">
<div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
<ul>
<li><a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i>Dashboard</a></li>
<li><a href="registered-clients.html"><i class="fa-solid fa-users"></i>Registered Clients</a></li>
<li><a href="active-loans.html"><i class="fa-solid fa-money-bill-wave"></i>Active Loans</a></li>
<li><a href="late-loans.html"><i class="fa-solid fa-triangle-exclamation"></i>Late Loans</a></li>
<li><a href="loan-applications.html"><i class="fa-solid fa-file-circle-check"></i>Applications</a></li>
<li><a href="statistics.html"><i class="fa-solid fa-chart-column"></i>Statistics</a></li>
<li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></li>
</ul>
</div>

<div class="main">
<div class="topbar"><h2><i class="fa-solid fa-triangle-exclamation text-warning"></i>Late Loans</h2><div><a href="admin-dashboard.html" class="btn btn-sm btn-light me-2">Back</a>Welcome, <strong id="adminName">Admin</strong></div></div>
<div class="content">

<div class="table-card"><div class="table-header">Late Loan Clients</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>#</th><th>Client</th><th>Phone</th><th>Amount</th><th>Balance</th><th>Int/mo</th><th>Overdue</th><th>Due Date</th><th>Days</th><th>Act</th></tr></thead><tbody id="lateLoansTable"><tr><td colspan="10" class="text-center text-muted p-5">Loading...</td></tr></tbody></table></div></div>
</div></div></div>

<div class="modal fade" id="loanModal"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title"><i class="fa fa-file-invoice-dollar"></i>Loan Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="loanDetails"></div></div></div></div>

<div class="modal fade" id="paymentModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title"><i class="fa fa-money-bill"></i>Record Payment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="paymentLoanId"><label class="form-label">Amount Paid</label><input type="number" id="paymentAmount" class="form-control mb-3" placeholder="Enter payment amount"><label class="form-label">Payment Date</label><input type="date" id="paymentDate" class="form-control mb-3"><label class="form-label">Payment Method</label><select id="paymentMethod" class="form-select"><option>Cash</option><option>M-Pesa</option><option>Bank</option></select></div><div class="modal-footer"><button class="btn btn-success" onclick="savePayment()"><i class="fa fa-check"></i>Save Payment</button></div></div></div></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if(!AUTH.currentAdmin()){window.location.href="admin-portal.html";}
const admin=AUTH.currentAdmin();if(admin)document.getElementById("adminName").innerHTML=admin.username;
function money(v){return"KES "+Number(v||0).toLocaleString();}
const DEFAULT_IMG="https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

function showFullImage(src,title){if(!src){alert("No image available");return;}let m=document.createElement("div");m.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:pointer;";m.innerHTML=`<div style="max-width:90%;max-height:90%;text-align:center;"><h5 style="color:white;margin-bottom:10px;">${title}</h5><img src="${src}" style="max-width:100%;max-height:80vh;border-radius:10px;"><br><small style="color:#ccc;">Click anywhere to close</small></div>`;m.onclick=function(){document.body.removeChild(m);};document.body.appendChild(m);}

async function loadLateLoans(){
    let result=await api.getLoans();
    let table=document.getElementById("lateLoansTable");
    table.innerHTML="";
    
    if(!result.success||!result.loans){
        table.innerHTML='<tr><td colspan="10" class="text-center text-muted p-5">No late loans.</td></tr>';
        return;
    }
    
    let today=new Date();
    today.setHours(0,0,0,0);
    let lateCount=0;
    
    for(let l of result.loans){
        if(l.status!=="ACTIVE") continue;
        if(Number(l.remaining_principal||0)<=0) continue;
        if(!l.due_date) continue;
        
        let parts = String(l.due_date).split("T")[0].split("-");
        let dueDate = new Date(parts[0], parts[1]-1, parts[2]);
        dueDate.setHours(0,0,0,0);
        
        if(dueDate >= today) continue;
        
        let balance=Number(l.remaining_principal||0),rate=Number(l.interest_rate||20);
        let monthsDiff=0,checkDate=new Date(dueDate);
        while(true){checkDate.setMonth(checkDate.getMonth()+1);if(today<checkDate)break;monthsDiff++;}
        monthsDiff++;
        let monthlyInterest=(balance*rate)/100,totalOutstandingInterest=monthlyInterest*monthsDiff;
        let pResult=await api.getLoanPayments(l.id);
        let totalPaid=0;
        if(pResult.success&&Array.isArray(pResult.payments))pResult.payments.forEach(p=>{totalPaid+=Number(p.amount||0);});
        let remaining=totalOutstandingInterest-totalPaid;
        if(remaining<=0) continue;
        lateCount++;
        let daysLate=Math.floor((today-dueDate)/(1000*60*60*24));
        table.innerHTML+=`<tr><td>${lateCount}</td><td><b>${l.fullname||"?"}</b></td><td>${l.phone||"-"}</td><td>${money(l.original_principal)}</td><td>${money(balance)}</td><td>${money(monthlyInterest)}</td><td class="fw-bold">${money(remaining)}</td><td>${formatDate(l.due_date)}</td><td class="text-danger fw-bold">${daysLate}d</td><td><button class="btn btn-view btn-sm" onclick="viewLoan(${l.id})"><i class="fa fa-eye"></i></button> <button class="btn btn-payment btn-sm" onclick="openPayment(${l.id})"><i class="fa fa-money-bill"></i></button></td></tr>`;
    }
    if(lateCount===0)table.innerHTML='<tr><td colspan="10" class="text-center text-success p-5"><h5>No overdue loans!</h5></td></tr>';
}

async function viewLoan(id){
    let r=await api.getLoans();if(!r.success)return;let loan=r.loans.find(l=>l.id==id);if(!loan)return;
    let balance=Number(loan.remaining_principal||0),rate=Number(loan.interest_rate||20),currentInterest=(balance*rate)/100;
    let pResult=await api.getLoanPayments(id);
    let totalPaid=0,payments=pResult.success?pResult.payments:[];
    if(Array.isArray(payments))payments.forEach(p=>{totalPaid+=Number(p.amount||0);});
    let monthsOverdue=0;
    if(loan.due_date){let parts=String(loan.due_date).split("T")[0].split("-");let dueDate=new Date(parts[0],parts[1]-1,parts[2]);dueDate.setHours(0,0,0,0);let today=new Date();today.setHours(0,0,0,0);let checkDate=new Date(dueDate);while(true){checkDate.setMonth(checkDate.getMonth()+1);if(today<checkDate)break;monthsOverdue++;}monthsOverdue++;if(monthsOverdue<1)monthsOverdue=1;}
    let totalOutstandingInterest=currentInterest*monthsOverdue;
    let totalExpected=Number(loan.original_principal)+Number(loan.original_principal)*rate/100;
    let progress=totalExpected>0?Math.round((totalPaid/totalExpected)*100):0;
    let clientResult=await api.getClient(loan.client_id);
    let client=clientResult.success?clientResult.client:{};
    document.getElementById("loanDetails").innerHTML=`
        <h5 class="text-primary">Client Information</h5><hr>
        <div class="row"><div class="col-md-3 text-center"><img src="${client.profile_photo||DEFAULT_IMG}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #1976d2;"><h5>${client.fullname||loan.fullname||"-"}</h5></div><div class="col-md-9"><div class="row"><div class="col-md-6"><p><b>Phone:</b> ${client.phone||loan.phone||"-"}</p><p><b>National ID:</b> ${client.national_id||"-"}</p><p><b>Email:</b> ${client.email||"-"}</p></div><div class="col-md-6"><p><b>Occupation:</b> ${client.occupation||"-"}</p><p><b>Employer:</b> ${client.employer||"-"}</p><p><b>Monthly Income:</b> ${money(client.monthly_income)}</p></div></div><p><b>County:</b> ${client.county||"-"}</p><p><b>Address:</b> ${client.address||"-"}</p></div></div>
        <h5 class="text-primary mt-4">Loan Information</h5><hr>
        <div class="row"><div class="col-md-6"><p><b>Original:</b> ${money(loan.original_principal)}</p><p><b>Remaining:</b> ${money(balance)}</p><p><b>Monthly Interest:</b> ${money(currentInterest)}</p><p><b>Months Overdue:</b> <span class="text-danger fw-bold">${monthsOverdue} mo</span></p></div><div class="col-md-6"><p><b>Total Paid:</b> <span class="text-success fw-bold">${money(totalPaid)}</span></p><p><b>Total Outstanding Interest:</b> <span class="text-danger fw-bold">${money(totalOutstandingInterest)}</span></p><p><b>Progress:</b> ${progress}%</p></div></div>
        <p><b>Loan Date:</b> ${formatDate(loan.loan_date)}</p><p><b>Due Date:</b> <span class="text-danger fw-bold">${formatDate(loan.due_date)}</span></p><p><b>Status:</b> <span class="badge bg-danger">${loan.status}</span></p>
        <div class="progress mt-2 mb-3" style="height:10px;"><div class="progress-bar bg-success" style="width:${progress}%"></div></div>
        <h5 class="text-primary mt-4">Payment History</h5>
        <table class="table table-bordered"><tr><th>Date</th><th>Amount</th><th>Principal</th><th>Interest</th><th>Balance</th><th>Note</th></tr>${payments.length===0?'<tr><td colspan="6" class="text-center">No payments yet</td></tr>':payments.map(p=>`<tr><td>${formatDate(p.payment_date)}</td><td>${money(p.amount)}</td><td>${money(p.principal_paid)}</td><td>${money(p.interest_paid)}</td><td>${money(p.balance)}</td><td>${p.note||"-"}</td></tr>`).join("")}</table>`;
    new bootstrap.Modal(document.getElementById("loanModal")).show();
}

function openPayment(id){document.getElementById("paymentLoanId").value=id;document.getElementById("paymentAmount").value="";document.getElementById("paymentDate").value=new Date().toISOString().split("T")[0];new bootstrap.Modal(document.getElementById("paymentModal")).show();}

async function savePayment(){
    let loanId=document.getElementById("paymentLoanId").value;
    let amount=Number(document.getElementById("paymentAmount").value);
    let date=document.getElementById("paymentDate").value;
    let method=document.getElementById("paymentMethod").value;
    if(amount<=0){alert("Enter amount");return;}
    
    await api.addPayment({loanId,amount,paymentDate:date,method,note:"Late loan payment"});
    
    let r=await api.getLoans();
    let updatedLoan=null;
    if(r.success&&r.loans) updatedLoan=r.loans.find(l=>l.id==loanId);
    
    if(updatedLoan){
        let newDue=updatedLoan.due_date;
        let today=new Date();
        today.setHours(0,0,0,0);
        let parts=String(newDue).split("T")[0].split("-");
        let dueDate=new Date(parts[0],parts[1]-1,parts[2]);
        
        if(dueDate>today){
            alert("✅ Outstanding balance cleared!\n\nNext due date updated to: "+formatDate(newDue)+"\n\nLoan moved to Active Loans.");
        }else{
            alert("✅ Payment recorded!\n\nRemaining overdue. Pay more to advance due date.");
        }
    }else{
        alert("✅ Payment recorded!");
    }
    
    bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();
    loadLateLoans();
}

function logout(){AUTH.adminLogout();}
loadLateLoans();
</script>
</body>
</html>
