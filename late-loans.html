<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejja Credit | Late Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0d47a1; --primary-light: #1976d2; --success: #198754; --warning: #ffc107; --danger: #dc3545; --white: #ffffff; --bg-light: #edf4ff; --shadow: 0 8px 25px rgba(0,0,0,0.12); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-light); font-family: 'Segoe UI', Tahoma, sans-serif; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: linear-gradient(180deg, #0a3d8f, #0d47a1, #1565c0); color: var(--white); z-index: 1000; overflow-y: auto; }
        .logo { padding: 22px 20px; font-size: 20px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; gap: 10px; }
        .logo i { color: #ffc107; font-size: 24px; }
        .sidebar a { display: flex; align-items: center; padding: 13px 20px; color: rgba(255,255,255,0.85); text-decoration: none; transition: all 0.3s; font-size: 14px; font-weight: 500; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.1); color: var(--white); border-left-color: #ffc107; padding-left: 25px; }
        .sidebar a i { width: 22px; margin-right: 10px; }
        .main { margin-left: 260px; min-height: 100vh; }
        .topbar { height: 65px; background: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 999; }
        .topbar h3 { font-weight: 700; color: var(--danger); margin: 0; }
        .topbar .btn-back { background: var(--bg-light); color: var(--primary); padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; }
        .topbar .btn-back:hover { background: var(--primary); color: var(--white); }
        .content { padding: 25px; }
        .table-card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
        .table-header { background: var(--danger); color: var(--white); padding: 16px 22px; font-size: 18px; font-weight: 700; }
        .table th { background: #fff5f5; color: var(--danger); font-weight: 600; font-size: 12px; text-align: center; padding: 10px; }
        .table td { text-align: center; vertical-align: middle; font-size: 13px; padding: 10px; }
        .severity-critical { background: #fff0f0 !important; }
        .severity-high { background: #fff8f0 !important; }
        .severity-medium { background: #fffef0 !important; }
        .btn-payment { background: var(--success); color: var(--white); border-radius: 20px; font-size: 12px; padding: 6px 14px; }
        .btn-details { background: var(--primary-light); color: var(--white); border-radius: 20px; font-size: 12px; padding: 6px 14px; }
        @media (max-width: 992px) { .sidebar { transform: translateX(-100%); } .sidebar.show { transform: translateX(0); } .main { margin-left: 0; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fa-solid fa-building-columns"></i>Bejja Credit</div>
        <a href="admin-dashboard.html"><i class="fa fa-dashboard"></i>Dashboard</a>
        <a href="registered-clients.html"><i class="fa fa-users"></i>Registered Clients</a>
        <a href="active-loans.html"><i class="fa fa-money-bill-wave"></i>Active Loans</a>
        <a href="late-loans.html" class="active"><i class="fa fa-triangle-exclamation"></i>Late Loans</a>
        <a href="total-loans.html"><i class="fa fa-file-invoice"></i>Total Loans</a>
        <a href="loan-applications.html"><i class="fa fa-file-circle-check"></i>Applications</a>
        <a href="statistics.html"><i class="fa fa-chart-column"></i>Statistics</a>
        <a href="#" onclick="logout()"><i class="fa fa-right-from-bracket"></i>Logout</a>
    </div>

    <div class="main">
        <div class="topbar">
            <h3><i class="fa fa-triangle-exclamation"></i> Late Loans</h3>
            <div class="d-flex align-items-center gap-3">
                <a href="admin-dashboard.html" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a>
                <span>Welcome, <strong id="adminName">Admin</strong></span>
            </div>
        </div>

        <div class="content">
            <div class="table-card">
                <div class="table-header"><i class="fa fa-list"></i> Overdue Loan Clients</div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th><th>Client</th><th>Phone</th><th>Amount</th>
                                <th>Balance</th><th>Overdue Amt</th><th>Paid So Far</th>
                                <th>Due Date</th><th>Days Late</th><th>Severity</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="lateLoansTable">
                            <tr><td colspan="11" class="text-center text-muted p-5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="paymentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fa fa-money-bill"></i> Record Payment</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="paymentLoanId">
                    <div class="alert alert-info" id="loanInfo"></div>
                    <div class="alert alert-warning" id="paymentHint"></div>
                    <label class="form-label">Amount (KSh)</label>
                    <input type="number" id="paymentAmount" class="form-control mb-3" placeholder="Enter amount" min="100">
                    <label class="form-label">Payment Method</label>
                    <select id="paymentMethod" class="form-select mb-3">
                        <option value="Cash">Cash</option>
                        <option value="M-Pesa">M-Pesa</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="savePayment()"><i class="fa fa-check"></i> Save Payment</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fa fa-info-circle"></i> Payment Details</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailsContent"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        if (!AUTH.currentAdmin()) { window.location.href = "admin-portal.html"; }
        let admin = AUTH.currentAdmin();
        if (admin) document.getElementById("adminName").innerHTML = admin.username;

        function money(v) { return "KES " + Number(v || 0).toLocaleString("en-KE", { minimumFractionDigits: 2 }); }

        function getSeverity(days) {
            if (days >= 90) return { level: 'critical', label: 'Critical', color: 'danger' };
            if (days >= 30) return { level: 'high', label: 'High', color: 'warning' };
            return { level: 'medium', label: 'Medium', color: 'info' };
        }

        async function loadLateLoans() {
            let result = await api.getLoans();
            let table = document.getElementById("lateLoansTable");
            table.innerHTML = "";

            if (!result.success || !result.loans) {
                table.innerHTML = '<tr><td colspan="11" class="text-center p-4">No late loans.</td></tr>';
                return;
            }

            let today = new Date();
            today.setHours(0, 0, 0, 0);
            let lateCount = 0;

            for (let l of result.loans) {
                if (l.status !== "ACTIVE") continue;
                if (Number(l.remaining_principal || 0) <= 0) continue;
                if (!l.due_date) continue;
                
                let dueDate = new Date(l.due_date);
                dueDate.setHours(0, 0, 0, 0);
                if (dueDate >= today) continue;

                let balance = Number(l.remaining_principal || 0);
                let rate = Number(l.interest_rate || 20);
                let daysLate = Math.floor((today - dueDate) / (1000 * 60 * 60 * 24));
                let monthlyInterest = (balance * rate) / 100;

                let monthsOverdue = 1;
                let checkDate = new Date(dueDate);
                while (true) {
                    checkDate.setMonth(checkDate.getMonth() + 1);
                    if (today < checkDate) break;
                    monthsOverdue++;
                }

                let totalOutstandingInterest = monthlyInterest * monthsOverdue;

                let totalPaid = 0;
                try {
                    let pResult = await api.getLoanPayments(l.id);
                    if (pResult.success && Array.isArray(pResult.payments)) {
                        pResult.payments.forEach(p => { totalPaid += Number(p.amount || 0); });
                    }
                } catch (e) {}

                let remaining = totalOutstandingInterest - totalPaid;
                if (remaining <= 0) continue;

                lateCount++;
                let severity = getSeverity(daysLate);
                let severityRow = severity.level === 'critical' ? 'severity-critical' : 
                                 severity.level === 'high' ? 'severity-high' : 'severity-medium';

                table.innerHTML += `
                    <tr class="${severityRow}">
                        <td>${lateCount}</td>
                        <td><b>${l.fullname || "Unknown"}</b></td>
                        <td>${l.phone || "-"}</td>
                        <td>${money(l.original_principal)}</td>
                        <td class="text-danger fw-bold">${money(balance)}</td>
                        <td class="fw-bold text-danger">${money(remaining)}</td>
                        <td class="text-success">${money(totalPaid)}</td>
                        <td><span class="text-danger">${formatDate(l.due_date)}</span></td>
                        <td class="fw-bold text-danger">${daysLate}d</td>
                        <td><span class="badge bg-${severity.color}">${severity.label}</span></td>
                        <td>
                            <button class="btn btn-details btn-sm me-1" onclick="viewDetails(${l.id})">
                                <i class="fa fa-info-circle"></i>
                            </button>
                            <button class="btn btn-payment btn-sm" onclick="openPayment(${l.id}, ${balance}, ${rate}, ${remaining}, ${totalOutstandingInterest})">
                                <i class="fa fa-money-bill"></i> Pay
                            </button>
                        </td>
                    </tr>
                `;
            }

            if (lateCount === 0) {
                table.innerHTML = '<tr><td colspan="11" class="text-center text-success p-5"><h5>✅ No overdue loans!</h5></td></tr>';
            }
        }

        function openPayment(loanId, balance, rate, remaining, totalOutstanding) {
            document.getElementById("paymentLoanId").value = loanId;
            document.getElementById("paymentAmount").value = "";
            document.getElementById("loanInfo").innerHTML = `
                <strong>Balance:</strong> ${money(balance)}<br>
                <strong>Rate:</strong> ${rate}%<br>
                <strong>Monthly Interest:</strong> ${money((balance * rate) / 100)}<br>
                <strong>Total Overdue Interest:</strong> ${money(totalOutstanding)}<br>
                <strong>Remaining to Clear:</strong> ${money(remaining)}
            `;
            document.getElementById("paymentHint").innerHTML = `
                <i class="fa fa-info-circle"></i> Pay <b>${money(remaining)}</b> to clear overdue and advance due date.
            `;
            new bootstrap.Modal(document.getElementById("paymentModal")).show();
        }

        async function savePayment() {
            let loanId = document.getElementById("paymentLoanId").value;
            let amount = Number(document.getElementById("paymentAmount").value);
            let method = document.getElementById("paymentMethod").value;
            if (amount <= 0) { alert("Enter valid amount"); return; }

            await api.addPayment({
                loanId, amount,
                paymentDate: new Date().toISOString().split("T")[0],
                method, note: "Late loan payment"
            });

            // Check updated loan
            let updatedLoan = await api.getLoan(loanId);
            
            if (updatedLoan.success && updatedLoan.loan) {
                let newDue = new Date(updatedLoan.loan.due_date);
                let today = new Date();
                today.setHours(0, 0, 0, 0);
                
                if (newDue >= today) {
                    alert("✅ Payment recorded!\nDue date advanced to: " + formatDate(updatedLoan.loan.due_date) + "\nLoan moved to Active Loans.");
                } else {
                    alert("✅ Payment recorded!\nStill overdue. Pay more to advance due date.");
                }
            } else {
                alert("✅ Payment recorded!");
            }
            
            bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();
            loadLateLoans();
        }

        async function viewDetails(loanId) {
            let pResult = await api.getLoanPayments(loanId);
            let payments = pResult.success ? (pResult.payments || []) : [];
            let totalPaid = 0;
            payments.forEach(p => { totalPaid += Number(p.amount || 0); });

            document.getElementById("detailsContent").innerHTML = `
                <h6 class="fw-bold">Payment History (${payments.length} payments)</h6>
                <p><strong>Total Paid:</strong> ${money(totalPaid)}</p>
                <table class="table table-bordered table-striped">
                    <thead class="table-light">
                        <tr><th>Date</th><th>Amount</th><th>Principal</th><th>Interest</th><th>Balance</th><th>Method</th></tr>
                    </thead>
                    <tbody>
                        ${payments.length === 0 ? '<tr><td colspan="6" class="text-center">No payments yet</td></tr>' :
                        payments.map(p => `
                            <tr>
                                <td>${formatDate(p.payment_date)}</td>
                                <td class="fw-bold">${money(p.amount)}</td>
                                <td>${money(p.principal_paid)}</td>
                                <td>${money(p.interest_paid)}</td>
                                <td>${money(p.balance)}</td>
                                <td>${p.method || p.payment_method || "-"}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
            new bootstrap.Modal(document.getElementById("detailsModal")).show();
        }

        function logout() { if (confirm("Logout?")) AUTH.adminLogout(); }
        loadLateLoans();
    </script>
</body>
</html>
