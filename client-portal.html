<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | Bejja Loan Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d47a1;
            --primary-light: #1976d2;
            --white: #ffffff;
            --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a3d8f, #0d47a1, #1565c0, #1976d2);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 100%; }
        }

        .portal-card {
            background: var(--white);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 38px;
            color: var(--white);
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
        }

        .logo-subtitle {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
            border: 2px solid #e8ecf4;
            font-size: 14px;
            font-weight: 500;
            background: #fafbfe;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(25,118,210,0.08);
        }

        .input-group-text {
            background: #f8faff;
            border: 2px solid #e8ecf4;
            border-right: none;
            color: var(--primary);
        }

        .btn-login {
            height: 52px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            color: var(--white);
            transition: var(--transition);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(13,71,161,0.35);
        }

        .btn-register {
            height: 48px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--primary);
            color: var(--primary);
            background: transparent;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-3px);
        }

        .error-box {
            background: #fff5f5;
            border: 2px solid #fecaca;
            color: #dc3545;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }

        .error-box.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: var(--transition);
        }

        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="portal-card">
        <!-- Logo -->
        <div class="logo-icon">
            <i class="fa-solid fa-building-columns"></i>
        </div>
        <h3 class="logo-title">BEJJA LOAN CREDIT</h3>
        <p class="logo-subtitle">Client Portal Login</p>

        <!-- Error Box -->
        <div class="error-box" id="errorBox">
            <i class="fa fa-exclamation-circle"></i>
            <span id="errorMessage"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label class="fw-semibold">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-phone"></i></span>
                    <input type="tel" id="phone" class="form-control" placeholder="07XXXXXXXX" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="fa fa-right-to-bracket me-2"></i>Secure Login
            </button>
        </form>

        <hr class="my-4">

        <!-- Register Button -->
        <div class="text-center">
            <p class="text-muted mb-3">Don't have an account?</p>
            <a href="register.html" class="btn-register">
                <i class="fa fa-user-plus"></i> Create New Account
            </a>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-4">
            <a href="index.html" class="back-link">
                <i class="fa fa-arrow-left"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            let errorBox = document.getElementById("errorBox");
            let errorMessage = document.getElementById("errorMessage");
            
            errorBox.classList.remove("show");
            
            let phone = document.getElementById("phone").value.trim();
            let password = document.getElementById("password").value;
            
            if (!phone) {
                errorMessage.textContent = "Please enter your phone number.";
                errorBox.classList.add("show");
                return;
            }
            
            if (!password) {
                errorMessage.textContent = "Please enter your password.";
                errorBox.classList.add("show");
                return;
            }
            
            try {
                let result = await AUTH.clientLogin(phone, password);
                
                if (!result.success) {
                    errorMessage.textContent = result.message || "Login failed.";
                    errorBox.classList.add("show");
                    return;
                }
                
                window.location.href = "client-dashboard.html";
            } catch (error) {
                errorMessage.textContent = "An error occurred. Please try again.";
                errorBox.classList.add("show");
            }
        });
        
        // Check if already logged in
        if (AUTH.currentClient()) {
            window.location.href = "client-dashboard.html";
        }
    </script>
</body>
</html>
